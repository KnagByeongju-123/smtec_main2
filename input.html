<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>입력 폼</title>
<style>
  :root{
    --ink:#12233b; --line:#c9d4e2; --bg:#eef2f6; --panel:#ffffff;
    --accent:#0b5fa5; --ok:#1f7a4d; --muted:#5f7189;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:28px;background:var(--bg);color:var(--ink);
       font-family:"Malgun Gothic","맑은 고딕",system-ui,sans-serif;}
  .wrap{max-width:760px;margin:0 auto}
  h1{font-size:20px;letter-spacing:-.4px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 18px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:22px}
  .row{display:flex;align-items:center;gap:14px;margin-bottom:14px}
  label{width:90px;flex:none;font-size:14px;font-weight:600}
  input,textarea{flex:1;padding:10px 12px;font-size:14px;border:1px solid var(--line);
    border-radius:4px;background:#fbfcfe;font-family:inherit}
  input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;background:#fff}
  textarea{height:64px;resize:vertical}
  .btns{display:flex;gap:10px;margin-top:18px}
  button{padding:11px 22px;font-size:14px;font-weight:700;border:0;border-radius:4px;cursor:pointer;font-family:inherit}
  #saveBtn{background:var(--accent);color:#fff}
  #clearBtn{background:#e3e9f0;color:var(--ink)}
  table{width:100%;border-collapse:collapse;margin-top:24px;font-size:13px;background:var(--panel)}
  th,td{border:1px solid var(--line);padding:7px 9px;text-align:left}
  th{background:#dde5ee}
  .count{margin-top:10px;font-size:13px;color:var(--ok);font-weight:700}
  .coord{position:fixed;right:14px;bottom:14px;background:#12233b;color:#9fd0ff;
    font:12px/1.4 Consolas,monospace;padding:6px 10px;border-radius:4px}
</style>
</head>
<body>
<div class="wrap">
  <h1>거래처 등록 폼</h1>
  <p class="sub">파이썬 자동입력 대상 화면 — 브라우저를 전체화면으로 고정한 뒤 좌표를 등록하세요.</p>

  <div class="panel">
    <div class="row"><label for="name">이름</label><input id="name" type="text"></div>
    <div class="row"><label for="dept">부서</label><input id="dept" type="text"></div>
    <div class="row"><label for="phone">전화번호</label><input id="phone" type="text"></div>
    <div class="row"><label for="email">이메일</label><input id="email" type="text"></div>
    <div class="row"><label for="memo">메모</label><textarea id="memo"></textarea></div>
    <div class="btns">
      <button id="saveBtn" onclick="saveRow()">저장</button>
      <button id="clearBtn" onclick="clearForm()">비우기</button>
    </div>
  </div>

  <div class="count" id="count">저장 건수: 0</div>
  <table id="tb">
    <thead><tr><th>#</th><th>이름</th><th>부서</th><th>전화번호</th><th>이메일</th><th>메모</th></tr></thead>
    <tbody></tbody>
  </table>
</div>

<div class="coord" id="coord">x: 0, y: 0</div>

<script>
const F = ["name","dept","phone","email","memo"];
let n = 0;

function saveRow(){
  const v = F.map(id => document.getElementById(id).value.trim());
  if (v.every(s => s === "")) return;
  n++;
  const tr = document.createElement("tr");
  tr.innerHTML = "<td>" + n + "</td>" + v.map(s => "<td>" + s.replace(/</g,"&lt;") + "</td>").join("");
  document.querySelector("#tb tbody").appendChild(tr);
  document.getElementById("count").textContent = "저장 건수: " + n;
  clearForm();
}
function clearForm(){ F.forEach(id => document.getElementById(id).value = ""); }

document.addEventListener("mousemove", e => {
  document.getElementById("coord").textContent = "x: " + e.screenX + ", y: " + e.screenY;
});
</script>
</body>
</html>
