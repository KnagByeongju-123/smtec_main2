<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>금형수리 이력 v3.3</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1117;--card:#1a1d27;--card2:#222838;--border:#2a2e3d;--txt:#e8eaf0;--sub:#8b8fa3;--accent:#fb923c;--green:#22c55e;--red:#ef4444;--yellow:#eab308}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;padding-bottom:40px}
.hdr{padding:14px 16px;background:linear-gradient(135deg,#9a3412,#431407);display:flex;justify-content:space-between;align-items:center}
.hdr h1{font-size:17px;font-weight:800;color:#fff}.hdr .sub{font-size:11px;color:#fdba74;margin-top:2px}
.ver{font-size:10px;font-weight:700;color:#fdba74;background:rgba(0,0,0,.3);padding:2px 8px;border-radius:8px}
.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
.tab{flex:1;padding:13px;text-align:center;font-size:14px;font-weight:700;color:var(--sub);cursor:pointer;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.wrap{max-width:560px;margin:0 auto;padding:14px}
.panel{display:none}.panel.on{display:block}
.auto{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.auto .row{display:grid;grid-template-columns:72px 1fr;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.auto .row:last-child{border-bottom:none}
.auto .k{font-size:12px;color:var(--sub);font-weight:700}
.auto select,.auto input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:#0f1117;color:var(--txt);font-size:16px;font-weight:700;font-family:inherit}
.auto select:focus,.auto input:focus,.in:focus,.ta:focus{outline:none;border-color:var(--accent)}
.auto .hint{grid-column:2;font-size:11px;color:var(--sub);margin-top:-2px}
.auto .hint.ok{color:#4ade80}
.fg{margin-bottom:14px}
.lb{display:block;font-size:12px;font-weight:700;color:var(--sub);margin-bottom:6px}.lb .rq{color:#f87171}
.in,.ta{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--border);background:#0f1117;color:var(--txt);font-size:16px;font-family:inherit}
.ta{min-height:80px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--card);border:1.5px solid var(--border);border-radius:20px;padding:10px 15px;font-size:13px;font-weight:700;color:#c4c6d4;cursor:pointer;user-select:none}
.chip.on{background:rgba(251,146,60,.18);border-color:var(--accent);color:#fdba74}
.urg{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;border:1.5px solid var(--border);background:var(--card);cursor:pointer;user-select:none;margin-bottom:14px;font-size:13px;font-weight:700;color:#c4c6d4}
.urg .bx{width:20px;height:20px;border-radius:6px;border:2px solid #64748b;display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent}
.urg.on{border-color:var(--red);background:rgba(239,68,68,.12);color:#fca5a5}.urg.on .bx{border-color:var(--red);background:var(--red);color:#fff}
.ph{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:120px;border:2px dashed #475569;border-radius:12px;background:#0f1117;color:var(--sub);font-size:12px;overflow:hidden;cursor:pointer}
.ph input{position:absolute;inset:0;opacity:0;cursor:pointer}
.ph img{max-width:100%;max-height:260px;display:block}.ph .ic{font-size:30px}
.ph-x{position:absolute;top:6px;right:6px;z-index:2;background:rgba(0,0,0,.7);color:#fff;border:none;border-radius:50%;width:28px;height:28px;font-size:14px;cursor:pointer}
.ph-meta{font-size:11px;color:var(--sub);text-align:center;margin-top:5px}
.btn{width:100%;padding:14px;border-radius:12px;border:none;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;color:#fff;background:linear-gradient(135deg,#ea580c,#c2410c)}
.btn:disabled{opacity:.5}
.btn.gray{background:#475569}.btn.green{background:linear-gradient(135deg,#22c55e,#16a34a)}
/* 수리내역 */
.flt{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.fb{padding:7px 13px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--sub);font-size:12px;font-weight:700;cursor:pointer}
.fb.on{background:var(--accent);color:#1c0a00;border-color:var(--accent)}
.item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.item:active{transform:scale(.99)}
.item img{width:56px;height:56px;object-fit:cover;border-radius:8px;flex-shrink:0;background:#000}
.item .b{flex:1;min-width:0}
.item .t{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:3px}
.item .mold{font-size:14px;font-weight:800;color:#fff}
.item .date{font-size:11px;color:var(--sub)}
.item .c{font-size:12px;color:#c4c6d4;line-height:1.4;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.item .m{font-size:11px;color:var(--sub);margin-top:4px}
.st{font-size:10px;font-weight:800;padding:2px 8px;border-radius:6px;white-space:nowrap}
.st.wait{background:rgba(234,179,8,.18);color:#fde047}.st.ing{background:rgba(56,189,248,.18);color:#7dd3fc}.st.done{background:rgba(34,197,94,.18);color:#86efac}
.urgtag{font-size:10px;font-weight:800;color:#fca5a5;background:rgba(239,68,68,.18);padding:2px 6px;border-radius:6px;margin-right:4px}
.empty{text-align:center;color:var(--sub);padding:40px 0;font-size:13px}
/* 상세 */
.modal{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.8);padding:16px;overflow-y:auto}
.modal.on{display:flex;align-items:flex-start;justify-content:center}
.box{background:var(--card);border:1px solid var(--border);border-radius:14px;width:100%;max-width:520px;margin:auto;overflow:hidden}
.bh{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.bh h3{font-size:15px;color:#fff}
.x{background:rgba(255,255,255,.08);border:none;color:#fff;width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer}
.bb{padding:14px 16px}
.dl{display:grid;grid-template-columns:72px 1fr;gap:6px 10px;font-size:13px;margin-bottom:12px}
.dl .k{color:var(--sub);font-weight:700}.dl .v{color:var(--txt);font-weight:600;word-break:break-all}
.bb img{width:100%;border-radius:10px;margin-bottom:12px;display:block}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.92);color:#fff;padding:10px 22px;border-radius:20px;font-size:12px;font-weight:600;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
@media(min-width:600px){.wrap{padding:20px}}
</style>
</head>
<body>
<div class="hdr"><div><h1>🔧 금형수리 이력</h1><div class="sub" id="hsub">설비 · 금형 · 작업자 자동 입력</div></div><span class="ver">v3.3</span></div>
<div class="tabs">
  <div class="tab on" id="tabReg" onclick="showTab('reg')">📝 수리등록</div>
  <div class="tab" id="tabList" onclick="showTab('list')">📋 수리내역</div>
</div>

<div class="wrap">
<!-- 수리등록 -->
<div class="panel on" id="pReg">
  <div class="auto">
    <div class="row"><div class="k">설비호기</div><select id="fMachine" onchange="onMachineChange()"><option value="">⏳ 설비 불러오는 중...</option></select></div>
    <div class="row"><div class="k">금형제번</div><input id="fMold" placeholder="금형번호" autocomplete="off"></div>
    <div class="hint" id="moldHint"></div>
    <div class="row"><div class="k">작업자</div><input id="fWorker" placeholder="이름" autocomplete="off"></div>
  </div>
  <div class="fg"><label class="lb">수리유형 <span class="rq">*</span></label><div class="chips" id="fTypes"></div></div>
  <div class="fg"><label class="lb">수리내용</label><textarea class="ta" id="fContent" placeholder="비워두면 수리유형으로 자동 입력"></textarea></div>
  <div class="fg"><label class="lb">📷 수리 사진</label><div class="ph" id="ph"></div><div class="ph-meta" id="phMeta">자동 압축 · 50KB 이하로 저장</div></div>
  <button class="btn" id="btnSave" onclick="submitRepair()">💾 수리이력 등록</button>
</div>

<!-- 수리내역 -->
<div class="panel" id="pList">
  <div class="flt">
    <div class="fb on" data-f="mold" onclick="setFilter(this)">이 금형</div>
    <div class="fb" data-f="all" onclick="setFilter(this)">전체</div>
    <div class="fb" onclick="loadRepairs(true)" style="margin-left:auto">🔄</div>
  </div>
  <div id="list"><div class="empty">⏳ 조회중...</div></div>
</div>
</div>

<!-- 상세 -->
<div class="modal" id="dm" onclick="if(event.target===this)closeDetail()">
  <div class="box">
    <div class="bh"><h3 id="dTitle">수리 상세</h3><button class="x" onclick="closeDetail()">✕</button></div>
    <div class="bb" id="dBody"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ── 저장소 ─────────────────────────────────────────────
   설비현황: 모니터링 프로젝트 machine_status (호기·금형·작업자 자동)
   수리이력: 금형수리 프로젝트 kv_store 'repair_history_v2' (금형수리관리와 공유)
   사진:    Storage 버킷 'mold-repair-photos' (50KB 이하 JPEG)
───────────────────────────────────────────────────── */
var MON_URL='https://omngtyewdaqpphnzeate.supabase.co';
var MON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9tbmd0eWV3ZGFxcHBobnplYXRlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4ODk4ODksImV4cCI6MjA5MDQ2NTg4OX0.Zxur3t02JHtOcXforCMSwO3i2mMaf5sViE0tXXUC0-s';
var REP_URL='https://ebthltdmxpzlkfwvdloz.supabase.co';
var REP_KEY='sb_publishable_ZSgcZapb7cTgFezGmOV_ow_9MT15SnS';
var BUCKET='mold-repair-photos';
var DEF_TYPES=["크랙수리","마모교체","파손교체","용접보수","연마","치수수정","세척정비","기타"];

var S={machines:[],molds:[],type:'',photo:null,repairs:[],filter:'mold',saving:false};
function H(k){return{'apikey':k,'Authorization':'Bearer '+k}}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
var tt;function toast(m,ms){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},ms||2200)}
function $(id){return document.getElementById(id)}
function hoOf(m){var mt=(m.machine_name||'').match(/^(\d{1,3})/);return mt?parseInt(mt[1],10):999}

function showTab(t){
  $('tabReg').classList.toggle('on',t==='reg');$('tabList').classList.toggle('on',t==='list');
  $('pReg').classList.toggle('on',t==='reg');$('pList').classList.toggle('on',t==='list');
  if(t==='list')loadRepairs();
}

/* ── 현재 사용자 (ESG 메인 잠금해제 > URL > 이전값) ── */
function currentUser(){
  try{
    var a=JSON.parse(localStorage.getItem('esg_pin_auth')||'null');
    if(a&&a.exp>Date.now()&&a.name)return a.name;
    var p=new URLSearchParams(location.search);
    return p.get('worker')||p.get('user')||p.get('name')||localStorage.getItem('mr_worker')||'';
  }catch(e){return ''}
}

/* ── 설비 목록 → 호기/금형/작업자 자동 ── */
async function loadMachines(){
  var sel=$('fMachine');
  try{
    var r=await fetch(MON_URL+'/rest/v1/machine_status?select=machine_code,machine_name,current_mold,current_item_code,item_name,worker,customer&order=machine_code.asc',{headers:H(MON_KEY)});
    if(!r.ok)throw new Error('HTTP '+r.status);
    S.machines=(await r.json()).filter(function(m){return m.machine_name}).sort(function(a,b){return hoOf(a)-hoOf(b)});
    sel.innerHTML='<option value="">설비 선택</option>'+S.machines.map(function(m){
      return '<option value="'+esc(m.machine_code)+'">'+esc(m.machine_name)+(m.current_mold?' · '+esc(m.current_mold):'')+'</option>';
    }).join('');
    var p=new URLSearchParams(location.search);
    var want=p.get('machine_code')||localStorage.getItem('mr_machine')||'';
    if(want&&S.machines.some(function(m){return m.machine_code===want})){sel.value=want;onMachineChange();}
    if(p.get('mold'))$('fMold').value=p.get('mold');
  }catch(e){
    sel.innerHTML='<option value="">⚠️ 설비 조회 실패</option>';
    toast('설비 조회 실패: '+e.message,3000);
  }
  var u=currentUser();if(u&&!$('fWorker').value)$('fWorker').value=u;
}
function curMachine(){var c=$('fMachine').value;return S.machines.find(function(m){return m.machine_code===c})||null}
function onMachineChange(){
  var m=curMachine();if(!m)return;
  localStorage.setItem('mr_machine',m.machine_code);
  $('fMold').value=m.current_mold||'';
  if(m.worker)$('fWorker').value=m.worker;
  $('hsub').textContent=m.machine_name+(m.current_item_code?' · '+m.current_item_code:'')+(m.item_name?' · '+m.item_name:'');
  moldHint();
}
function moldHint(){
  var v=$('fMold').value.trim(),el=$('moldHint');
  if(!v){el.className='hint';el.textContent='';return;}
  var f=S.molds.find(function(o){return String(o['금형번호']).trim().toUpperCase()===v.toUpperCase()});
  if(f){el.className='hint ok';el.textContent='✓ '+(f['금형명']||'등록 금형')+(f['고객사']?' · '+f['고객사']:'');}
  else{el.className='hint';el.textContent=S.molds.length?'금형 DB에 없는 번호 (등록은 가능)':'';}
}
$('fMold').addEventListener('input',moldHint);

/* ── 수리유형 / 금형 DB ── */
function renderTypes(list){
  $('fTypes').innerHTML=list.map(function(t){return '<div class="chip'+(S.type===t?' on':'')+'" onclick="pickType(this)">'+esc(t)+'</div>'}).join('');
}
function pickType(el){S.type=el.textContent;document.querySelectorAll('#fTypes .chip').forEach(function(c){c.classList.toggle('on',c===el)})}
async function loadMaster(){
  try{
    var r=await fetch(REP_URL+'/rest/v1/kv_store?key=in.(repair_types,mold_db_v2)&select=key,value',{headers:H(REP_KEY)});
    if(!r.ok)return;
    (await r.json()).forEach(function(x){
      if(x.key==='repair_types'&&Array.isArray(x.value)&&x.value.length)renderTypes(x.value.concat(DEF_TYPES.filter(function(t){return x.value.indexOf(t)<0})));
      if(x.key==='mold_db_v2'&&Array.isArray(x.value))S.molds=x.value.filter(function(o){return o&&o['금형번호']});
    });
    moldHint();
  }catch(e){}
}

/* ── 사진: 50KB 이하 압축 ── */
function shrinkImage(src,limit){
  limit=limit||49*1024;
  return new Promise(function(resolve,reject){
    var img=new Image(),url=(typeof src==='string')?src:URL.createObjectURL(src);
    img.onload=function(){
      if(typeof src!=='string')URL.revokeObjectURL(url);
      var side=1280,q=0.72,tries=0,cv=document.createElement('canvas'),ctx=cv.getContext('2d');
      function step(){
        var w=img.naturalWidth||img.width,h=img.naturalHeight||img.height,r=Math.min(1,side/Math.max(w,h));
        cv.width=Math.max(1,Math.round(w*r));cv.height=Math.max(1,Math.round(h*r));
        ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);ctx.drawImage(img,0,0,cv.width,cv.height);
        cv.toBlob(function(b){
          if(!b){reject(new Error('압축 실패'));return;}
          tries++;
          if(b.size<=limit||tries>=30){
            if(b.size>limit){reject(new Error('50KB 이하로 줄이지 못했습니다'));return;}
            resolve({blob:b,w:cv.width,h:cv.height,sizeKB:Math.round(b.size/102.4)/10});return;
          }
          if(q>0.45){q-=0.12;}else{side=Math.max(120,Math.round(side*Math.max(0.5,Math.sqrt(limit/b.size)*0.92)));q=0.55;}
          step();
        },'image/jpeg',q);
      }
      step();
    };
    img.onerror=function(){reject(new Error('이미지 로드 실패'))};
    img.src=url;
  });
}
function blobToDataUrl(b){return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){res(fr.result)};fr.onerror=function(){rej(new Error('변환 실패'))};fr.readAsDataURL(b)})}
function renderPhoto(){
  var box=$('ph'),p=S.photo;
  if(p){box.innerHTML='<img src="'+p.preview+'"><button class="ph-x" onclick="event.stopPropagation();S.photo=null;renderPhoto()">✕</button>';$('phMeta').textContent='압축 완료 '+p.sizeKB+'KB · '+p.w+'×'+p.h;}
  else{box.innerHTML='<div class="ic">📷</div><div>탭하여 사진 추가</div><input type="file" accept="image/*" onchange="pickPhoto(this)">';$('phMeta').textContent='자동 압축 · 50KB 이하로 저장';}
}
async function pickPhoto(inp){
  var f=inp.files&&inp.files[0];if(!f)return;
  if(!/^image\//.test(f.type)){toast('이미지 파일만 가능합니다');return;}
  $('phMeta').textContent='⏳ 압축 중...';
  try{var r=await shrinkImage(f);r.preview=URL.createObjectURL(r.blob);S.photo=r;renderPhoto();}
  catch(e){toast('사진 처리 실패: '+e.message);renderPhoto();}
}
async function uploadPhoto(p,tag){
  var safe=String(tag||'mold').replace(/[^A-Za-z0-9_-]/g,'_').slice(0,40);
  var path=today().slice(0,7)+'/'+safe+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)+'.jpg';
  try{
    var h=H(REP_KEY);h['Content-Type']='image/jpeg';h['x-upsert']='false';h['cache-control']='31536000';
    var r=await fetch(REP_URL+'/storage/v1/object/'+BUCKET+'/'+path,{method:'POST',headers:h,body:p.blob});
    if(!r.ok)throw new Error('HTTP '+r.status);
    return{url:REP_URL+'/storage/v1/object/public/'+BUCKET+'/'+path,storage:true};
  }catch(e){return{url:await blobToDataUrl(p.blob),storage:false};}
}

/* ── 수리이력 읽기/쓰기 (kv_store repair_history_v2) ── */
function repairKey(r){return(r['금형번호']||'')+'|'+(r['수리일자']||'')+'|'+(r['수리내용']||'')}
async function fetchRepairs(){
  var r=await fetch(REP_URL+'/rest/v1/kv_store?key=eq.repair_history_v2&select=value',{headers:H(REP_KEY)});
  if(!r.ok)throw new Error('수리이력 조회 실패 HTTP '+r.status);
  var js=await r.json();
  return(js[0]&&Array.isArray(js[0].value))?js[0].value:[];
}
async function saveRepairs(arr){
  var h=H(REP_KEY);h['Content-Type']='application/json';h['Prefer']='resolution=merge-duplicates,return=minimal';
  var w=await fetch(REP_URL+'/rest/v1/kv_store?on_conflict=key',{method:'POST',headers:h,body:JSON.stringify({key:'repair_history_v2',value:arr})});
  if(!w.ok)throw new Error('저장 실패 HTTP '+w.status);
}

async function submitRepair(){
  if(S.saving)return;
  var m=curMachine();
  var mold=$('fMold').value.trim(),worker=$('fWorker').value.trim(),type=S.type,content=$('fContent').value.trim();
  if(!content&&type)content=type+' 발생';
  var miss=[];if(!mold)miss.push('금형제번');if(!type)miss.push('수리유형');if(!worker)miss.push('작업자');
  if(miss.length){alert('⚠️ 입력 필요\n\n• '+miss.join('\n• '));return;}
  var btn=$('btnSave');S.saving=true;btn.disabled=true;
  try{
    localStorage.setItem('mr_worker',worker);
    var img='',note='';
    if(S.photo){btn.textContent='⏳ 사진 업로드...';var up=await uploadPhoto(S.photo,mold);img=up.url;if(!up.storage)note=' (사진 Storage 실패 → 직접 저장)';}
    btn.textContent='⏳ 저장 중...';
    var src=m?(m.machine_name+(m.current_item_code?' · '+m.current_item_code:'')):'';
    var row={'금형번호':mold,'수리일자':today(),'수리유형':type,'수리내용':content,'수리업체':'','수리비용':'','완료일자':today(),'담당자':worker,'상태':'완료',
      '비고':src?'['+src+']':'',
      _id:'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,8),_updatedAt:new Date().toISOString(),_src:'mold_repair_require',_machine_code:m?m.machine_code:'',_machine_name:m?m.machine_name:''};
    if(img)row.before_img=img;
    var arr=await fetchRepairs();
    if(arr.some(function(x){return !x._deleted&&repairKey(x)===repairKey(row)}))row['수리내용']+=' ('+new Date().toTimeString().slice(0,5)+')';
    arr.push(row);
    await saveRepairs(arr);
    S.repairs=arr;
    toast('✅ 수리이력 등록 완료'+note,3000);
    S.type='';S.photo=null;$('fContent').value='';renderPhoto();
    document.querySelectorAll('#fTypes .chip').forEach(function(c){c.classList.remove('on')});
    showTab('list');
  }catch(e){alert('⚠️ 저장 실패\n\n'+(e.message||e));}
  finally{S.saving=false;btn.disabled=false;btn.textContent='💾 수리이력 등록';}
}

/* ── 수리내역 ── */
function setFilter(el){S.filter=el.getAttribute('data-f');document.querySelectorAll('.fb[data-f]').forEach(function(b){b.classList.toggle('on',b===el)});renderList()}
async function loadRepairs(force){
  if(force||!S.repairs.length){$('list').innerHTML='<div class="empty">⏳ 조회중...</div>';try{S.repairs=await fetchRepairs();}catch(e){$('list').innerHTML='<div class="empty">⚠️ '+esc(e.message)+'</div>';return;}}
  renderList();
}
function stCls(s){return s==='완료'?'done':(s==='수리대기'?'wait':'ing')}
function photoOf(r){return r.before_img||r.after_img||''}
function renderList(){
  var mold=$('fMold').value.trim().toUpperCase();
  var rows=S.repairs.filter(function(r){return !r._deleted});
  if(S.filter==='mold')rows=rows.filter(function(r){return String(r['금형번호']||'').toUpperCase()===mold});
  rows.sort(function(a,b){return (b['수리일자']||'').localeCompare(a['수리일자']||'')||(b._updatedAt||'').localeCompare(a._updatedAt||'')});
  rows=rows.slice(0,200);
  if(!rows.length){$('list').innerHTML='<div class="empty">내역이 없습니다</div>';return;}
  $('list').innerHTML=rows.map(function(r){
    var id=r._id||repairKey(r),ph=photoOf(r),urg=/\[긴급\]/.test(r['비고']||'');
    return '<div class="item" onclick="openDetail(\''+esc(id).replace(/'/g,'&#39;')+'\')">'+
      (ph&&/^(https?:|data:)/.test(ph)?'<img src="'+esc(ph)+'" loading="lazy">':'')+
      '<div class="b"><div class="t"><span class="mold">'+(urg?'<span class="urgtag">긴급</span>':'')+esc(r['금형번호'])+'</span>'+(r['상태']&&r['상태']!=='완료'?'<span class="st '+stCls(r['상태'])+'">'+esc(r['상태'])+'</span>':'')+'</div>'+
      '<div class="c">'+esc(r['수리유형'])+' · '+esc(r['수리내용'])+'</div>'+
      '<div class="m">'+esc(r['수리일자'])+' · '+esc(r['담당자']||'-')+(r['완료일자']?' · 완료 '+esc(r['완료일자']):'')+'</div></div></div>';
  }).join('');
}
function findRepair(id){return S.repairs.find(function(r){return (r._id||repairKey(r))===id})}
function openDetail(id){
  var r=findRepair(id);if(!r)return;
  var ph=photoOf(r);
  $('dTitle').textContent=r['금형번호'];
  $('dBody').innerHTML=
    (ph&&/^(https?:|data:)/.test(ph)?'<img src="'+esc(ph)+'" onclick="window.open(this.src)">':'')+
    '<div class="dl">'+
    '<div class="k">수리일자</div><div class="v">'+esc(r['수리일자'])+'</div>'+
    '<div class="k">수리유형</div><div class="v">'+esc(r['수리유형'])+'</div>'+
    '<div class="k">수리내용</div><div class="v">'+esc(r['수리내용'])+'</div>'+
    '<div class="k">담당자</div><div class="v">'+esc(r['담당자']||'-')+'</div>'+
    (r['완료일자']?'<div class="k">완료일자</div><div class="v">'+esc(r['완료일자'])+'</div>':'')+
    (r['비고']?'<div class="k">비고</div><div class="v">'+esc(r['비고'])+'</div>':'')+'</div>'+
    '<button class="btn gray" onclick="closeDetail()">닫기</button>';
  $('dm').classList.add('on');
}
function closeDetail(){$('dm').classList.remove('on')}
/* ── 시작 ── */
renderTypes(DEF_TYPES);renderPhoto();
loadMachines();loadMaster();
</script>
</body>
