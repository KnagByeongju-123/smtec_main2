<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SBC 검사기일보 v3.1</title>
<style>
  :root{
    --bg:#0b1220; --panel:#111a2b; --line:#1f2a3d; --text:#e6ebf3;
    --muted:#8a93a6; --accent:#3b82f6; --pass:#34d399; --amber:#fbbf24; --danger:#f87171;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:'Segoe UI','Malgun Gothic',sans-serif;padding:20px;}
  .wrap{max-width:960px;margin:0 auto}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
  h1{font-size:20px;font-weight:800;margin:0}
  .ver{font-size:11px;color:var(--amber);background:rgba(251,191,36,.12);
    padding:2px 8px;border-radius:8px;border:1px solid rgba(251,191,36,.3);margin-left:8px}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:8px;
    padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
  .btn.amber{background:var(--amber);color:#1a1a1a}
  .btn.danger{background:transparent;border:1px solid var(--danger);color:var(--danger)}
  .btn.sm{padding:5px 11px;font-size:12px}
  .tabs{display:flex;gap:8px;margin-bottom:16px}
  .tab{flex:0 0 auto;background:transparent;border:1px solid var(--line);color:var(--muted);
    border-radius:10px;padding:9px 18px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
  .tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
  .meta{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px;font-size:15px;align-items:center}
  .meta .row{display:flex;gap:10px;align-items:center}
  .meta .lbl{color:var(--muted);min-width:64px}
  .meta .val{font-weight:700}
  .meta .val.cust{color:var(--amber)}
  select,input{background:#0a1422;border:1px solid var(--line);border-radius:8px;
    padding:9px 12px;color:var(--text);font-size:15px;font-family:inherit}
  select{min-width:180px}
  table{width:100%;border-collapse:collapse;font-size:15px}
  th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:center}
  th{color:var(--muted);font-weight:600;font-size:13px;background:rgba(255,255,255,.02)}
  td.machine{font-weight:800;color:var(--amber);font-size:16px}
  td.num{font-weight:700;font-variant-numeric:tabular-nums}
  td.pass{color:var(--pass)}
  tr.total td{border-top:2px solid var(--line);font-weight:800;background:rgba(255,255,255,.03)}
  .empty{text-align:center;color:var(--muted);padding:28px}
  .actions{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
  .upd{font-size:12px;color:var(--muted);margin-top:10px;text-align:right}
  .hint{font-size:13px;color:var(--muted);margin:0 0 12px;line-height:1.6}
  .row-act{display:flex;gap:6px;justify-content:center}
  .filterbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .dwrap{display:flex;align-items:center;gap:5px}
  .calbtn{background:#0a1422;border:1px solid var(--line);border-radius:8px;
    padding:8px 11px;font-size:17px;cursor:pointer;line-height:1}

  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;
    align-items:center;justify-content:center;z-index:100;padding:16px}
  .modal.on{display:flex}
  .modal-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;width:100%;max-width:480px;max-height:88vh;overflow:auto}
  .modal-box h2{font-size:17px;margin:0 0 16px}
  .fld{margin-bottom:14px}
  .fld label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
  .fld input,.fld select{width:100%}
  .modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
  .modellist{display:flex;flex-direction:column;gap:7px;margin-bottom:10px}
  .modelitem{display:flex;justify-content:space-between;align-items:center;
    background:#0a1422;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px}
  .addrow{display:flex;gap:8px}
  .addrow input{flex:1}
  .hidden{display:none}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{background:#0a1422;border:1px solid var(--line);border-radius:20px;
    padding:8px 18px;cursor:pointer;font-size:15px;font-weight:700;color:var(--muted);user-select:none}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
  .numpad button{padding:18px;font-size:22px;font-weight:800;background:#0a1422;
    border:1px solid var(--line);border-radius:10px;color:var(--text);cursor:pointer;font-family:inherit}
  .numpad button:active{background:var(--accent);color:#fff}
  .ff{margin-bottom:10px}
  .ff label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
  .ff input{width:100%;font-size:24px;font-weight:800;text-align:right;padding:12px;
    background:#0a1422;border:1px solid var(--line);border-radius:8px;color:var(--pass)}
  .ff input.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(59,130,246,.35)}
  .ff-row{display:flex;align-items:center;gap:14px;justify-content:space-between;
    background:#0a1422;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
  .ff-info{flex:1;min-width:0}
  .ff-model{font-size:17px;font-weight:800;color:var(--amber)}
  .ff-auto{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.5}
  .ff-row input{width:130px;flex:0 0 auto;font-size:24px;font-weight:800;text-align:right;padding:10px;
    background:#0b1220;border:1px solid var(--line);border-radius:8px;color:var(--pass)}
  .ff-row input.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(59,130,246,.35)}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>📋 SBC 검사기일보 <span class="ver">v3.1</span></h1>
    <button class="btn ghost" onclick="openSettings()">⚙️ 설정</button>
  </div>

  <div class="tabs">
    <button class="tab on" id="tabMainBtn" onclick="showTab('main')">📋 검사기일보</button>
    <button class="tab" id="tabRtBtn" onclick="showTab('rt')">📡 실시간현황</button>
    <button class="tab" id="tabHistBtn" onclick="showTab('hist')">📜 이력조회</button>
  </div>

  <!-- ===== 메인 ===== -->
  <div id="viewMain">
    <div class="card">
      <div class="meta">
        <div class="row"><span class="lbl">검사일자</span><span class="val" id="mDate">-</span></div>
        <div class="row"><span class="lbl">고객사</span><span class="val cust">SBC</span></div>
        <div class="row"><span class="lbl">검사자</span><span class="val" id="mInspector">-</span></div>
      </div>
      <div style="margin-top:14px;border-top:1px solid var(--line);padding-top:14px">
        <div class="hint" style="margin-bottom:8px">담당 호기 선택 (최대 2대)</div>
        <div id="machineChips" class="chips"></div>
        <div class="row" style="margin-top:16px;display:flex;align-items:center;gap:10px">
          <span class="lbl">기종</span>
          <select id="modelSelect" onchange="onModelChange()"><option value="">기종 선택</option></select>
        </div>
      </div>
    </div>

    <div class="card">
      <table>
        <thead><tr><th>호기</th><th>기종</th><th>합격수량</th></tr></thead>
        <tbody id="tbody"><tr><td colspan="3" class="empty">불러오는 중...</td></tr></tbody>
      </table>
      <div class="upd" id="upd"></div>
      <div class="actions">
        <button class="btn" onclick="completeWork()">✅ 작업완료</button>
      </div>
    </div>
  </div>

  <!-- ===== 실시간현황 ===== -->
  <div id="viewRealtime" class="hidden">
    <div class="card">
      <table>
        <thead><tr><th>호기</th><th>작업자</th><th>기종명</th><th>수량</th></tr></thead>
        <tbody id="rtBody"><tr><td colspan="4" class="empty">불러오는 중...</td></tr></tbody>
      </table>
      <div class="upd" id="rtUpd"></div>
    </div>
  </div>

  <!-- ===== 이력조회 ===== -->
  <div id="viewHist" class="hidden">
    <div class="card">
      <div class="filterbar">
        <span class="lbl" style="color:var(--muted)">기간</span>
        <div class="dwrap"><input type="date" id="fFrom"><button class="calbtn" onclick="openPicker('fFrom')">📅</button></div>
        <span>~</span>
        <div class="dwrap"><input type="date" id="fTo"><button class="calbtn" onclick="openPicker('fTo')">📅</button></div>
        <button class="btn ghost sm" onclick="loadHistory()">조회</button>
        <button class="btn sm" onclick="openHistEdit()" style="margin-left:auto">+ 추가</button>
      </div>
      <table>
        <thead><tr><th>일자</th><th>검사자</th><th>기종</th><th>호기</th><th>합격수량</th><th>C/T</th><th>SPM</th><th>관리</th></tr></thead>
        <tbody id="histBody"><tr><td colspan="8" class="empty">조회 버튼을 누르세요.</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<!-- 설정 모달 -->
<div class="modal" id="settingsModal">
  <div class="modal-box">
    <h2>⚙️ 설정</h2>
    <div class="fld">
      <label>검사자명 (로그인 시 자동 적용 · 미로그인 시에만 사용)</label>
      <input type="text" id="inInspector" placeholder="예: 홍길동">
    </div>
    <div class="fld">
      <label>기종 목록</label>
      <div class="modellist" id="modelList"></div>
      <div class="addrow">
        <input type="text" id="newModel" placeholder="기종명 입력 (예: Race Way-117X)">
        <button class="btn sm" onclick="addModel()">추가</button>
      </div>
    </div>
    <div class="fld">
      <label>검사기 호기 목록</label>
      <div class="modellist" id="machineListEl"></div>
      <div class="addrow">
        <input type="text" id="newMachine" placeholder="호기 번호 (예: 11)">
        <button class="btn sm" onclick="addMachine()">추가</button>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" onclick="closeSettings()">취소</button>
      <button class="btn" onclick="saveSettings()">저장</button>
    </div>
  </div>
</div>

<!-- 이력 편집 모달 -->
<div class="modal" id="histModal">
  <div class="modal-box">
    <h2 id="histModalTitle">이력 추가</h2>
    <input type="hidden" id="hId">
    <div class="fld"><label>일자</label><input type="date" id="hDate"></div>
    <div class="fld"><label>검사자</label><input type="text" id="hInspector"></div>
    <div class="fld"><label>기종</label><select id="hModel"></select></div>
    <div class="fld"><label>호기</label><input type="text" id="hMachine" placeholder="예: 10"></div>
    <div class="fld"><label>합격수량</label><input type="number" id="hQty" value="0"></div>
    <div class="modal-foot">
      <button class="btn ghost" onclick="closeHistEdit()">취소</button>
      <button class="btn" onclick="saveHist()">저장</button>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://omngtyewdaqpphnzeate.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_9j2YkkL-7ul1TrhH-NjVdQ_vWDG2-1D';
  const HDR = { 'apikey':SUPABASE_KEY, 'Authorization':'Bearer '+SUPABASE_KEY };
  const HDR_J = { ...HDR, 'Content-Type':'application/json' };
  const REPORT_TABLE = 'qc_daily_report';
  const SESSION_TABLE = 'qc_active_session';
  const POLL_MS = 30000;

  const LS_INSPECTOR='qcr_inspector', LS_MODELS='qcr_model_list',
        LS_CURMODEL='qcr_cur_model', LS_BASELINE='qcr_baseline',
        LS_MACHINES='qcr_machines', LS_MLIST='qcr_machine_list';

  let mapping={}, inspector='', modelList=[], currentModel='', baseline={date:'',counts:{}};
  let selectedMachines=[], lastCounts={}, machineList=[];
  let finishMode='complete', activeFF=null, rtTimer=null;

  // 로그인(PIN 인증) 정보에서 검사자명 자동 추출
  function getLoginUser(){
    try{
      const a=JSON.parse(localStorage.getItem('esg_pin_auth')||'null');
      if(a && a.name && a.name!=='Guest' && (!a.exp || a.exp>Date.now())) return a.name;
    }catch(_){}
    return '';
  }
  function currentInspector(){ return getLoginUser() || localStorage.getItem(LS_INSPECTOR) || ''; }

  // ===== KST =====
  function kstDate(d){ return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul'}).format(d); }
  function todayStr(){ return kstDate(new Date()); }
  function todayMD(){ const [,m,d]=todayStr().split('-'); return `${parseInt(m)}/${parseInt(d)}`; }
  function kstNow(){
    const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(new Date());
    const o={}; p.forEach(x=>o[x.type]=x.value);
    return `${o.year}-${o.month}-${o.day}T${o.hour}:${o.minute}:${o.second}+09:00`;
  }
  function todayRange(){
    const t=todayStr(), tmr=kstDate(new Date(Date.now()+86400000));
    return { start:`${t}T00:00:00+09:00`, end:`${tmr}T00:00:00+09:00` };
  }

  // ===== 로컬 =====
  function loadLocal(){
    inspector = currentInspector();
    try{ modelList = JSON.parse(localStorage.getItem(LS_MODELS)||'[]'); }catch(_){ modelList=[]; }
    currentModel = localStorage.getItem(LS_CURMODEL) || '';
    try{ baseline = JSON.parse(localStorage.getItem(LS_BASELINE)||'{"date":"","counts":{},"start":""}'); }catch(_){ baseline={date:'',counts:{},start:''}; }
    try{ selectedMachines = JSON.parse(localStorage.getItem(LS_MACHINES)||'[]'); }catch(_){ selectedMachines=[]; }
    try{ machineList = JSON.parse(localStorage.getItem(LS_MLIST)||'null'); }catch(_){ machineList=null; }
    if(!machineList || !machineList.length) machineList=['3','4','5','6','7','8','9','10'];
  }
  function saveBaseline(){ localStorage.setItem(LS_BASELINE, JSON.stringify(baseline)); }

  // ===== 서버 매핑 =====
  async function loadMapping(){
    try{
      const r=await fetch(`${SUPABASE_URL}/rest/v1/qc_mapping?id=eq.1&select=data`,{headers:HDR});
      if(r.ok){ const rows=await r.json(); if(rows&&rows[0]&&rows[0].data) mapping=rows[0].data; }
    }catch(e){ console.error('매핑 로드 실패',e); }
  }

  // ===== 당일 채널별 카운트 =====
  async function loadToday(){
    const {start,end}=todayRange();
    const url=`${SUPABASE_URL}/rest/v1/shot_count?detected_at=gte.${encodeURIComponent(start)}&detected_at=lt.${encodeURIComponent(end)}&select=machine_code&limit=200000`;
    const counts={};
    try{
      const r=await fetch(url,{headers:HDR});
      if(r.ok){ const rows=await r.json(); rows.forEach(x=>counts[x.machine_code]=(counts[x.machine_code]||0)+1); }
    }catch(e){ console.error('당일 집계 실패',e); }
    return counts;
  }

  // ===== 담당 호기 선택 (설정 등록 호기 목록) =====
  function renderChips(){
    const el=document.getElementById('machineChips');
    if(!machineList.length){ el.innerHTML='<span class="hint">설정에서 검사기 호기를 먼저 등록하세요.</span>'; return; }
    el.innerHTML=machineList.map(m=>`<div class="chip ${selectedMachines.includes(m)?'on':''}" onclick="toggleMachine('${m}')">${m}호기</div>`).join('');
  }
  function toggleMachine(m){
    const i=selectedMachines.indexOf(m);
    if(i>=0){ selectedMachines.splice(i,1); }
    else{
      if(selectedMachines.length>=2){ alert('담당 호기는 최대 2대까지 선택할 수 있습니다.'); return; }
      selectedMachines.push(m);
    }
    localStorage.setItem(LS_MACHINES, JSON.stringify(selectedMachines));
    renderChips();
    renderMain(workByMachine(lastCounts));
    syncSession();
  }

  // ===== 작업분 = 선택 호기와 모니터 매핑 호기가 일치하는 채널의 (현재-baseline) =====
  function workByMachine(counts){
    const base = (baseline.date===todayStr()) ? baseline.counts : {};
    const byM={};
    for(const machine of selectedMachines){
      let sum=0;
      for(const dev in mapping) for(const ch in mapping[dev]){
        const m=mapping[dev][ch];
        if(m && String(m.machine)===String(machine)){
          sum += Math.max(0,(counts[ch]||0)-(base[ch]||0));
        }
      }
      byM[machine]=sum;
    }
    return byM;
  }

  // ===== 메인 렌더 =====
  function fillModelSelect(sel, val){
    sel.innerHTML='<option value="">기종 선택</option>'+modelList.map(m=>`<option value="${m.replace(/"/g,'&quot;')}"${m===val?' selected':''}>${m}</option>`).join('');
  }
  function renderMain(byM){
    inspector = currentInspector();
    document.getElementById('mDate').textContent=todayMD();
    document.getElementById('mInspector').textContent=inspector||'(로그인 필요)';
    fillModelSelect(document.getElementById('modelSelect'), currentModel);

    const tb=document.getElementById('tbody');
    if(selectedMachines.length===0){
      tb.innerHTML=`<tr><td colspan="3" class="empty">담당 호기를 선택하세요 (위 칩에서 최대 2대).</td></tr>`;
      return;
    }
    const machines=selectedMachines.filter(m=>m).sort();
    let html='',total=0;
    for(const m of machines){
      const q=byM[m]||0; total+=q;
      html+=`<tr><td class="machine">${m}호기</td><td>${currentModel||'-'}</td><td class="num pass">${q.toLocaleString()}</td></tr>`;
    }
    html+=`<tr class="total"><td colspan="2">합계</td><td class="num pass">${total.toLocaleString()}</td></tr>`;
    tb.innerHTML=html;
    document.getElementById('upd').textContent='갱신 '+new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(new Date());
  }

  async function refresh(){
    lastCounts=await loadToday();
    renderMain(workByMachine(lastCounts));
  }

  // ===== 기종 선택 (변경 시 이전 기종 작업분 자동 저장) =====
  async function onModelChange(){
    const newModel=document.getElementById('modelSelect').value;
    if(currentModel && currentModel!==newModel){
      await autoSavePrev();
    }
    currentModel=newModel;
    localStorage.setItem(LS_CURMODEL,currentModel);
    baseline={date:todayStr(),counts:{...lastCounts},start:kstNow()}; saveBaseline();
    renderMain(workByMachine(lastCounts));
    syncSession();
  }
  async function autoSavePrev(){
    const insp=currentInspector();
    if(!insp || selectedMachines.length===0) return;
    const byM=workByMachine(lastCounts);
    const total=selectedMachines.reduce((s,m)=>s+(byM[m]||0),0);
    if(total<=0) return;
    const rows=[{ report_date:todayStr(), inspector:insp, customer:'SBC', model:currentModel, machine:selectedMachines.join(','), qty:total, start_time:baseline.start||null, end_time:kstNow() }];
    try{
      const r=await fetch(`${SUPABASE_URL}/rest/v1/${REPORT_TABLE}`,{method:'POST',headers:HDR_J,body:JSON.stringify(rows)});
      if(r.ok) alert(`이전 기종(${currentModel}) 합격수량 ${total.toLocaleString()}이(가) 자동 저장되었습니다.`);
    }catch(e){ console.error('자동 저장 실패',e); }
  }

  function completeWork(){ openFinishModal('complete'); }

  // ===== 작업종료 최종수량 숫자판 모달 =====
  function openFinishModal(mode){
    if(!currentModel){ alert('기종을 먼저 선택하세요.'); return; }
    if(selectedMachines.length===0){ alert('담당 호기를 먼저 선택하세요.'); return; }
    if(!currentInspector()){ alert('로그인 정보가 없습니다. 메인 화면에서 PIN 로그인 후 사용하거나 설정에서 검사자명을 등록하세요.'); return; }
    finishMode=mode;
    const byM=workByMachine(lastCounts);
    const total=selectedMachines.reduce((s,m)=>s+(byM[m]||0),0);
    document.getElementById('finishTitle').textContent = (mode==='switch'?'기종전환 · 기종별 총수량':'작업종료 · 기종별 총수량');
    document.getElementById('finishFields').innerHTML=`
      <div class="ff-row">
        <div class="ff-info">
          <div class="ff-model">${currentModel}</div>
          <div class="ff-auto">담당 호기 ${selectedMachines.map(m=>m+'호기').join(', ')}<br>자동 집계 총수량 ${total.toLocaleString()}</div>
        </div>
        <input readonly id="ff_total" value="${total}" onclick="setActiveFF('ff_total')">
      </div>`;
    activeFF=null; setActiveFF('ff_total');
    document.getElementById('finishModal').classList.add('on');
  }
  function setActiveFF(id){
    if(activeFF){ const e=document.getElementById(activeFF); if(e) e.classList.remove('active'); }
    activeFF=id;
    const e=document.getElementById(id); if(e) e.classList.add('active');
  }
  function numKey(k){
    if(!activeFF) return;
    const e=document.getElementById(activeFF); if(!e) return;
    if(k==='C') e.value='0';
    else if(k==='bs') e.value = (e.value.length>1 ? e.value.slice(0,-1) : '0');
    else e.value = (e.value==='0' ? '' : e.value) + k;
  }
  function closeFinish(){ document.getElementById('finishModal').classList.remove('on'); }
  async function saveFinish(){
    const insp=currentInspector();
    const el=document.getElementById('ff_total');
    const v=parseInt(el?el.value:0)||0;
    if(v<=0){ alert('저장할 수량이 없습니다.'); return; }
    const rows=[{ report_date:todayStr(), inspector:insp, customer:'SBC', model:currentModel, machine:selectedMachines.join(','), qty:v, start_time:baseline.start||null, end_time:kstNow() }];
    try{
      const r=await fetch(`${SUPABASE_URL}/rest/v1/${REPORT_TABLE}`,{method:'POST',headers:HDR_J,body:JSON.stringify(rows)});
      if(!r.ok) throw new Error(await r.text());
    }catch(e){ alert('이력 저장 실패: '+e.message); return; }
    baseline={date:todayStr(),counts:{...lastCounts},start:kstNow()}; saveBaseline();
    closeFinish();
    renderMain(workByMachine(lastCounts));
    if(finishMode==='switch'){
      alert('저장되었습니다. 위 기종 선택에서 새 기종을 고르세요.');
      document.getElementById('modelSelect').focus();
    }else{
      alert('작업종료 — 이력에 저장되었습니다.');
    }
  }

  // ===== 탭 =====
  function showTab(t){
    document.getElementById('viewMain').classList.toggle('hidden',t!=='main');
    document.getElementById('viewRealtime').classList.toggle('hidden',t!=='rt');
    document.getElementById('viewHist').classList.toggle('hidden',t!=='hist');
    document.getElementById('tabMainBtn').classList.toggle('on',t==='main');
    document.getElementById('tabRtBtn').classList.toggle('on',t==='rt');
    document.getElementById('tabHistBtn').classList.toggle('on',t==='hist');
    if(rtTimer){ clearInterval(rtTimer); rtTimer=null; }
    if(t==='rt'){
      loadRealtime();
      rtTimer=setInterval(loadRealtime, 10000);
    }
    if(t==='hist'){
      if(!document.getElementById('fTo').value){
        const yday=kstDate(new Date(Date.now()-86400000));
        document.getElementById('fFrom').value=yday;
        document.getElementById('fTo').value=yday;
      }
      loadHistory();
    }
  }

  // ===== 실시간현황 (작업 세션) =====
  async function syncSession(){
    const insp=currentInspector();
    if(!insp) return;
    try{
      await fetch(`${SUPABASE_URL}/rest/v1/${SESSION_TABLE}?inspector=eq.${encodeURIComponent(insp)}`,{method:'DELETE',headers:HDR});
      if(currentModel && selectedMachines.length){
        const now=kstNow();
        const rows=selectedMachines.map(m=>({machine:String(m), inspector:insp, model:currentModel, updated_at:now}));
        await fetch(`${SUPABASE_URL}/rest/v1/${SESSION_TABLE}`,{method:'POST',headers:{...HDR_J,'Prefer':'resolution=merge-duplicates'},body:JSON.stringify(rows)});
      }
    }catch(e){ console.error('세션 동기화 실패',e); }
  }
  async function loadRealtime(){
    const tb=document.getElementById('rtBody');
    let sessions=[];
    try{
      const start=`${todayStr()}T00:00:00+09:00`;
      const r=await fetch(`${SUPABASE_URL}/rest/v1/${SESSION_TABLE}?select=*&updated_at=gte.${encodeURIComponent(start)}&order=machine`,{headers:HDR});
      sessions=await r.json();
    }catch(e){ tb.innerHTML=`<tr><td colspan="4" class="empty">조회 실패: ${e.message}</td></tr>`; return; }
    const counts=await loadToday();
    function dayQty(machine){
      let s=0;
      for(const dev in mapping) for(const ch in mapping[dev]){
        const m=mapping[dev][ch]; if(m && String(m.machine)===String(machine)) s+=counts[ch]||0;
      }
      return s;
    }
    if(!sessions || !sessions.length){
      tb.innerHTML=`<tr><td colspan="4" class="empty">현재 작업 중인 호기가 없습니다.</td></tr>`;
    }else{
      tb.innerHTML=sessions.map(x=>`<tr>
        <td class="machine">${x.machine}호기</td><td>${x.inspector||''}</td><td>${x.model||''}</td>
        <td class="num pass">${dayQty(x.machine).toLocaleString()}</td></tr>`).join('');
    }
    document.getElementById('rtUpd').textContent='갱신 '+new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(new Date());
  }

  // ===== 이력 CRUD =====
  function openPicker(id){ const e=document.getElementById(id); try{ e.showPicker(); }catch(_){ e.focus(); e.click(); } }
  function calcCT(row){
    if(!row.start_time || !row.end_time || !row.qty || row.qty<=0) return '-';
    const sec=(new Date(row.end_time).getTime()-new Date(row.start_time).getTime())/1000;
    if(sec<=0) return '-';
    return (sec/row.qty).toFixed(1)+'s';
  }
  function calcSPM(row){
    if(!row.start_time || !row.end_time || !row.qty || row.qty<=0) return '-';
    const sec=(new Date(row.end_time).getTime()-new Date(row.start_time).getTime())/1000;
    if(sec<=0) return '-';
    return Math.round(row.qty*60/sec);
  }
  async function loadHistory(){
    const from=document.getElementById('fFrom').value, to=document.getElementById('fTo').value;
    let url=`${SUPABASE_URL}/rest/v1/${REPORT_TABLE}?select=*&order=report_date.desc,id.desc&limit=500`;
    if(from) url+=`&report_date=gte.${from}`;
    if(to)   url+=`&report_date=lte.${to}`;
    const tb=document.getElementById('histBody');
    try{
      const r=await fetch(url,{headers:HDR});
      const rows=await r.json();
      if(!rows||rows.length===0){ tb.innerHTML=`<tr><td colspan="8" class="empty">이력이 없습니다.</td></tr>`; return; }
      tb.innerHTML=rows.map(x=>`<tr>
        <td>${x.report_date||''}</td><td>${x.inspector||''}</td><td>${x.model||''}</td>
        <td class="machine">${x.machine||''}호기</td><td class="num pass">${(x.qty||0).toLocaleString()}</td>
        <td class="num">${calcCT(x)}</td>
        <td class="num">${calcSPM(x)}</td>
        <td><div class="row-act">
          <button class="btn ghost sm" onclick='openHistEdit(${JSON.stringify(x)})'>수정</button>
          <button class="btn danger sm" onclick="delHist(${x.id})">삭제</button>
        </div></td></tr>`).join('');
    }catch(e){ tb.innerHTML=`<tr><td colspan="8" class="empty">조회 실패: ${e.message}</td></tr>`; }
  }
  function openHistEdit(row){
    document.getElementById('histModalTitle').textContent= row?'이력 수정':'이력 추가';
    document.getElementById('hId').value= row?row.id:'';
    document.getElementById('hDate').value= row?row.report_date:todayStr();
    document.getElementById('hInspector').value= row?(row.inspector||''):inspector;
    fillModelSelect(document.getElementById('hModel'), row?row.model:currentModel);
    document.getElementById('hMachine').value= row?(row.machine||''):'';
    document.getElementById('hQty').value= row?(row.qty||0):0;
    document.getElementById('histModal').classList.add('on');
  }
  function closeHistEdit(){ document.getElementById('histModal').classList.remove('on'); }
  async function saveHist(){
    const id=document.getElementById('hId').value;
    const body={
      report_date:document.getElementById('hDate').value,
      inspector:document.getElementById('hInspector').value.trim(),
      customer:'SBC',
      model:document.getElementById('hModel').value,
      machine:document.getElementById('hMachine').value.trim(),
      qty:parseInt(document.getElementById('hQty').value)||0
    };
    try{
      if(id){
        const r=await fetch(`${SUPABASE_URL}/rest/v1/${REPORT_TABLE}?id=eq.${id}`,{method:'PATCH',headers:HDR_J,body:JSON.stringify(body)});
        if(!r.ok) throw new Error(await r.text());
      }else{
        const r=await fetch(`${SUPABASE_URL}/rest/v1/${REPORT_TABLE}`,{method:'POST',headers:HDR_J,body:JSON.stringify([body])});
        if(!r.ok) throw new Error(await r.text());
      }
      closeHistEdit(); loadHistory();
    }catch(e){ alert('저장 실패: '+e.message); }
  }
  async function delHist(id){
    if(!confirm('이 이력을 삭제하시겠습니까?')) return;
    try{
      const r=await fetch(`${SUPABASE_URL}/rest/v1/${REPORT_TABLE}?id=eq.${id}`,{method:'DELETE',headers:HDR});
      if(!r.ok) throw new Error(await r.text());
      loadHistory();
    }catch(e){ alert('삭제 실패: '+e.message); }
  }

  // ===== 설정 =====
  function renderModelList(){
    const el=document.getElementById('modelList');
    if(modelList.length===0){ el.innerHTML='<div class="hint">등록된 기종이 없습니다.</div>'; return; }
    el.innerHTML=modelList.map((m,i)=>`<div class="modelitem"><span>${m}</span><button class="btn danger sm" onclick="removeModel(${i})">삭제</button></div>`).join('');
  }
  function addModel(){
    const v=document.getElementById('newModel').value.trim();
    if(!v) return;
    if(!modelList.includes(v)) modelList.push(v);
    document.getElementById('newModel').value='';
    renderModelList();
  }
  function removeModel(i){ modelList.splice(i,1); renderModelList(); }

  function renderMachineList(){
    const el=document.getElementById('machineListEl');
    if(!machineList.length){ el.innerHTML='<div class="hint">등록된 호기가 없습니다.</div>'; return; }
    el.innerHTML=machineList.map((m,i)=>`<div class="modelitem"><span>${m}호기</span><button class="btn danger sm" onclick="removeMachine(${i})">삭제</button></div>`).join('');
  }
  function addMachine(){
    let v=document.getElementById('newMachine').value.trim().replace(/호기/g,'').trim();
    if(!v) return;
    if(!machineList.includes(v)) machineList.push(v);
    machineList.sort((a,b)=>(parseInt(a)||0)-(parseInt(b)||0));
    document.getElementById('newMachine').value='';
    renderMachineList();
  }
  function removeMachine(i){ machineList.splice(i,1); renderMachineList(); }

  function openSettings(){
    document.getElementById('inInspector').value=inspector;
    renderModelList();
    renderMachineList();
    document.getElementById('settingsModal').classList.add('on');
  }
  function closeSettings(){ document.getElementById('settingsModal').classList.remove('on'); }
  function saveSettings(){
    inspector=document.getElementById('inInspector').value.trim();
    localStorage.setItem(LS_INSPECTOR,inspector);
    localStorage.setItem(LS_MODELS,JSON.stringify(modelList));
    localStorage.setItem(LS_MLIST,JSON.stringify(machineList));
    if(currentModel && !modelList.includes(currentModel)){ currentModel=''; localStorage.setItem(LS_CURMODEL,''); }
    // 등록 해제된 호기는 담당 선택에서도 제거
    selectedMachines=selectedMachines.filter(m=>machineList.includes(m));
    localStorage.setItem(LS_MACHINES,JSON.stringify(selectedMachines));
    closeSettings();
    renderChips();
    renderMain(workByMachine(lastCounts));
  }

  // ===== 초기화 =====
  (async ()=>{
    loadLocal();
    await loadMapping();
    renderChips();
    await refresh();
    syncSession();
    setInterval(refresh, POLL_MS);
  })();
</script>
<!-- 작업종료 최종수량 숫자판 모달 -->
<div class="modal" id="finishModal">
  <div class="modal-box">
    <h2 id="finishTitle">작업종료 · 최종수량</h2>
    <div class="hint">자동 집계값이 입력되어 있습니다. 필요시 숫자판으로 수정하세요.</div>
    <div id="finishFields"></div>
    <div class="numpad">
      <button onclick="numKey('1')">1</button><button onclick="numKey('2')">2</button><button onclick="numKey('3')">3</button>
      <button onclick="numKey('4')">4</button><button onclick="numKey('5')">5</button><button onclick="numKey('6')">6</button>
      <button onclick="numKey('7')">7</button><button onclick="numKey('8')">8</button><button onclick="numKey('9')">9</button>
      <button onclick="numKey('C')">C</button><button onclick="numKey('0')">0</button><button onclick="numKey('bs')">⌫</button>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" onclick="closeFinish()">취소</button>
      <button class="btn" onclick="saveFinish()">저장</button>
    </div>
  </div>
</div>

</body>
</html>
