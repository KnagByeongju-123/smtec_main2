<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SBC 검사기일보 v2.0</title>
<style>
  :root{
    --bg:#0b1220; --panel:#111a2b; --line:#1f2a3d; --text:#e6ebf3;
    --muted:#8a93a6; --accent:#3b82f6; --pass:#34d399; --amber:#fbbf24; --danger:#f87171;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:'Segoe UI','Malgun Gothic',sans-serif;padding:20px;}
  .wrap{max-width:960px;margin:0 auto}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
  h1{font-size:20px;font-weight:800;margin:0}
  .ver{font-size:11px;color:var(--amber);background:rgba(251,191,36,.12);
    padding:2px 8px;border-radius:8px;border:1px solid rgba(251,191,36,.3);margin-left:8px}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:8px;
    padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
  .btn.amber{background:var(--amber);color:#1a1a1a}
  .btn.danger{background:transparent;border:1px solid var(--danger);color:var(--danger)}
  .btn.sm{padding:5px 11px;font-size:12px}
  .tabs{display:flex;gap:8px;margin-bottom:16px}
  .tab{flex:0 0 auto;background:transparent;border:1px solid var(--line);color:var(--muted);
    border-radius:10px;padding:9px 18px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
  .tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
  .meta{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px;font-size:15px;align-items:center}
  .meta .row{display:flex;gap:10px;align-items:center}
  .meta .lbl{color:var(--muted);min-width:64px}
  .meta .val{font-weight:700}
  .meta .val.cust{color:var(--amber)}
  select,input{background:#0a1422;border:1px solid var(--line);border-radius:8px;
    padding:9px 12px;color:var(--text);font-size:15px;font-family:inherit}
  select{min-width:180px}
  table{width:100%;border-collapse:collapse;font-size:15px}
  th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:center}
  th{color:var(--muted);font-weight:600;font-size:13px;background:rgba(255,255,255,.02)}
  td.machine{font-weight:800;color:var(--amber);font-size:16px}
  td.num{font-weight:700;font-variant-numeric:tabular-nums}
  td.pass{color:var(--pass)}
  tr.total td{border-top:2px solid var(--line);font-weight:800;background:rgba(255,255,255,.03)}
  .empty{text-align:center;color:var(--muted);padding:28px}
  .actions{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
  .upd{font-size:12px;color:var(--muted);margin-top:10px;text-align:right}
  .hint{font-size:13px;color:var(--muted);margin:0 0 12px;line-height:1.6}
  .row-act{display:flex;gap:6px;justify-content:center}
  .filterbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}

  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;
    align-items:center;justify-content:center;z-index:100;padding:16px}
  .modal.on{display:flex}
  .modal-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;width:100%;max-width:480px;max-height:88vh;overflow:auto}
  .modal-box h2{font-size:17px;margin:0 0 16px}
  .fld{margin-bottom:14px}
  .fld label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
  .fld input,.fld select{width:100%}
  .modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
  .modellist{display:flex;flex-direction:column;gap:7px;margin-bottom:10px}
  .modelitem{display:flex;justify-content:space-between;align-items:center;
    background:#0a1422;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px}
  .addrow{display:flex;gap:8px}
  .addrow input{flex:1}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>📋 SBC 검사기일보 <span class="ver">v2.0</span></h1>
    <button class="btn ghost" onclick="openSettings()">⚙️ 설정</button>
  </div>

  <div class="tabs">
    <button class="tab on" id="tabMainBtn" onclick="showTab('main')">📋 검사기일보</button>
    <button class="tab" id="tabHistBtn" onclick="showTab('hist')">📜 이력조회</button>
  </div>

  <!-- ===== 메인 ===== -->
  <div id="viewMain">
    <div class="card">
      <div class="meta">
        <div class="row"><span class="lbl">검사일자</span><span class="val" id="mDate">-</span></div>
        <div class="row"><span class="lbl">고객사</span><span class="val cust">SBC</span></div>
        <div class="row"><span class="lbl">검사자</span><span class="val" id="mInspector">-</span></div>
        <div class="row"><span class="lbl">기종</span>
          <select id="modelSelect" onchange="onModelChange()"><option value="">기종 선택</option></select>
        </div>
      </div>
    </div>

    <div class="card">
      <table>
        <thead><tr><th>호기</th><th>기종</th><th>합격수량</th></tr></thead>
        <tbody id="tbody"><tr><td colspan="3" class="empty">불러오는 중...</td></tr></tbody>
      </table>
      <div class="upd" id="upd"></div>
      <div class="actions">
        <button class="btn" onclick="completeWork()">✅ 작업완료</button>
        <button class="btn amber" onclick="switchModel()">🔄 기종전환</button>
      </div>
    </div>
  </div>

  <!-- ===== 이력조회 ===== -->
  <div id="viewHist" class="hidden">
    <div class="card">
      <div class="filterbar">
        <span class="lbl" style="color:var(--muted)">기간</span>
        <input type="date" id="fFrom"><span>~</span><input type="date" id="fTo">
        <button class="btn ghost sm" onclick="loadHistory()">조회</button>
        <button class="btn sm" onclick="openHistEdit()" style="margin-left:auto">+ 추가</button>
      </div>
      <table>
        <thead><tr><th>일자</th><th>검사자</th><th>기종</th><th>호기</th><th>합격수량</th><th>관리</th></tr></thead>
        <tbody id="histBody"><tr><td colspan="6" class="empty">조회 버튼을 누르세요.</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<!-- 설정 모달 -->
<div class="modal" id="settingsModal">
  <div class="modal-box">
    <h2>⚙️ 설정</h2>
    <div class="fld">
      <label>검사자명 (이 기기에 저장 · 접속 시 자동)</label>
      <input type="text" id="inInspector" placeholder="예: 홍길동">
    </div>
    <div class="fld">
      <label>기종 목록</label>
      <div class="modellist" id="modelList"></div>
      <div class="addrow">
        <input type="text" id="newModel" placeholder="기종명 입력 (예: Race Way-117X)">
        <button class="btn sm" onclick="addModel()">추가</button>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" onclick="closeSettings()">취소</button>
      <button class="btn" onclick="saveSettings()">저장</button>
    </div>
  </div>
</div>

<!-- 이력 편집 모달 -->
<div class="modal" id="histModal">
  <div class="modal-box">
    <h2 id="histModalTitle">이력 추가</h2>
    <input type="hidden" id="hId">
    <div class="fld"><label>일자</label><input type="date" id="hDate"></div>
    <div class="fld"><label>검사자</label><input type="text" id="hInspector"></div>
    <div class="fld"><label>기종</label><select id="hModel"></select></div>
    <div class="fld"><label>호기</label><input type="text" id="hMachine" placeholder="예: 10"></div>
    <div class="fld"><label>합격수량</label><input type="number" id="hQty" value="0"></div>
    <div class="modal-foot">
      <button class="btn ghost" onclick="closeHistEdit()">취소</button>
      <button class="btn" onclick="saveHist()">저장</button>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://omngtyewdaqpphnzeate.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_9j2YkkL-7ul1TrhH-NjVdQ_vWDG2-1D';
  const HDR = { 'apikey':SUPABASE_KEY, 'Authorization':'Bearer '+SUPABASE_KEY };
  const HDR_J = { ...HDR, 'Content-Type':'application/json' };
  const REPORT_TABLE = 'qc_daily_report';
  const POLL_MS = 30000;

  const LS_INSPECTOR='qcr_inspector', LS_MODELS='qcr_model_list',
        LS_CURMODEL='qcr_cur_model', LS_BASELINE='qcr_baseline';

  let mapping={}, inspector='', modelList=[], currentModel='', baseline={date:'',counts:{}};
  let lastCounts={};

  // ===== KST =====
  function kstDate(d){ return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul'}).format(d); }
  function todayStr(){ return kstDate(new Date()); }
  function todayRange(){
    const t=todayStr(), tmr=kstDate(new Date(Date.now()+86400000));
    return { start:`${t}T00:00:00+09:00`, end:`${tmr}T00:00:00+09:00` };
  }

  // ===== 로컬 =====
  function loadLocal(){
    inspector = localStorage.getItem(LS_INSPECTOR) || '';
    try{ modelList = JSON.parse(localStorage.getItem(LS_MODELS)||'[]'); }catch(_){ modelList=[]; }
    currentModel = localStorage.getItem(LS_CURMODEL) || '';
    try{ baseline = JSON.parse(localStorage.getItem(LS_BASELINE)||'{"date":"","counts":{}}'); }catch(_){ baseline={date:'',counts:{}}; }
  }
  function saveBaseline(){ localStorage.setItem(LS_BASELINE, JSON.stringify(baseline)); }

  // ===== 서버 매핑 =====
  async function loadMapping(){
    try{
      const r=await fetch(`${SUPABASE_URL}/rest/v1/qc_mapping?id=eq.1&select=data`,{headers:HDR});
      if(r.ok){ const rows=await r.json(); if(rows&&rows[0]&&rows[0].data) mapping=rows[0].data; }
    }catch(e){ console.error('매핑 로드 실패',e); }
  }

  // ===== 당일 채널별 카운트 =====
  async function loadToday(){
    const {start,end}=todayRange();
    const url=`${SUPABASE_URL}/rest/v1/shot_count?detected_at=gte.${encodeURIComponent(start)}&detected_at=lt.${encodeURIComponent(end)}&select=machine_code&limit=200000`;
    const counts={};
    try{
      const r=await fetch(url,{headers:HDR});
      if(r.ok){ const rows=await r.json(); rows.forEach(x=>counts[x.machine_code]=(counts[x.machine_code]||0)+1); }
    }catch(e){ console.error('당일 집계 실패',e); }
    return counts;
  }

  // ===== 작업분(호기별) = 현재 - baseline =====
  function workByMachine(counts){
    const base = (baseline.date===todayStr()) ? baseline.counts : {};
    const byM={};
    for(const dev in mapping) for(const ch in mapping[dev]){
      const m=mapping[dev][ch]; if(!m||!m.machine) continue;
      const q=Math.max(0,(counts[ch]||0)-(base[ch]||0));
      byM[m.machine]=(byM[m.machine]||0)+q;
    }
    return byM;
  }

  // ===== 메인 렌더 =====
  function fillModelSelect(sel, val){
    sel.innerHTML='<option value="">기종 선택</option>'+modelList.map(m=>`<option value="${m.replace(/"/g,'&quot;')}"${m===val?' selected':''}>${m}</option>`).join('');
  }
  function renderMain(byM){
    document.getElementById('mDate').textContent=todayStr();
    document.getElementById('mInspector').textContent=inspector||'(설정 필요)';
    fillModelSelect(document.getElementById('modelSelect'), currentModel);

    const machines=Object.keys(byM).sort();
    const tb=document.getElementById('tbody');
    if(machines.length===0){
      tb.innerHTML=`<tr><td colspan="3" class="empty">매핑된 호기가 없습니다. QC 모니터에서 호기 매핑을 먼저 등록하세요.</td></tr>`;
      return;
    }
    let html='',total=0;
    for(const m of machines){
      const q=byM[m]; total+=q;
      html+=`<tr><td class="machine">${m}호기</td><td>${currentModel||'-'}</td><td class="num pass">${q.toLocaleString()}</td></tr>`;
    }
    html+=`<tr class="total"><td colspan="2">합계</td><td class="num pass">${total.toLocaleString()}</td></tr>`;
    tb.innerHTML=html;
    document.getElementById('upd').textContent='갱신 '+new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(new Date());
  }

  async function refresh(){
    lastCounts=await loadToday();
    renderMain(workByMachine(lastCounts));
  }

  // ===== 기종 선택/전환 =====
  function onModelChange(){
    currentModel=document.getElementById('modelSelect').value;
    localStorage.setItem(LS_CURMODEL,currentModel);
    // 기종 선택 시점부터 카운트 → baseline 갱신
    baseline={date:todayStr(),counts:{...lastCounts}}; saveBaseline();
    renderMain(workByMachine(lastCounts));
  }

  async function saveCurrentWork(){
    if(!currentModel){ alert('기종을 먼저 선택하세요.'); return false; }
    if(!inspector){ alert('설정에서 검사자명을 먼저 등록하세요.'); return false; }
    const byM=workByMachine(lastCounts);
    const rows=[];
    for(const m of Object.keys(byM)){
      if(byM[m]<=0) continue;
      rows.push({ report_date:todayStr(), inspector, customer:'SBC', model:currentModel, machine:m, qty:byM[m] });
    }
    if(rows.length===0){ alert('저장할 합격수량이 없습니다.'); return false; }
    try{
      const r=await fetch(`${SUPABASE_URL}/rest/v1/${REPORT_TABLE}`,{method:'POST',headers:HDR_J,body:JSON.stringify(rows)});
      if(!r.ok) throw new Error(await r.text());
    }catch(e){ alert('이력 저장 실패: '+e.message); return false; }
    // baseline 리셋 (다음 작업분 0부터)
    baseline={date:todayStr(),counts:{...lastCounts}}; saveBaseline();
    renderMain(workByMachine(lastCounts));
    return true;
  }
  async function completeWork(){
    if(await saveCurrentWork()) alert('작업완료 — 이력에 저장되었습니다.');
  }
  async function switchModel(){
    if(await saveCurrentWork()){
      alert('현재 작업이 저장되었습니다. 위 기종 선택에서 새 기종을 고르세요.');
      document.getElementById('modelSelect').focus();
    }
  }

  // ===== 탭 =====
  function showTab(t){
    document.getElementById('viewMain').classList.toggle('hidden',t!=='main');
    document.getElementById('viewHist').classList.toggle('hidden',t!=='hist');
    document.getElementById('tabMainBtn').classList.toggle('on',t==='main');
    document.getElementById('tabHistBtn').classList.toggle('on',t==='hist');
    if(t==='hist'){
      if(!document.getElementById('fTo').value){
        document.getElementById('fTo').value=todayStr();
        document.getElementById('fFrom').value=kstDate(new Date(Date.now()-6*86400000));
      }
      loadHistory();
    }
  }

  // ===== 이력 CRUD =====
  async function loadHistory(){
    const from=document.getElementById('fFrom').value, to=document.getElementById('fTo').value;
    let url=`${SUPABASE_URL}/rest/v1/${REPORT_TABLE}?select=*&order=report_date.desc,id.desc&limit=500`;
    if(from) url+=`&report_date=gte.${from}`;
    if(to)   url+=`&report_date=lte.${to}`;
    const tb=document.getElementById('histBody');
    try{
      const r=await fetch(url,{headers:HDR});
      const rows=await r.json();
      if(!rows||rows.length===0){ tb.innerHTML=`<tr><td colspan="6" class="empty">이력이 없습니다.</td></tr>`; return; }
      tb.innerHTML=rows.map(x=>`<tr>
        <td>${x.report_date||''}</td><td>${x.inspector||''}</td><td>${x.model||''}</td>
        <td class="machine">${x.machine||''}호기</td><td class="num pass">${(x.qty||0).toLocaleString()}</td>
        <td><div class="row-act">
          <button class="btn ghost sm" onclick='openHistEdit(${JSON.stringify(x)})'>수정</button>
          <button class="btn danger sm" onclick="delHist(${x.id})">삭제</button>
        </div></td></tr>`).join('');
    }catch(e){ tb.innerHTML=`<tr><td colspan="6" class="empty">조회 실패: ${e.message}</td></tr>`; }
  }
  function openHistEdit(row){
    document.getElementById('histModalTitle').textContent= row?'이력 수정':'이력 추가';
    document.getElementById('hId').value= row?row.id:'';
    document.getElementById('hDate').value= row?row.report_date:todayStr();
    document.getElementById('hInspector').value= row?(row.inspector||''):inspector;
    fillModelSelect(document.getElementById('hModel'), row?row.model:currentModel);
    document.getElementById('hMachine').value= row?(row.machine||''):'';
    document.getElementById('hQty').value= row?(row.qty||0):0;
    document.getElementById('histModal').classList.add('on');
  }
  function closeHistEdit(){ document.getElementById('histModal').classList.remove('on'); }
  async function saveHist(){
    const id=document.getElementById('hId').value;
    const body={
      report_date:document.getElementById('hDate').value,
      inspector:document.getElementById('hInspector').value.trim(),
      customer:'SBC',
      model:document.getElementById('hModel').value,
      machine:document.getElementById('hMachine').value.trim(),
      qty:parseInt(document.getElementById('hQty').value)||0
    };
    try{
      if(id){
        const r=await fetch(`${SUPABASE_URL}/rest/v1/${REPORT_TABLE}?id=eq.${id}`,{method:'PATCH',headers:HDR_J,body:JSON.stringify(body)});
        if(!r.ok) throw new Error(await r.text());
      }else{
        const r=await fetch(`${SUPABASE_URL}/rest/v1/${REPORT_TABLE}`,{method:'POST',headers:HDR_J,body:JSON.stringify([body])});
        if(!r.ok) throw new Error(await r.text());
      }
      closeHistEdit(); loadHistory();
    }catch(e){ alert('저장 실패: '+e.message); }
  }
  async function delHist(id){
    if(!confirm('이 이력을 삭제하시겠습니까?')) return;
    try{
      const r=await fetch(`${SUPABASE_URL}/rest/v1/${REPORT_TABLE}?id=eq.${id}`,{method:'DELETE',headers:HDR});
      if(!r.ok) throw new Error(await r.text());
      loadHistory();
    }catch(e){ alert('삭제 실패: '+e.message); }
  }

  // ===== 설정 =====
  function renderModelList(){
    const el=document.getElementById('modelList');
    if(modelList.length===0){ el.innerHTML='<div class="hint">등록된 기종이 없습니다.</div>'; return; }
    el.innerHTML=modelList.map((m,i)=>`<div class="modelitem"><span>${m}</span><button class="btn danger sm" onclick="removeModel(${i})">삭제</button></div>`).join('');
  }
  function addModel(){
    const v=document.getElementById('newModel').value.trim();
    if(!v) return;
    if(!modelList.includes(v)) modelList.push(v);
    document.getElementById('newModel').value='';
    renderModelList();
  }
  function removeModel(i){ modelList.splice(i,1); renderModelList(); }
  function openSettings(){
    document.getElementById('inInspector').value=inspector;
    renderModelList();
    document.getElementById('settingsModal').classList.add('on');
  }
  function closeSettings(){ document.getElementById('settingsModal').classList.remove('on'); }
  function saveSettings(){
    inspector=document.getElementById('inInspector').value.trim();
    localStorage.setItem(LS_INSPECTOR,inspector);
    localStorage.setItem(LS_MODELS,JSON.stringify(modelList));
    if(currentModel && !modelList.includes(currentModel)){ currentModel=''; localStorage.setItem(LS_CURMODEL,''); }
    closeSettings();
    renderMain(workByMachine(lastCounts));
  }

  // ===== 초기화 =====
  (async ()=>{
    loadLocal();
    await loadMapping();
    await refresh();
    setInterval(refresh, POLL_MS);
  })();
</script>
</body>
</html>
