<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>트윈팩토리 3D v2.2 - 초기화 오류 수정</title>
<style>
:root{--bg:#0c0f16;--card:#151a24;--border:#26304a;--txt:#e6ecf5;--sub:#8b97ad;
--green:#22c55e;--red:#ef4444;--amber:#f59e0b;--accent:#38bdf8;--blue:#3b6fd4;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--txt);overflow:hidden}
.hdr{background:linear-gradient(135deg,#16203a,#1e293b);padding:10px 14px;position:absolute;top:0;left:0;right:0;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.4);border-bottom:1px solid var(--border)}
.hdr-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hdr h1{font-size:16px;font-weight:800}.hdr h1 .v{font-size:10px;color:var(--sub);font-weight:500;margin-left:4px}
.live{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--sub)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green)}
.sum{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.sc{flex:1;min-width:54px;text-align:center;padding:5px 4px;border-radius:8px;background:var(--card);border:1px solid var(--border)}
.sc .l{font-size:10px;color:var(--sub)}.sc .v{font-size:16px;font-weight:800;display:block;margin-top:1px}
.tabs{position:absolute;left:14px;z-index:50;display:flex;gap:6px}
.tab{padding:8px 16px;border-radius:10px;background:var(--card);border:1px solid var(--border);font-weight:700;font-size:14px;cursor:pointer;color:var(--sub)}
.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.tab .b{font-size:10px;opacity:.85;margin-left:3px}
#cv{position:absolute;inset:0;z-index:1;touch-action:none}
.ctrls{position:absolute;right:12px;z-index:50;display:flex;flex-direction:column;gap:6px}
.cbtn{width:42px;height:42px;border-radius:10px;background:var(--card);border:1px solid var(--border);color:var(--txt);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cbtn:active{background:var(--blue)}
.hint{position:absolute;bottom:8px;left:0;right:0;z-index:40;text-align:center;font-size:10px;color:var(--sub);pointer-events:none}
.legend{position:absolute;bottom:24px;left:0;right:0;z-index:40;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;font-size:11px;color:var(--sub);pointer-events:none}
.lg{display:flex;align-items:center;gap:4px}.lg .d{width:12px;height:12px;border-radius:3px}
/* 모달 */
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;align-items:flex-end;justify-content:center}
.mo.show{display:flex;animation:fi .15s}@keyframes fi{from{opacity:0}}
.ms{background:var(--card);width:100%;max-width:480px;border-radius:16px 16px 0 0;max-height:85vh;overflow-y:auto;border:1px solid var(--border);border-bottom:none;animation:su .25s}@keyframes su{from{transform:translateY(100%)}}
.mhd{padding:14px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card)}
.mbdg{width:50px;height:50px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;color:#0b0f17;flex-shrink:0}
.mbdg .n{font-size:18px}.mbdg .t{font-size:9px;opacity:.8}
.minfo{flex:1}.minfo h3{font-size:16px;font-weight:800}.minfo p{font-size:12px;color:var(--sub);margin-top:2px}
.mclose{width:36px;height:36px;border:none;border-radius:50%;background:#0f1117;color:var(--sub);font-size:20px;cursor:pointer}
.mbody{padding:8px 16px 24px}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #1e2433;font-size:14px}
.row:last-child{border-bottom:none}.row .k{color:var(--sub)}.row .vv{font-weight:700}
.prog{height:8px;background:#0f1117;border-radius:4px;overflow:hidden;margin-top:6px}.prog .f{height:100%;border-radius:4px}
.empty{text-align:center;color:var(--sub);padding:40px 20px;font-size:13px}
</style>
</head>

];

var _stopMap={'CL-M001':'소재교환','CL-M002':'불량처리','CL-M003':'부품랩핑','CL-M004':'부품연마','CL-M006':'치수조정','CL-M008':'금형수리','CL-A001':'금형교환','CL-A002':'설비이상','CL-A003':'부품대기','CL-A004':'부품교체','CL-M005':'소재대기','CL-M007':'소재대기','CL-M009':'기타','UL-A001':'금형교환','UL-A002':'설비이상','UL-A003':'부품대기','UL-M007':'소재대기','UL-Z000':'비가동','UL-Z001':'계획정지','UL-Z002':'3정5행','UL-Z003':'Try-Out','UL-Z004':'측정대기','UL-Z005':'타공정지원','UL-Z006':'휴식/식사','UL-Z010':'기타','UL-Z011':'조회/교육'};
function stopName(c){if(!c||c==='N')return'가동';if(_stopMap[c])return _stopMap[c];var s=c.indexOf('-')>=0?c.split('-')[1]:c;return _stopMap[s]||s||'비가동'}
function fmt(n){n=n||0;return n.toLocaleString('ko-KR')}
function hoOf(name){var m=(name||'').match(/^(\d{1,3})/);return m?parseInt(m[1],10):null}

var curZone='B', byHo={}, mmByHo={}, cachedData=[], cd=30;
var GRID_MM=80;  // 격자 1칸 도면단위(미정) — 추후 twin_zone.grid_mm 로 대체

async function loadMaster(){
  var rows=await sbGet('machine_master_tj','select=*&order=sort_order.asc');
  if(!rows)return; mmByHo={};
  rows.forEach(function(m){if(m.active===false)return;var ho=parseInt(m.ho_code,10);if(!isNaN(ho))mmByHo[ho]={maker:m.maker||'',tonnage:m.tonnage||null,customer:m.customer||''}});
}
function metaOf(e){var ho=parseInt(e.no,10),m=mmByHo[ho];return{maker:(m&&m.maker)?m.maker:(e.mk||''),ton:(m&&m.tonnage!=null)?m.tonnage:(e.t||null),customer:(m&&m.customer)?m.customer:''}}

function statusColor(d){
  if(!d) return 0x5b6678;
  if(d.machine_status==='N'){var soon=d.remaining_minutes>0&&d.remaining_minutes<=30;return soon?0xf59e0b:0x22c55e}
  return 0xef4444;
}

// ===== Three.js =====
var renderer,scene,camera,raycaster,mouse,machineGroup,floorGroup;
var camTarget,camTheta,camPhi,camRadius;  // 궤도 파라미터
var meshes=[]; // {mesh, e, d}

function initThree(){
  var cv=document.getElementById('cv');
  renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x0c0f16);
  scene.fog=new THREE.Fog(0x0c0f16, 900, 2600);
  camera=new THREE.PerspectiveCamera(45,1,1,5000);
  raycaster=new THREE.Raycaster(); mouse=new THREE.Vector2();
  var amb=new THREE.AmbientLight(0xffffff,0.75); scene.add(amb);
  var dir=new THREE.DirectionalLight(0xffffff,0.7); dir.position.set(300,600,400); scene.add(dir);
  var dir2=new THREE.DirectionalLight(0x88aaff,0.3); dir2.position.set(-300,400,-200); scene.add(dir2);
  machineGroup=new THREE.Group(); scene.add(machineGroup);
  floorGroup=new THREE.Group(); scene.add(floorGroup);
  // v2.2: 궤도 파라미터 사전 초기화 (buildScene 전에 컨트롤/렌더가 접근해도 안전)
  camTarget=new THREE.Vector3(0,0,0);
  camRadius=1200; camTheta=Math.PI*0.5; camPhi=Math.PI*0.32;
  updateCam();
  resize();
  bindControls(cv);
  animate();
}

function resize(){
  var w=window.innerWidth,h=window.innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h; camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize);

// 호기번호/상태 라벨 텍스처
function makeLabel(no,sub,colorHex){
  var c=document.createElement('canvas'); c.width=256; c.height=128;
  var g=c.getContext('2d');
  g.fillStyle='rgba(255,255,255,0.92)'; roundRect(g,6,6,244,116,16); g.fill();
  g.fillStyle='#'+('000000'+colorHex.toString(16)).slice(-6);
  g.fillRect(10,10,236,8);
  g.fillStyle='#0b0f17'; g.textAlign='center';
  g.font='bold 64px sans-serif'; g.fillText(no,128,72);
  g.font='600 30px sans-serif'; g.fillStyle='#444'; g.fillText(sub,128,108);
  var tex=new THREE.CanvasTexture(c); tex.minFilter=THREE.LinearFilter;
  return tex;
}
function roundRect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}

function buildScene(){
  // clear
  while(machineGroup.children.length) machineGroup.remove(machineGroup.children[0]);
  while(floorGroup.children.length) floorGroup.remove(floorGroup.children[0]);
  meshes=[];
  var zone=ZONES.filter(function(z){return z.id===curZone})[0];
  var maxX=0,maxY=0; zone.equip.forEach(function(e){maxX=Math.max(maxX,e.x+e.w);maxY=Math.max(maxY,e.y+e.h)});
  var cx=maxX/2, cy=maxY/2;

  // 바닥
  var floorGeo=new THREE.PlaneGeometry(maxX+200,maxY+200);
  var floorMat=new THREE.MeshStandardMaterial({color:0x10151f,roughness:0.97,metalness:0});
  var floor=new THREE.Mesh(floorGeo,floorMat);
  floor.rotation.x=-Math.PI/2; floor.position.set(0,0,0);
  floorGroup.add(floor);
  // 2D 격자(연하게) — 격자 단위 미정이라 기본 GRID_MM(=80px 도면단위) 사용
  var span=Math.max(maxX,maxY)+200;
  var divisions=Math.max(8, Math.round(span/GRID_MM));
  var grid=new THREE.GridHelper(span, divisions, 0x3a4a6a, 0x222c40);
  grid.position.y=0.4;
  grid.material.opacity=0.5; grid.material.transparent=true;
  floorGroup.add(grid);
  // 굵은 기준선(중앙 십자)
  var axisMat=new THREE.LineBasicMaterial({color:0x3a4a6a,transparent:true,opacity:0.6});
  var ag=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-span/2,0.6,0),new THREE.Vector3(span/2,0.6,0)]);
  floorGroup.add(new THREE.Line(ag,axisMat));
  var ag2=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0.6,-span/2),new THREE.Vector3(0,0.6,span/2)]);
  floorGroup.add(new THREE.Line(ag2,axisMat));

  zone.equip.forEach(function(e){
    var ho=parseInt(e.no,10), d=byHo[ho]||null, meta=metaOf(e);
    var col=statusColor(d);
    var t=meta.ton||100;
    var hgt=Math.max(28, Math.min(150, 28 + t/5));  // 톤수 → 3D 높이
    // 중심 정렬 좌표 (도면 y는 깊이 z로). 중심축 기준이라 회전도 자유.
    var bx=(e.x+e.w/2)-cx;
    var bz=(e.y+e.h/2)-cy;
    var geo=new THREE.BoxGeometry(e.w,hgt,e.h);
    var mat=new THREE.MeshStandardMaterial({color:col,roughness:0.6,metalness:0.1});
    var mesh=new THREE.Mesh(geo,mat);
    mesh.position.set(bx,hgt/2,bz);
    machineGroup.add(mesh);
    // 윗면 라벨(평면 스프라이트)
    var sub=d?(d.machine_status==='N'?'가동':stopName(d.machine_status)):(meta.maker||'');
    var tex=makeLabel(e.no,sub,col);
    var lmat=new THREE.MeshBasicMaterial({map:tex,transparent:true});
    var lgeo=new THREE.PlaneGeometry(Math.min(e.w,e.h)*0.9, Math.min(e.w,e.h)*0.45);
    var lab=new THREE.Mesh(lgeo,lmat);
    lab.rotation.x=-Math.PI/2; lab.position.set(bx,hgt+0.6,bz);
    machineGroup.add(lab);
    meshes.push({mesh:mesh,e:e,d:d});
  });

  // 카메라 초기화 (도면 크기에 맞춤)
  camTarget=new THREE.Vector3(0,0,0);
  camRadius=Math.max(maxX,maxY)*1.15;
  camTheta=Math.PI*0.5;   // 정면
  camPhi=Math.PI*0.32;    // 위에서 비스듬히
  updateCam();
}

function updateCam(){
  if(!camTarget||!camera)return;
  var x=camTarget.x + camRadius*Math.sin(camPhi)*Math.cos(camTheta);
  var y=camTarget.y + camRadius*Math.cos(camPhi);
  var z=camTarget.z + camRadius*Math.sin(camPhi)*Math.sin(camTheta);
  camera.position.set(x,y,z);
  camera.lookAt(camTarget);
}

function animate(){requestAnimationFrame(animate);renderer.render(scene,camera)}

// ===== 자체 궤도 컨트롤 (CAD 정석) =====
// 우클릭 드래그 = 회전 / 휠클릭(중간) 드래그 = 팬(상하좌우) / 휠스크롤 = 줌 / 좌클릭 = 선택
function bindControls(cv){
  var orbiting=false,panning=false,lx=0,ly=0;
  var pinchD=0,pinchMode=false;
  var downX,downY,downT,downBtn;
  cv.addEventListener('mousedown',function(e){
    downX=e.clientX;downY=e.clientY;downT=Date.now();downBtn=e.button;
    lx=e.clientX;ly=e.clientY;
    if(e.button===2){orbiting=true;e.preventDefault();}       // 우클릭 = 회전
    else if(e.button===1){panning=true;e.preventDefault();}    // 휠클릭 = 팬
    // 좌클릭(0)은 선택용 → mouseup에서 판정
  });
  window.addEventListener('mousemove',function(e){
    if(!orbiting&&!panning)return;
    var dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;
    if(orbiting)orbit(dx,dy);else pan(dx,dy);
  });
  window.addEventListener('mouseup',function(e){
    // 좌클릭 짧게 + 거의 안움직임 → 선택
    if(e.button===0 && downBtn===0 && Date.now()-downT<250 && Math.abs(e.clientX-downX)<5 && Math.abs(e.clientY-downY)<5){
      pick(e.clientX,e.clientY);
    }
    orbiting=false;panning=false;
  });
  cv.addEventListener('contextmenu',function(e){e.preventDefault()}); // 우클릭 메뉴 차단(회전용)
  cv.addEventListener('wheel',function(e){e.preventDefault();zoomBy(e.deltaY>0?1.1:0.9)},{passive:false}); // 휠 = 줌
  // 터치: 1손가락=회전, 2손가락=핀치줌+팬, 짧은탭=선택
  cv.addEventListener('touchstart',function(e){
    if(e.touches.length===1){orbiting=true;lx=e.touches[0].clientX;ly=e.touches[0].clientY;downX=lx;downY=ly;downT=Date.now()}
    else if(e.touches.length===2){pinchMode=true;orbiting=false;pinchD=touchDist(e);lx=(e.touches[0].clientX+e.touches[1].clientX)/2;ly=(e.touches[0].clientY+e.touches[1].clientY)/2}
  },{passive:false});
  cv.addEventListener('touchmove',function(e){
    e.preventDefault();
    if(pinchMode&&e.touches.length===2){
      var d=touchDist(e);zoomBy(pinchD/d);pinchD=d;
      var mx=(e.touches[0].clientX+e.touches[1].clientX)/2,my=(e.touches[0].clientY+e.touches[1].clientY)/2;
      pan(mx-lx,my-ly);lx=mx;ly=my;
    } else if(orbiting&&e.touches.length===1){
      var dx=e.touches[0].clientX-lx,dy=e.touches[0].clientY-ly;lx=e.touches[0].clientX;ly=e.touches[0].clientY;orbit(dx,dy);
    }
  },{passive:false});
  cv.addEventListener('touchend',function(e){
    if(pinchMode){pinchMode=false}
    else if(orbiting&&Date.now()-downT<250){
      var t=e.changedTouches[0];
      if(t&&Math.abs(t.clientX-downX)<6&&Math.abs(t.clientY-downY)<6)pick(downX,downY);
    }
    orbiting=false;
  });
}
function touchDist(e){var dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;return Math.hypot(dx,dy)}
function orbit(dx,dy){
  camTheta-=dx*0.008; camPhi-=dy*0.008;
  camPhi=Math.max(0.12,Math.min(Math.PI*0.49,camPhi));
  updateCam();
}
function pan(dx,dy){
  var ps=camRadius*0.0016;
  var right=new THREE.Vector3(Math.cos(camTheta+Math.PI/2),0,Math.sin(camTheta+Math.PI/2));
  var fwd=new THREE.Vector3(Math.cos(camTheta),0,Math.sin(camTheta));
  camTarget.addScaledVector(right,-dx*ps);
  camTarget.addScaledVector(fwd,-dy*ps);
  updateCam();
}
function zoomBy(f){camRadius=Math.max(120,Math.min(4000,camRadius*f));updateCam()}
function resetView(){camTheta=Math.PI*0.5;camPhi=Math.PI*0.32;var z=ZONES.filter(function(zz){return zz.id===curZone})[0];var mx=0,my=0;z.equip.forEach(function(e){mx=Math.max(mx,e.x+e.w);my=Math.max(my,e.y+e.h)});camTarget.set(0,0,0);camRadius=Math.max(mx,my)*1.15;updateCam()}
function topView(){camPhi=0.13;updateCam()}

function pick(clientX,clientY){
  var rect=renderer.domElement.getBoundingClientRect();
  mouse.x=((clientX-rect.left)/rect.width)*2-1;
  mouse.y=-((clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(mouse,camera);
  var hits=raycaster.intersectObjects(meshes.map(function(m){return m.mesh}));
  if(hits.length){
    var hit=hits[0].object;
    var rec=meshes.filter(function(m){return m.mesh===hit})[0];
    if(rec) openModal(rec.e,rec.d);
  }
}

// ===== 모달 =====
function openModal(e,d){
  var meta=metaOf(e);var colHex=statusColor(d);
  var faceHex='#'+('000000'+colHex.toString(16)).slice(-6);
  document.getElementById('mBdg').style.background=faceHex;
  document.getElementById('mBn').textContent=e.no;
  document.getElementById('mBt').textContent=(meta.ton||'')+'t';
  document.getElementById('mTitle').textContent=e.no+'호기 · '+(meta.maker||'')+' '+(meta.ton||'')+'톤';
  var body=document.getElementById('mBody');
  if(!d){
    document.getElementById('mSub').textContent=(meta.customer||'')+(meta.customer?' · ':'')+'실시간 데이터 없음';
    body.innerHTML='<div class="empty">현재 이 설비의 실시간 데이터가 없습니다.<br>(작업지시 미등록 또는 통신 대기)</div>';
  }else{
    var run=d.machine_status==='N';
    document.getElementById('mSub').textContent=(d.customer||meta.customer||'')+' · '+(run?'가동중':stopName(d.machine_status));
    var rate=d.target_qty>0?(d.actual_qty/d.target_qty*100):0;
    var fc=rate>=80?'#22c55e':rate>=50?'#f59e0b':'#ef4444';
    var rm=d.remaining_minutes;
    var rmTxt=(rm==null)?'-':(rm<=0?'완료/초과':(rm<60?Math.round(rm)+'분':(Math.floor(rm/60)+'시간 '+Math.round(rm%60)+'분')));
    function r(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="vv">'+v+'</span></div>'}
    body.innerHTML=
      r('상태',run?'<span style="color:#22c55e">● 가동</span>':'<span style="color:#ef4444">■ '+stopName(d.machine_status)+'</span>')+
      r('고객사',d.customer||meta.customer||'-')+
      r('금형',d.current_mold||'-')+r('품번',d.current_item_code||'-')+r('품명',d.item_name||'-')+
      r('실적 / 가능',fmt(d.actual_qty)+' / '+fmt(d.target_qty))+
      '<div class="row" style="flex-direction:column;align-items:stretch"><div style="display:flex;justify-content:space-between"><span class="k">달성률</span><span class="vv" style="color:'+fc+'">'+rate.toFixed(0)+'%</span></div><div class="prog"><div class="f" style="width:'+Math.min(rate,100)+'%;background:'+fc+'"></div></div></div>'+
      r('잔량',fmt(d.remaining_qty))+r('잔여시간',rmTxt)+r('로트',d.lot_no||'-')+
      r('CT (실/목표)',(d.actual_ct>0?d.actual_ct.toFixed(1):'-')+' / '+(d.target_ct>0?d.target_ct.toFixed(1):'-'))+
      r('NG',(d.ng_qty>0?'<span style="color:#ef4444">'+d.ng_qty+'</span>':'0'))+r('작업자',d.worker||'-');
  }
  document.getElementById('modal').classList.add('show');
}
function closeModal(){document.getElementById('modal').classList.remove('show')}

function buildTabs(){
  var tb=document.getElementById('tabs');tb.innerHTML='';
  ZONES.forEach(function(z){var t=document.createElement('div');t.className='tab'+(z.id===curZone?' active':'');t.innerHTML=z.name+'<span class="b">'+z.equip.length+'대</span>';t.onclick=function(){curZone=z.id;buildTabs();buildScene()};tb.appendChild(t)});
}
function updateSummary(){
  var total=cachedData.length,run=cachedData.filter(function(d){return d.machine_status==='N'}).length;
  var soon=cachedData.filter(function(d){return d.machine_status==='N'&&d.remaining_minutes>0&&d.remaining_minutes<=30}).length;
  var qty=cachedData.reduce(function(s,d){return s+(d.actual_qty||0)},0);
  document.getElementById('sTotal').textContent=total;document.getElementById('sRun').textContent=run;document.getElementById('sStop').textContent=total-run;document.getElementById('sSoon').textContent=soon;document.getElementById('sQty').textContent=fmt(qty);
}
async function load(){
  var data=await sbGet('machine_status','select=*&order=machine_code.asc');
  if(!data){document.getElementById('upd').textContent='연결 실패';document.getElementById('dot').style.background='var(--red)';return}
  cachedData=data;byHo={};
  data.forEach(function(d){var ho=hoOf(d.machine_name);if(ho!=null)byHo[ho]=d});
  updateSummary();buildScene();
  var dt=data[0]&&data[0].updated_at?new Date(data[0].updated_at):new Date();
  document.getElementById('upd').textContent=dt.toLocaleTimeString('ko-KR');
  document.getElementById('dot').style.background=(Date.now()-dt.getTime())/60000>10?'var(--amber)':'var(--green)';
  cd=30;
}
function tick(){cd--;if(cd<=0)load();document.getElementById('cd').textContent=Math.max(cd,0)}

// 탭 위치(헤더 높이 아래)
function placeTabs(){var h=document.querySelector('.hdr').offsetHeight;document.querySelector('.tabs').style.top=(h+8)+'px';document.querySelector('.ctrls').style.top=(h+8)+'px'}

initThree();
buildTabs();
placeTabs();
window.addEventListener('resize',placeTabs);
loadMaster().then(load);
setInterval(tick,1000);
</script>
