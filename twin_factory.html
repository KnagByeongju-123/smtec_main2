<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>트윈팩토리 3D v13.27 - 디스플레이 전송·매핑 제거</title>
<style>
:root{--bg:#0c0f16;--card:#151a24;--border:#26304a;--txt:#e6ecf5;--sub:#8b97ad;
--green:#22c55e;--red:#ef4444;--amber:#f59e0b;--accent:#38bdf8;--blue:#3b6fd4;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--txt);overflow:hidden}
.hdr{background:linear-gradient(135deg,#16203a,#1e293b);padding:10px 14px;position:absolute;top:0;left:0;right:0;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.4);border-bottom:1px solid var(--border)}
.hdr-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hdr h1{font-size:16px;font-weight:800}.hdr h1 .v{font-size:10px;color:var(--sub);font-weight:500;margin-left:4px}
.live{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--sub)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green)}
.sum{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.sc{flex:1;min-width:54px;text-align:center;padding:5px 4px;border-radius:8px;background:var(--card);border:1px solid var(--border)}
.sc .l{font-size:10px;color:var(--sub)}.sc .v{font-size:16px;font-weight:800;display:block;margin-top:1px}
.tabs{position:absolute;left:14px;z-index:50;display:flex;gap:6px}
.tab{padding:8px 16px;border-radius:10px;background:var(--card);border:1px solid var(--border);font-weight:700;font-size:14px;cursor:pointer;color:var(--sub)}
.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.tab .b{font-size:10px;opacity:.85;margin-left:3px}
#cv{position:absolute;inset:0;z-index:1;touch-action:none}
.ctrls{position:absolute;right:12px;z-index:50;display:flex;flex-direction:column;gap:6px}
.cbtn{width:42px;height:42px;border-radius:10px;background:var(--card);border:1px solid var(--border);color:var(--txt);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cbtn:active{background:var(--blue)}
.cbtn.on{background:var(--blue);border-color:var(--blue)}
#patrolPanel{position:fixed;left:10px;bottom:10px;z-index:60;background:rgba(15,20,30,0.92);border:1px solid #2a3550;border-radius:12px;padding:10px 12px;display:none;width:210px}
#patrolPanel.show{display:block}
#patrolPanel label{display:block;color:#cfd8e3;font-size:12px;margin:6px 0 2px}
#patrolPanel input[type=range]{width:100%}
.hint{position:absolute;bottom:8px;left:0;right:0;z-index:40;text-align:center;font-size:10px;color:var(--sub);pointer-events:none}
.legend{position:absolute;bottom:24px;left:0;right:0;z-index:40;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;font-size:11px;color:var(--sub);pointer-events:none}
.lg{display:flex;align-items:center;gap:4px}.lg .d{width:12px;height:12px;border-radius:3px}
/* 모달 */
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;align-items:flex-end;justify-content:center}
.mo.show{display:flex;animation:fi .15s}@keyframes fi{from{opacity:0}}
.mo.rise .ms{animation:msRise .55s cubic-bezier(.22,1,.36,1)}
@keyframes msRise{from{opacity:0;transform:translateY(60px) scale(.92)}to{opacity:1;transform:translateY(0) scale(1)}}
.mo.rise .mbody .row, .mo.rise .mbody>div{animation:rowIn .5s both}
@keyframes rowIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.ms{background:var(--card);width:100%;max-width:480px;border-radius:16px 16px 0 0;max-height:85vh;overflow-y:auto;border:1px solid var(--border);border-bottom:none;animation:su .25s}@keyframes su{from{transform:translateY(100%)}}
.mhd{padding:14px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card)}
.mbdg{width:50px;height:50px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;color:#0b0f17;flex-shrink:0}
.mbdg .n{font-size:18px}.mbdg .t{font-size:9px;opacity:.8}
.minfo{flex:1}.minfo h3{font-size:16px;font-weight:800}.minfo p{font-size:12px;color:var(--sub);margin-top:2px}
.mclose{width:36px;height:36px;border:none;border-radius:50%;background:#0f1117;color:var(--sub);font-size:20px;cursor:pointer}
.mbody{padding:8px 16px 24px}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #1e2433;font-size:14px}
.row:last-child{border-bottom:none}.row .k{color:var(--sub)}.row .vv{font-weight:700}
.prog{height:8px;background:#0f1117;border-radius:4px;overflow:hidden;margin-top:6px}.prog .f{height:100%;border-radius:4px}
.empty{text-align:center;color:var(--sub);padding:40px 20px;font-size:13px}
/* ===== 2D 편집기 ===== */
#editor{display:none;position:absolute;inset:0;z-index:60;background:var(--bg);flex-direction:column}
#editor.show{display:flex}
.ed-top{padding:8px 12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--border);background:var(--card)}
.ed-top .seg{display:flex;gap:4px}
.ed-btn{padding:7px 12px;border-radius:8px;border:1px solid var(--border);background:#0f1117;color:var(--txt);font-size:12px;font-weight:600;cursor:pointer}
.ed-btn.on{background:var(--blue);border-color:var(--blue);color:#fff}
.ed-btn.save{background:#15803d;border-color:#15803d;color:#fff}
.ed-btn.exit{background:#374151;border-color:#374151;color:#fff}
.ed-main{flex:1;display:flex;min-height:0}
#edCanvasWrap{flex:1;overflow:hidden;position:relative;background:#0a0d14;touch-action:none}
#edCanvas{position:absolute;left:0;top:0}
.ed-side{width:230px;border-left:1px solid var(--border);background:var(--card);overflow-y:auto;padding:10px;font-size:12px}
.ed-side h4{font-size:12px;color:var(--accent);margin:10px 0 6px;font-weight:700}
.ed-side h4:first-child{margin-top:0}
.ed-fld{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:5px 0}
.ed-fld label{color:var(--sub);font-size:11px;flex:1}
.ed-fld input[type=number],.ed-fld input[type=text],.ed-fld select{width:86px;padding:5px 6px;background:#0f1117;border:1px solid var(--border);border-radius:5px;color:var(--txt);font-size:12px;font-family:inherit}
.ed-fld input[type=color]{width:36px;height:26px;padding:0;border:1px solid var(--border);background:none;border-radius:4px}
.ed-palette{display:flex;flex-wrap:wrap;gap:4px;max-height:160px;overflow-y:auto}
.ed-chip{padding:5px 7px;border-radius:6px;background:#0f1117;border:1px solid var(--border);font-size:11px;font-weight:700;cursor:pointer;color:var(--txt)}
.ed-chip:active{background:var(--blue)}
.ed-hint{font-size:10px;color:var(--sub);margin-top:6px;line-height:1.5}
.ed-del{width:100%;padding:7px;border-radius:6px;border:1px solid #b91c1c;background:#7f1d1d;color:#fff;font-size:11px;font-weight:700;cursor:pointer;margin-top:6px}
</style>

// OEE(설비종합효율) = 가동률 × 성능 × 양품률 (각 0~1)
function calcOEE(d){
  if(!d) return null;
  var run=Number(d.run_min)||0, stop=Number(d.stop_min)||0;
  var planned=run+stop;
  var avail = planned>0 ? run/planned : null;
  var tct=Number(d.target_ct)||0, act=Number(d.actual_ct)||0;
  var perf = (tct>0&&act>0) ? Math.min(tct/act,1) : null;
  var aq=Number(d.actual_qty)||0, ng=Number(d.ng_qty)||0;
  var qual = aq>0 ? Math.max(0,(aq-ng)/aq) : null;
  if(avail==null&&perf==null&&qual==null) return null;
  var oee=(avail==null?1:avail)*(perf==null?1:perf)*(qual==null?1:qual);
  return {oee:oee, avail:avail, perf:perf, qual:qual};
}

}

}

// 둥근 모서리 박스 (r128 RoundedBoxGeometry 미포함 → ExtrudeGeometry로 구현)
function roundedBox(w,h,d,r){
  r=Math.min(r, w/2-0.001, d/2-0.001);
  if(r<=0.001) return new THREE.BoxGeometry(w,h,d);
  var shape=new THREE.Shape();
  var x=-w/2, z=-d/2;
  shape.moveTo(x+r, z);
  shape.lineTo(x+w-r, z);
  shape.quadraticCurveTo(x+w, z, x+w, z+r);
  shape.lineTo(x+w, z+d-r);
  shape.quadraticCurveTo(x+w, z+d, x+w-r, z+d);
  shape.lineTo(x+r, z+d);
  shape.quadraticCurveTo(x, z+d, x, z+d-r);
  shape.lineTo(x, z+r);
  shape.quadraticCurveTo(x, z, x+r, z);
  var bevel=Math.min(r*0.6, h*0.15);
  var geo=new THREE.ExtrudeGeometry(shape,{depth:h-bevel*2, bevelEnabled:true,
    bevelThickness:bevel, bevelSize:bevel, bevelSegments:3, curveSegments:6});
  geo.rotateX(-Math.PI/2);            // 압출축(z) → 세로(y)
  geo.computeBoundingBox();
  geo.translate(0, -geo.boundingBox.min.y, 0);   // 바닥이 정확히 y=0에 오도록
  return geo;
}
function buildScene(){
  // clear
  while(machineGroup.children.length) machineGroup.remove(machineGroup.children[0]);
  while(floorGroup.children.length) floorGroup.remove(floorGroup.children[0]);
  meshes=[];
  var zone=ZONES.filter(function(z){return z.id===curZone})[0];
  // 모든 설비를 m로 환산, 바닥 크기(m) 산정
  var items=zone.equip.map(function(e){ var m=pxToM(e); return {e:e, mx:m.x, my:m.y, mw:m.w, mh:m.h}; });
  var maxX=0,maxY=0; items.forEach(function(it){maxX=Math.max(maxX,it.mx+it.mw);maxY=Math.max(maxY,it.my+it.mh)});
  var cx=maxX/2, cy=maxY/2;
  var floorW=maxX, floorH=maxY;  // m
  patrolFloorW=floorW; patrolFloorH=floorH;

  // 바닥 — 고급 산업 콘크리트 톤(밝게, 가시성↑) + 약한 광택
  var floorGeo=new THREE.PlaneGeometry(floorW,floorH);
  var floorMat=new THREE.MeshStandardMaterial({color:0x4a525e,roughness:0.8,metalness:0.12});
  var floor=new THREE.Mesh(floorGeo,floorMat);
  floor.rotation.x=-Math.PI/2; floor.position.set(0,0.01,0);
  floorGroup.add(floor);

  // 격자 — 1m × 1m 정사각 칸. 격자 중심을 씬 중앙(0,0)에 → 공장 바닥이 격자 중앙에 위치
  var gN=Math.max(4, Math.ceil(Math.max(floorW,floorH)/GRID_M));
  var gSize=gN*GRID_M;                          // 정사각 한 변(1m 칸 × gN)
  var grid=new THREE.GridHelper(gSize, gN, 0x8a99b5, 0x5a6478);
  grid.material.opacity=0.4; grid.material.transparent=true;
  grid.position.set(0, 0.02, 0);
  floorGroup.add(grid);

  // 바닥 외곽선 (테두리) — 두께/색상은 zone 설정값(없으면 기본)

  items.forEach(function(it){
    var e=it.e;
    var ho=parseInt(e.no,10), d=byHo[ho]||null, meta=metaOf(e);
    var col=statusColor(d);
    var hgt=tonToHeightM(meta.ton);            // m
    var bx=(it.mx+it.mw/2)-cx;
    var bz=(it.my+it.mh/2)-cy;
    var rad=Math.min(it.mw,it.mh)*0.12;        // 모서리 R (설비 크기 비례)
    var geo=roundedBox(it.mw,hgt,it.mh,rad);
    var running = d && d.machine_status==='N';
    var mat=new THREE.MeshStandardMaterial({color:col,roughness:0.32,metalness:0.7,
      transparent:true, opacity:running?0.78:0.32});  // 가동=불투명(금형 살짝 보임) / 비가동=투명
    var mesh=new THREE.Mesh(geo,mat);
    mesh.position.set(bx,0,bz);                 // roundedBox는 바닥 기준 y=0
    machineGroup.add(mesh);
    // 가동 중이면 본체 내부에 프레스 금형(상형 왕복 + 하형 고정) 표시
    if(running){
      var iw=it.mw*0.5, idp=it.mh*0.5;             // 내부 금형 폭/깊이
      // 하형(고정 베드) — 본체 하부
      var lowerMat=new THREE.MeshStandardMaterial({color:0x9aa6b6,roughness:0.4,metalness:0.7});
      var lowerH=Math.max(0.1,hgt*0.14);
      var lower=new THREE.Mesh(new THREE.BoxGeometry(iw,lowerH,idp),lowerMat);
      lower.position.set(bx, hgt*0.28, bz);          // 하형(중하단)
      machineGroup.add(lower);
      // 상형(왕복) — 파란 금형
      var upMat=new THREE.MeshStandardMaterial({color:0x4ea3ff,roughness:0.3,metalness:0.75});
      var upH=Math.max(0.12,hgt*0.2);
      var up=new THREE.Mesh(new THREE.BoxGeometry(iw*0.92,upH,idp*0.92),upMat);
      var topY=hgt*0.82;                             // 상사점(본체 상부)
      var botY=hgt*0.28+lowerH/2+upH/2+0.02;         // 하사점(하형 바로 위)
      up.position.set(bx,topY,bz);
      up.userData.press={topY:topY,botY:botY,phase:Math.random()*Math.PI*2,
        spd:(d.actual_ct>0? Math.max(0.12, 1.2/d.actual_ct) : 0.4)};  // 1/5 속도
      machineGroup.add(up);
      // 소재 코일 릴 — 설비 옆에 세움, 잔량%만큼 코일 두께
      // 소재 코일 릴 — 잔량%(수량 기준: 잔량 ÷ 가능, 생산현황과 동일)만큼 코일 두께
      var capQ=Number(d.target_qty)||0;                  // 가능 수량
      var remQ=Number(d.remaining_qty);
      if(remQ==null||isNaN(remQ)) remQ=capQ-(Number(d.actual_qty)||0);
      if(capQ>0){
        var ratio=Math.max(0,Math.min(1, remQ/capQ));    // 잔량 비율 = 잔량 ÷ 가능
        var hubR=Math.max(0.12,it.mw*0.12);               // 중심축(코어) 반지름
        var fullR=Math.max(hubR+0.1,it.mw*0.38);          // 만량 시 외경
        var coilR=hubR+(fullR-hubR)*ratio;                // 현재 외경(잔량 반영)
        var reelMat=new THREE.MeshStandardMaterial({color:0xb8c0cc,roughness:0.5,metalness:0.6});
        var coilMat=new THREE.MeshStandardMaterial({color:0xe0a44a,roughness:0.45,metalness:0.5}); // 코일(금속띠)
        var coilW=Math.max(0.15,it.mh*0.28);              // 코일 폭(축방향)
        var rx=bx + it.mw/2 + fullR + 0.15;               // 설비 오른쪽 옆
        var ry=hgt*0.5;                                   // 높이
        // 코일(원판) — 눕혀서 세로로 세움(축이 z방향)
        var coil=new THREE.Mesh(new THREE.CylinderGeometry(coilR,coilR,coilW,28),coilMat);
        coil.rotation.x=Math.PI/2;
        coil.position.set(rx,ry,bz);
        machineGroup.add(coil);
        // 중심 코어
        var hub=new THREE.Mesh(new THREE.CylinderGeometry(hubR,hubR,coilW+0.08,16),reelMat);
        hub.rotation.x=Math.PI/2;
        hub.position.set(rx,ry,bz);
        machineGroup.add(hub);
        // 잔량 % 라벨(릴 위)
        var pctTex=makeReelLabel(Math.round(ratio*100));
        var pctMat=new THREE.MeshBasicMaterial({map:pctTex,transparent:true,side:THREE.DoubleSide});
        var pct=new THREE.Mesh(new THREE.PlaneGeometry(fullR*1.4,fullR*0.7),pctMat);
        pct.position.set(rx,ry+fullR+0.35,bz);
        pct.userData.billboard=true;
        machineGroup.add(pct);
        // 소재 위쪽에 현재 생산 품번 + 치수상태
        var modelNm=d.current_item_code||d.item_name||'';
        if(modelNm){
          var mTex=makeModelLabel(modelNm);
          var mMat=new THREE.MeshBasicMaterial({map:mTex,transparent:true,side:THREE.DoubleSide});
          var mw2=fullR*2.2, mh2=mw2*(72/320);
          var mlab=new THREE.Mesh(new THREE.PlaneGeometry(mw2,mh2),mMat);
          mlab.position.set(rx,ry+fullR+0.35+0.55,bz);
          mlab.userData.billboard=true;
          machineGroup.add(mlab);
          // 치수상태 배지(정상/위험) — 품번 라벨 위
          var dim=dimOfMachine(d);
          if(dim){
            var dTex=makeDimBadge(dim);
            var dMat=new THREE.MeshBasicMaterial({map:dTex,transparent:true,side:THREE.DoubleSide});
            var dw=fullR*2.0, dh=dw*(56/300);
            var dlab=new THREE.Mesh(new THREE.PlaneGeometry(dw,dh),dMat);
            dlab.position.set(rx,ry+fullR+0.35+0.55+mh2*0.6+0.45,bz);
            dlab.userData.billboard=true;
            machineGroup.add(dlab);
          }
        }
      }
    }
    // 작업자 라벨 — 설비 왼쪽(소재 코일 반대쪽), 사람 아이콘+이름
    var worker=(d && d.worker ? String(d.worker) : '').trim();
    if(worker && worker!=='-'){
      var wTex=makeWorkerLabel(worker);
      var wMat=new THREE.MeshBasicMaterial({map:wTex,transparent:true,side:THREE.DoubleSide});
      var ww=Math.max(1.1, it.mw*0.95), wh=ww*(96/320);
      var wlab=new THREE.Mesh(new THREE.PlaneGeometry(ww,wh),wMat);
      if(d && isMeasWait(d)){
        wlab.position.set(-cx - 2.5, hgt*0.5, bz);                 // 측정대기 → 공장 왼쪽 바깥
      } else {
        wlab.position.set(bx - it.mw/2 - ww/2 - 0.2, hgt*0.5, bz); // 평소: 설비 왼쪽(코일 반대쪽)
      }
      wlab.userData.billboard=true;
      machineGroup.add(wlab);
    }
    // 호기번호 라벨 — 항상 카메라를 향하는 빌보드, 설비 위에 표시
    var tex=makeLabel(e.no,'',col);
    var lmat=new THREE.MeshBasicMaterial({map:tex,transparent:true,side:THREE.DoubleSide});
    var lw=Math.min(it.mw*0.7, 1.1);

    lab.position.set(bx, hgt+0.55, bz);          // 설비 위 공중
    lab.userData.billboard=true;
    machineGroup.add(lab);
    // 점검 알림보드 — 설비 위 공중 간판
    var insp=inspByHo[ho]||{};
    var is300=(meta.ton||0)>=300;

      board.position.set(bx, hgt + 1.3 + boardH/2, bz);
      board.userData.billboard=true;
      machineGroup.add(board);
    }
    meshes.push({mesh:mesh,e:e,d:d});
  });

  // 카메라는 buildScene에서 건드리지 않음(시점은 applyNormalView/패트롤이 전담)
  rebuildEngineers();   // 동별 엔지니어 마커 재생성(위치/순회 보존)
}

function addOutline(w,h,colorStr,tw){
  var col=parseInt((colorStr||'#5b6fa0').replace('#',''),16);
  var mat=new THREE.MeshStandardMaterial({color:col,roughness:0.7,metalness:0.1});
  var hh=Math.max(0.05, tw);  // 외곽선 높이=두께와 비슷하게
  function bar(bw,bd,px,pz){
    var m=new THREE.Mesh(new THREE.BoxGeometry(bw,hh,bd),mat);
    m.position.set(px,hh/2,pz); floorGroup.add(m);
  }
  bar(w+tw, tw, 0, -h/2);   // 상
  bar(w+tw, tw, 0,  h/2);   // 하
  bar(tw, h+tw, -w/2, 0);   // 좌
  bar(tw, h+tw,  w/2, 0);   // 우
}

// 현재 카메라 상태 읽기(손으로 움직인 결과 그대로)
function currentView(){
  var p=camera.position, t=camTarget;
  return {px:p.x,py:p.y,pz:p.z,tx:t.x,ty:t.y,tz:t.z};
}
// 뷰 적용: 신형(px..tz) 우선, 없으면 구형(x/up/back/cz) 변환
function applyView(v){
  if(!camera||!v)return;
  if(v.px!=null){
    camera.position.set(v.px,v.py,v.pz);
    camTarget.set(v.tx,v.ty,v.tz);
  } else {
    camera.position.set(v.x, v.up, v.cz-v.back);
    camTarget.set(v.x, 0, v.cz);
  }
  // 궤도 파라미터도 현재 카메라에 동기화(손동작 이어받기)
  syncOrbitFromCamera();
  camera.lookAt(camTarget);
}
// 카메라 position/target → 궤도(theta/phi/radius) 역산
function syncOrbitFromCamera(){
  var dx=camera.position.x-camTarget.x, dy=camera.position.y-camTarget.y, dz=camera.position.z-camTarget.z;
  camRadius=Math.sqrt(dx*dx+dy*dy+dz*dz)||20;
  camPhi=Math.acos(Math.max(-1,Math.min(1,dy/camRadius)));
  camTheta=Math.atan2(dz,dx);
}

var patrolTimer=0, PATROL_ZONE_SEC=12, patrolBase=null, patrolCzStart=0, patrolCzEnd=0, patrolStartMs=0;
function setupPatrolRange(){
  var z=ZONES.filter(function(zz){return zz.id===curZone})[0];
  var my=0; z.equip.forEach(function(e){var m=pxToM(e);my=Math.max(my,m.y+m.h)});
  var H=my;
  var v=getView(curZone,'patrol')||getView(curZone,'normal');
  if(v&&v.px!=null){ patrolBase=v; }
  else if(v){ patrolBase={px:v.x,py:v.up,pz:v.cz-v.back,tx:v.x,ty:0,tz:v.cz}; }
  else {
    // 기본: 위에서 비스듬히
    patrolBase={px:0,py:Math.max(H*0.8,40),pz:H*0.5,tx:0,ty:0,tz:0};
  }
  // 저장 뷰의 target.z를 시작점으로, 라인 반대쪽 끝까지 z 평행이동
  patrolCzStart=patrolBase.tz;
  patrolCzEnd = (patrolCzStart<0)?(H/2):(-H/2);
}
function applyPatrolFrame(cz){
  if(!camera||!patrolBase)return;
  var b=patrolBase, dz=cz-b.tz;     // target.z 이동량만큼 카메라도 평행이동
  camera.position.set(b.px, b.py, b.pz+dz);
  camTarget.set(b.tx, b.ty, cz);
  syncOrbitFromCamera();
  camera.lookAt(camTarget);
}

  patrolOn=!patrolOn;

  if(patrolOn){
    if(mpatrolOn)toggleMachinePatrol();
    if(btn)btn.classList.add('on');
    patrolStartMs=Date.now();   // 실제 경과시간 기준(프레임레이트 무관)
    setupPatrolRange();
    applyPatrolFrame(patrolCzStart);
  }else{
    if(btn)btn.classList.remove('on');
    buildScene();   // 순회 중 보류된 가동상태 갱신 반영
  }
}
function updatePatrol(dt){
  if(!patrolOn)return;
  // 프레임 누적(dt) 대신 실제 경과시간 기준 → 저사양/저프레임 PC에서도 동 전환 보장
  var t=(Date.now()-patrolStartMs)/1000/PATROL_ZONE_SEC;
  if(t>=1){
    var ids=ZONES.map(function(z){return z.id});
    var i=ids.indexOf(curZone);
    curZone=ids[(i+1)%ids.length];
    buildTabs(); buildScene();
    setupPatrolRange();
    patrolStartMs=Date.now();
    applyPatrolFrame(patrolCzStart);
    return;
  }
  var cz=patrolCzStart + (patrolCzEnd-patrolCzStart)*t;
  applyPatrolFrame(cz);
}

var MP_ARRIVE=3.0;                          // 도착 후 팝업까지 대기
var MP_POPUP_WAIT=3.0;                       // 팝업 뜬 뒤 슬라이딩 시작까지 대기
var MP_SLIDE=3.0;                            // 내용 슬라이딩 시간
var MP_END_WAIT=3.0;                         // 슬라이딩 완료 후 다음까지 대기
var MP_HOLD=MP_POPUP_WAIT+MP_SLIDE+MP_END_WAIT;
var mpFrom=null, mpTo=null;
function buildMachinePatrolList(){
  var z=ZONES.filter(function(zz){return zz.id===curZone})[0];
  var regd=z.equip.filter(function(e){ return machineViewOf(e.no); });
  mpList = regd.length? regd : z.equip.slice();
}
// buildScene과 동일한 설비 중심 좌표를 ZONES에서 직접 계산 (mesh 재생성과 무관 → 순회 좌표 안정)
/* ============ 엔지니어(정비) — 동별 인원 순회 + 수리중 설비 배치 ============ */
function loadEngCount(){ try{return JSON.parse(localStorage.getItem('twin_eng')||'{}')}catch(e){return{}} }
function saveEngCount(){ try{localStorage.setItem('twin_eng',JSON.stringify(ENG))}catch(e){} }
var ENG=loadEngCount(), engineers=[];
var REPAIR_SUF=['A002','M008','A001','A004','M004'];   // 설비이상·금형수리·금형교환·부품교체·부품연마
function isMeasWait(d){
  if(!d)return false;
  var c=d.machine_status; if(!c||c==='N')return false;
  var s=String(c).indexOf('-')>=0?String(c).split('-')[1]:String(c);
  return s==='Z004';   // 측정대기
}
function isRepair(d){
  if(!d)return false;
  var c=d.machine_status;
  if(!c||c==='N')return false;
  var suf=String(c).indexOf('-')>=0?String(c).split('-')[1]:String(c);
  return REPAIR_SUF.indexOf(suf)>=0;
}
function makeEngineer(){
  var g=new THREE.Group();
  var bm=new THREE.MeshStandardMaterial({color:0x2a6fdb,roughness:0.6});
  var body=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.2,0.55,10),bm);
  body.position.y=0.45; g.add(body);
  var head=new THREE.Mesh(new THREE.SphereGeometry(0.15,12,10),new THREE.MeshStandardMaterial({color:0xffcf6b}));
  head.position.y=0.86; g.add(head);
  var helmet=new THREE.Mesh(new THREE.SphereGeometry(0.16,12,8,0,Math.PI*2,0,Math.PI*0.55),new THREE.MeshStandardMaterial({color:0xf5a623,roughness:0.4}));
  helmet.position.y=0.88; g.add(helmet);
  g.userData.bodyMat=bm;
  return g;
}
var engPersist={};
function saveEngState(){
  if(engineers.length) engPersist[curZone]=engineers.map(function(e){return {x:e.grp.position.x,z:e.grp.position.z,wpIdx:e.wpIdx,wait:e.wait}});
}
function repairXZ(e){
  var p=machineXZ(e), m=pxToM(e);
  return {x:p.x + m.w/2 + 0.5, z:p.z};   // 소재(코일)쪽 = 설비 오른쪽 옆
}
function rebuildEngineers(){
  saveEngState();                         // 재생성 전 현재 위치/순회진행 백업
  engineers=[];
  var n=ENG[curZone]||0;
  if(n<=0)return;
  var zone=ZONES.filter(function(z){return z.id===curZone})[0];
  if(!zone||!zone.equip.length)return;
  var pts=zone.equip.map(function(e){return machineXZ(e)});
  var saved=engPersist[curZone]||[];
  var span=Math.max(1,Math.floor(pts.length/n));   // 인원을 설비에 균등 분산
  for(var i=0;i<n;i++){
    var g=makeEngineer();
    var s=saved[i], px, pz, wp;
    if(s){ px=s.x; pz=s.z; wp=s.wpIdx%pts.length; }   // 이전 상태 복원(순회 지속)
    else { wp=(i*span)%pts.length; px=pts[wp].x; pz=pts[wp].z; wp=(wp+1)%pts.length; }
    g.position.set(px,0,pz);
    machineGroup.add(g);
    engineers.push({grp:g,wpIdx:wp,mode:'patrol',wait:s?s.wait:0});
  }
}
function updateEngineers(dt){
  if(!engineers.length)return;
  var zone=ZONES.filter(function(z){return z.id===curZone})[0];
  if(!zone)return;
  var pts=zone.equip.map(function(e){return machineXZ(e)});
  var reps=[];
  zone.equip.forEach(function(e){ if(isRepair(byHo[e.no])) reps.push(repairXZ(e)); });
  var SPEED=2.0;
  for(var i=0;i<engineers.length;i++){
    var e=engineers[i], tx, tz, repair=false;
    if(i<reps.length){ tx=reps[i].x; tz=reps[i].z; repair=true; }
    else { var wp=pts[e.wpIdx%pts.length]; tx=wp.x; tz=wp.z; }
    var want=repair?'repair':'patrol';
    if(e.mode!==want){ e.mode=want; if(e.grp.userData.bodyMat)e.grp.userData.bodyMat.color.set(repair?0xef4444:0x2a6fdb); }
    var dx=tx-e.grp.position.x, dz=tz-e.grp.position.z;
    var dist=Math.sqrt(dx*dx+dz*dz);
    if(dist>0.18){
      var step=Math.min(dist,SPEED*dt);
      e.grp.position.x+=dx/dist*step; e.grp.position.z+=dz/dist*step;
      e.grp.rotation.y=Math.atan2(dx,dz);
    } else if(!repair){
      e.wait+=dt;
      if(e.wait>1.5){ e.wait=0; e.wpIdx=(e.wpIdx+1)%pts.length; }
    }
  }
}
function machineXZ(e){
  var zone=ZONES.filter(function(z){return z.id===curZone})[0];
  if(!zone) return {x:0,z:0};
  var items=zone.equip.map(function(ee){var m=pxToM(ee);return {e:ee,mx:m.x,my:m.y,mw:m.w,mh:m.h}});
  var maxX=0,maxY=0; items.forEach(function(it){maxX=Math.max(maxX,it.mx+it.mw);maxY=Math.max(maxY,it.my+it.mh)});
  var cx=maxX/2, cy=maxY/2;
  var me=items.filter(function(it){return it.e===e})[0];
  if(!me) return {x:0,z:0};
  return {x:(me.mx+me.mw/2)-cx, z:(me.my+me.mh/2)-cy};
}
function viewToPT(e){
  var v=machineViewOf(e.no);
  if(v&&v.px!=null) return {px:v.px,py:v.py,pz:v.pz,tx:v.tx,ty:v.ty,tz:v.tz};
  if(v) return {px:v.x,py:v.up,pz:v.cz-v.back,tx:v.x,ty:0,tz:v.cz};
  // 폴백: ZONES 좌표로 계산(mesh 의존 제거)
  var xz=machineXZ(e);
  return {px:xz.x, py:14, pz:xz.z+10, tx:xz.x, ty:1, tz:xz.z};
}
function mpStartSweep(e){
  mpTo=viewToPT(e);
  // 시작점: 목표를 우측(+x)으로 오프셋 → 우에서 좌로 들어옴
  mpFrom={px:mpTo.px+MP_SWEEP_OFFSET, py:mpTo.py, pz:mpTo.pz,
          tx:mpTo.tx+MP_SWEEP_OFFSET, ty:mpTo.ty, tz:mpTo.tz};
  mpPhase='sweep'; mpTimer=0;
  applyPT(mpFrom);
}
function applyPT(p){
  if(!camera)return;
  camera.position.set(p.px,p.py,p.pz);
  camTarget.set(p.tx,p.ty,p.tz);
  syncOrbitFromCamera();
  camera.lookAt(camTarget);
}
function lerpPT(a,b,t){
  return {px:a.px+(b.px-a.px)*t, py:a.py+(b.py-a.py)*t, pz:a.pz+(b.pz-a.pz)*t,
          tx:a.tx+(b.tx-a.tx)*t, ty:a.ty+(b.ty-a.ty)*t, tz:a.tz+(b.tz-a.tz)*t};
}
function mpOpenPopup(e){
  var ho=parseInt(e.no,10), d=byHo[ho]||null;
  openModal(e,d);
  var mo=document.getElementById('modal');
  if(mo){ mo.classList.remove('rise'); void mo.offsetWidth; mo.classList.add('rise'); }
}
function toggleMachinePatrol(){
  mpatrolOn=!mpatrolOn;
  var btn=document.getElementById('mpatrolBtn');
  if(mpatrolOn){
    if(patrolOn)togglePatrol();
    if(btn)btn.classList.add('on');
    buildScene();                       // 씬 좌표계 재정합
    loadMachineViews().then(function(){ // 서버 최신 저장뷰 재로드(방금 저장값 반영)
      buildMachinePatrolList();
      mpIdx=0;
      if(mpList.length){ mpStartSweep(mpList[0]); }
    });
  }else{
    if(btn)btn.classList.remove('on');
    var mo=document.getElementById('modal'); if(mo)mo.classList.remove('rise');
    closeModal();
    buildScene();   // 순회 중 보류된 가동상태 갱신 반영
  }
}
function updateMachinePatrol(dt){
  if(!mpatrolOn||!mpList.length)return;
  mpTimer+=dt;
  var e=mpList[mpIdx];
  if(mpPhase==='sweep'){
    var t=Math.min(1,mpTimer/MP_SWEEP);
    var te=1-Math.pow(1-t,3);              // ease-out(빠르게 들어와 부드럽게 정지)
    applyPT(lerpPT(mpFrom,mpTo,te));
    if(t>=1){ mpPhase='arrive'; mpTimer=0; }     // 도착 → 팝업 없이 대기
  } else if(mpPhase==='arrive'){
    // 설비 위치만 보여주며 MP_ARRIVE초 대기 후 팝업 등장
    if(mpTimer>=MP_ARRIVE){
      mpOpenPopup(e);
      var b0=document.querySelector('#modal .ms'); if(b0)b0.scrollTop=0;
      mpPhase='hold'; mpTimer=0;
    }
  } else if(mpPhase==='hold'){
    // 팝업 후 MP_POPUP_WAIT초 대기 → MP_SLIDE초 동안 서서히 아래로 슬라이딩
    var b=document.querySelector('#modal .ms');   // 실제 스크롤 컨테이너
    if(b){
      var max=b.scrollHeight-b.clientHeight;
      if(max>4){
        var p=(mpTimer-MP_POPUP_WAIT)/MP_SLIDE;
        p=Math.max(0,Math.min(1,p));
        b.scrollTop=max*p;
      }
    }
    if(mpTimer>=MP_HOLD){
      var mo=document.getElementById('modal'); if(mo)mo.classList.remove('rise');
      closeModal();
      mpIdx=(mpIdx+1)%mpList.length;
      if(mpIdx===0) buildMachinePatrolList();
      mpStartSweep(mpList[mpIdx]);
    }
  }
}

function updateCam(){
  if(!camTarget||!camera)return;
  var x=camTarget.x + camRadius*Math.sin(camPhi)*Math.cos(camTheta);
  var y=camTarget.y + camRadius*Math.cos(camPhi);
  var z=camTarget.z + camRadius*Math.sin(camPhi)*Math.sin(camTheta);
  camera.position.set(x,y,z);
  camera.lookAt(camTarget);
}

function animate(){
  requestAnimationFrame(animate);
  var now=Date.now()/1000;
  if(!animate._last)animate._last=now;
  var dt=Math.min(0.1, now-animate._last); animate._last=now;
  var t=now;
  if(machineGroup){machineGroup.children.forEach(function(o){
    if(!o.userData)return;
    if(o.userData.billboard&&camera)o.lookAt(camera.position);
    var p=o.userData.press;
    if(p){
      var s=(1-Math.cos(t*p.spd*Math.PI*2+p.phase))/2;  // 0(top)~1(bot)
      o.position.y=p.topY+(p.botY-p.topY)*s;
    }
  })}
  if(patrolOn)updatePatrol(dt);
  if(mpatrolOn)updateMachinePatrol(dt);
  updateEngineers(dt);
  renderer.render(scene,camera);
}

// ===== 자체 궤도 컨트롤 (CAD 정석) =====
// 우클릭 드래그 = 회전 / 휠클릭(중간) 드래그 = 팬(상하좌우) / 휠스크롤 = 줌 / 좌클릭 = 선택
function bindControls(cv){
  var orbiting=false,panning=false,lx=0,ly=0;
  var pinchD=0,pinchMode=false;
  var downX,downY,downT,downBtn;
  cv.addEventListener('mousedown',function(e){
    downX=e.clientX;downY=e.clientY;downT=Date.now();downBtn=e.button;
    lx=e.clientX;ly=e.clientY;
    if(e.button===2){orbiting=true;e.preventDefault();}       // 우클릭 = 회전
    else if(e.button===1){panning=true;e.preventDefault();}    // 휠클릭 = 팬
    // 좌클릭(0)은 선택용 → mouseup에서 판정
  });
  window.addEventListener('mousemove',function(e){
    if(!orbiting&&!panning)return;
    var dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;
    if(orbiting)orbit(dx,dy);else pan(dx,dy);
  });
  window.addEventListener('mouseup',function(e){
    // 좌클릭 짧게 + 거의 안움직임 → 선택(단일)
    if(e.button===0 && downBtn===0 && Date.now()-downT<250 && Math.abs(e.clientX-downX)<5 && Math.abs(e.clientY-downY)<5){
      pick(e.clientX,e.clientY);
    }
    orbiting=false;panning=false;
  });
  cv.addEventListener('contextmenu',function(e){e.preventDefault()}); // 우클릭 메뉴 차단(회전용)
  cv.addEventListener('wheel',function(e){e.preventDefault();zoomBy(e.deltaY>0?1.1:0.9)},{passive:false}); // 휠 = 줌
  // 터치: 1손가락=회전, 2손가락=핀치줌+팬, 짧은탭=선택
  var touchMoved=0;
  cv.addEventListener('touchstart',function(e){
    e.preventDefault();
    if(e.touches.length===1){orbiting=true;lx=e.touches[0].clientX;ly=e.touches[0].clientY;downX=lx;downY=ly;downT=Date.now();touchMoved=0}
    else if(e.touches.length===2){pinchMode=true;orbiting=false;pinchD=touchDist(e);lx=(e.touches[0].clientX+e.touches[1].clientX)/2;ly=(e.touches[0].clientY+e.touches[1].clientY)/2}
  },{passive:false});
  cv.addEventListener('touchmove',function(e){
    e.preventDefault();
    if(pinchMode&&e.touches.length===2){
      var d=touchDist(e);zoomBy(pinchD/d);pinchD=d;
      var mx=(e.touches[0].clientX+e.touches[1].clientX)/2,my=(e.touches[0].clientY+e.touches[1].clientY)/2;
      pan(mx-lx,my-ly);lx=mx;ly=my;
    } else if(orbiting&&e.touches.length===1){
      var dx=e.touches[0].clientX-lx,dy=e.touches[0].clientY-ly;lx=e.touches[0].clientX;ly=e.touches[0].clientY;
      touchMoved+=Math.abs(dx)+Math.abs(dy);
      orbit(dx,dy);
    }
  },{passive:false});
  cv.addEventListener('touchend',function(e){
    if(pinchMode){pinchMode=false}
    else if(orbiting){
      var t=e.changedTouches[0];
      var moved = t ? (Math.abs(t.clientX-downX)+Math.abs(t.clientY-downY)) : touchMoved;
      // 탭(거의 안움직임) → 선택(단일)
      if(touchMoved<14 && moved<14 && Date.now()-downT<400 && t) pick(t.clientX,t.clientY);
    }
    orbiting=false;
  });
}
function touchDist(e){var dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;return Math.hypot(dx,dy)}
function orbit(dx,dy){
  if(patrolOn)togglePatrol();
  camTheta+=dx*0.008; camPhi-=dy*0.008;
  camPhi=Math.max(0.12,Math.min(Math.PI*0.49,camPhi));
  updateCam();
}
function pan(dx,dy){
  if(!camTarget)return;
  var ps=camRadius*0.0016;
  var right=new THREE.Vector3(Math.cos(camTheta+Math.PI/2),0,Math.sin(camTheta+Math.PI/2));
  var fwd=new THREE.Vector3(Math.cos(camTheta),0,Math.sin(camTheta));
  camTarget.addScaledVector(right,dx*ps);
  camTarget.addScaledVector(fwd,-dy*ps);
  updateCam();
}
function zoomBy(f){if(patrolOn)togglePatrol();camRadius=Math.max(6,Math.min(400,camRadius*f));updateCam()}
function resetView(){if(patrolOn)togglePatrol();camTheta=Math.PI*0.5;camPhi=Math.PI*0.32;var z=ZONES.filter(function(zz){return zz.id===curZone})[0];var mx=0,my=0;z.equip.forEach(function(e){var m=pxToM(e);mx=Math.max(mx,m.x+m.w);my=Math.max(my,m.y+m.h)});camTarget.set(0,0,0);camRadius=Math.max(mx,my)*1.15;updateCam()}
function topView(){if(patrolOn)togglePatrol();camPhi=0.13;updateCam()}

function showTapMarker(clientX,clientY){
  var m=document.getElementById('tapMarker');
  if(!m){m=document.createElement('div');m.id='tapMarker';
    m.style.cssText='position:fixed;width:26px;height:26px;border:2px solid #38bdf8;border-radius:50%;margin:-13px 0 0 -13px;z-index:9000;pointer-events:none;box-shadow:0 0 10px #38bdf8;transition:opacity .4s;opacity:1';
    document.body.appendChild(m);}
  m.style.left=clientX+'px'; m.style.top=clientY+'px'; m.style.opacity='1';
  clearTimeout(m._t); m._t=setTimeout(function(){m.style.opacity='0'},450);
}
function pick(clientX,clientY){
  showTapMarker(clientX,clientY);
  var rect=renderer.domElement.getBoundingClientRect();
  mouse.x=((clientX-rect.left)/rect.width)*2-1;
  mouse.y=-((clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(mouse,camera);
  var hits=raycaster.intersectObjects(meshes.map(function(m){return m.mesh}));
  if(hits.length){
    var hit=hits[0].object;
    var rec=meshes.filter(function(m){return m.mesh===hit})[0];
    if(rec){openModal(rec.e,rec.d);return}
  }
  // 폴백: 직접 안 맞으면 화면상 가장 가까운 설비(중심) 선택 — 손가락 오차 보정
  var best=null,bestD=60;  // 60px 이내
  var v=new THREE.Vector3();
  meshes.forEach(function(rec){
    v.copy(rec.mesh.position); v.project(camera);
    var sx=(v.x*0.5+0.5)*rect.width + rect.left;
    var sy=(-v.y*0.5+0.5)*rect.height + rect.top;
    var d=Math.hypot(sx-clientX, sy-clientY);
    if(d<bestD){bestD=d;best=rec}
  });
  if(best) openModal(best.e,best.d);
}

function oeeRow(d){
  var o=calcOEE(d); if(!o) return '';
  function pct(v){return v==null?'-':(v*100).toFixed(0)+'%'}
  var col=oeeColor(o.oee);
  var hex='#'+('000000'+col.toString(16)).slice(-6);
  return '<div class="row" style="flex-direction:column;align-items:stretch">'
    +'<div style="display:flex;justify-content:space-between"><span class="k">OEE (설비종합효율)</span>'
    +'<span class="vv" style="color:'+hex+';font-size:16px">'+pct(o.oee)+'</span></div>'
    +'<div class="prog"><div class="f" style="width:'+Math.min(o.oee*100,100)+'%;background:'+hex+'"></div></div>'
    +'<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-top:4px">'
    +'<span>가동률 '+pct(o.avail)+'</span><span>성능 '+pct(o.perf)+'</span><span>양품률 '+pct(o.qual)+'</span></div>'
    +'</div>';
}
function inspRow(e,meta){
  var ho=parseInt(e.no,10), insp=inspByHo[ho]||{}, is300=(meta.ton||0)>=300;
  function badge(done){return done?'<span style="color:#22c55e;font-weight:700">✓ 완료</span>':'<span style="color:#ef4444;font-weight:700">! 미점검</span>'}
  var h='<div class="row"><span class="k">일상점검</span><span class="vv">'+badge(!!insp.chkDone)+'</span></div>';
  if(is300){
    h+='<div class="row"><span class="k">로드모니터</span><span class="vv">'+badge(!!insp.loadDone)+'</span></div>';
    if(insp.load){
      var L=insp.load;
      function cell(v){return (v==null||v==='')?'-':v}
      function trow(t,lbl){var a=L[t]||[];return '<div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0;color:var(--sub)"><span>'+lbl+'</span><span style="color:var(--txt)">좌 '+cell(a[0])+' · 우 '+cell(a[1])+'</span></div>'}
      h+='<div style="padding:6px 0 2px;border-bottom:1px solid #1e2433">'
        +trow('t0830','8:30')+trow('t1330','13:30')+trow('t1630','16:30')+'</div>';
    }
  }
  return h;
}
function openModal(e,d){
  _lastModalE=e; _lastModalD=d;
  var meta=metaOf(e);var colHex=statusColor(d);
  var faceHex='#'+('000000'+colHex.toString(16)).slice(-6);
  document.getElementById('mBdg').style.background=faceHex;
  document.getElementById('mBn').textContent=e.no;
  document.getElementById('mBt').textContent=(meta.ton||'')+'t';
  document.getElementById('mTitle').textContent=e.no+'호기 · '+(meta.maker||'')+' '+(meta.ton||'')+'톤';

/* ===== 금일 관리포인트 보고서 (동별 미체크 · 로드모니터 편차 · 품질 위험 · 도면) ===== */
function _escQ(s){return String(s==null?'':s).replace(/[\\'"]/g,'')}
function _numSortNo(a,b){return parseInt(a,10)-parseInt(b,10)}
function _chip(text,color){
  return '<span style="display:inline-block;margin:2px 5px 2px 0;padding:3px 9px;border-radius:8px;font-size:12px;font-weight:700;background:'+color+'22;color:'+color+';border:1px solid '+color+'66">'+text+'</span>';
}
// 불량포인트 항목 번호(G열) 배지 — 도면에서 위치 찾기용
function _noTag(g){
  g=(g==null?'':String(g)).trim();
  return g ? '<span style="display:inline-block;min-width:18px;text-align:center;background:#1e3a5f;color:#9cc2ff;border-radius:4px;font-size:10px;font-weight:800;padding:1px 5px;margin-right:5px">'+g+'</span>' : '';
}
// 한 설비의 품질(치수) 위험 카드 — 위험 항목 + 도면 버튼 (위험 없으면 '')
function _qualityBlock(no,d){
  var part=d&&d.current_item_code, mold=d&&d.current_mold;
  var dim=dimOfMachine(d);
  if(!dim||!dim.risk)return '';
  var btn = mold ? '<button onclick="openDrawing(\''+_escQ(mold)+'\')" style="margin-left:auto;padding:3px 9px;font-size:11px;border:1px solid #3a4660;background:#1a2236;color:#9cc2ff;border-radius:6px;cursor:pointer;white-space:nowrap">📐 도면</button>' : '';
  var items=dim.items.filter(function(x){return x.state!=='정상'}).sort(function(a,b){return (b.pct||0)-(a.pct||0)});
  var rows=items.map(function(x){
    var spec=(x.type==='제로근접형')?('≤'+(isNaN(x.hi)?'-':x.hi)):((isNaN(x.lo)?'-':x.lo)+'~'+(isNaN(x.hi)?'-':x.hi));
    var pctTxt=(x.pct!=null)?(' ('+Math.round(x.pct)+'%)'):'';
    return '<div style="display:flex;justify-content:space-between;gap:8px;padding:5px 8px;border-radius:6px;background:rgba(239,68,68,0.12);margin-bottom:3px;font-size:12px">'
      +'<span style="color:#cfd8e3">'+_noTag(x.g)+x.item+'</span>'
      +'<span style="color:#8a93a3">'+spec+'</span>'
      +'<span style="color:#ef4444;font-weight:700">'+x.val.toFixed(3)+'</span>'
      +'<span style="color:#ef4444;min-width:62px;text-align:right">'+x.state+pctTxt+'</span></div>';
  }).join('');
  return '<div style="background:rgba(239,68,68,0.06);border:1px solid rgba(239,68,68,0.3);border-radius:10px;padding:8px 10px;margin:6px 0">'
    +'<div style="display:flex;align-items:center;gap:6px;margin-bottom:5px">'
    +'<span style="font-weight:800;color:#fca5a5">'+no+'호기</span>'
    +'<span style="font-size:12px;color:#8a93a3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(part||'-')+(d&&d.item_name?(' · '+d.item_name):'')+'</span>'+btn+'</div>'

}

var _dwgDrag=null;
function dwgDragStart(ev){
  var t=ev.target;
  if(t && (t.tagName==='BUTTON'||t.tagName==='INPUT'||t.tagName==='LABEL'||(t.closest&&t.closest('button,label,input')))) return; // 닫기/등록/삭제 클릭은 드래그 제외
  var box=document.getElementById('dwgBox'); if(!box)return;
  var p=ev.touches?ev.touches[0]:ev;
  var r=box.getBoundingClientRect();
  _dwgDrag={dx:p.clientX-r.left, dy:p.clientY-r.top};
  document.addEventListener('mousemove',dwgDragMove);
  document.addEventListener('mouseup',dwgDragEnd);
  document.addEventListener('touchmove',dwgDragMove,{passive:false});
  document.addEventListener('touchend',dwgDragEnd);
  if(ev.cancelable)ev.preventDefault();
}
function dwgDragMove(ev){
  if(!_dwgDrag)return;
  var p=ev.touches?ev.touches[0]:ev;
  var box=document.getElementById('dwgBox');
  box.style.left=(p.clientX-_dwgDrag.dx)+'px';
  box.style.top=(p.clientY-_dwgDrag.dy)+'px';
  if(ev.cancelable)ev.preventDefault();
}
function dwgDragEnd(){
  _dwgDrag=null;
  document.removeEventListener('mousemove',dwgDragMove);

};
var ZERO_KEYS=['진원도','평면도','동심도','원통도','직각도','평행도','흔들림','burr','버'];
function isZeroItem(name){ var s=String(name||'').toLowerCase().replace(/\s/g,''); for(var i=0;i<ZERO_KEYS.length;i++){ if(s.indexOf(ZERO_KEYS[i])>=0) return true; } return false; }

async function dimFetchOne(url){
  if(!url) return [];
  try{ var r=await fetch(url+'?action=getData',{redirect:'follow'}); if(!r.ok)return [];
    var d=await r.json(); return (d&&d.success)?(d.data||[]):[]; }catch(e){ return []; }

// 컬럼: 작업일자 c0, 품번 c1, G열 c6, 항목 c7, 규격 c15, 하한 c20, 상한 c21, 평균 c35
async function loadDim(){
  var names=Object.keys(DIM_GAS);
  var arrs=await Promise.all(names.map(function(k){return dimFetchOne(DIM_GAS[k])}));
  dimSrcCount={}; names.forEach(function(k,i){ dimSrcCount[k]=arrs[i].length; });
  var rows=[].concat.apply([],arrs);
  // 품번|G|항목 별로 최신 작업일자의 평균값만
  var grp={};
  rows.forEach(function(row){
    var part=String(row.c1||'').trim(); if(!part)return;
    var item=String(row.c7||'').trim(), g=String(row.c6||'').trim(), spec=String(row.c15||'').trim();
    var lo=parseFloat(row.c20), hi=parseFloat(row.c21), avg=parseFloat(row.c35);
    if(isNaN(avg))return;
    var dk=dimParseDate(row.c0);
    var key=part+'|'+g+'|'+item;
    if(!grp[key]||dk>=grp[key].dk) grp[key]={part:part,item:item,g:g,spec:spec,lo:lo,hi:hi,val:avg,dk:dk};
  });
  // 품번별 위험 판정
  var byPart={};
  Object.keys(grp).forEach(function(k){
    var o=grp[k]; var isZero=isZeroItem(o.item);
    var state='정상', pct=null, type=isZero?'제로근접형':'중심공차형';
    var warnAt=null, margin=null;   // 경고기준값, 한계까지 여유
    if(isZero){
      if(!isNaN(o.hi)){ pct=o.hi>0?(o.val/o.hi*100):100; warnAt=o.hi*DIM_TH; margin=o.hi-o.val;
        if(o.val>=o.hi) state='초과'; else if(o.val>=o.hi*DIM_TH) state='상한임박'; }
    }else{
      if(!isNaN(o.lo)&&!isNaN(o.hi)){ var range=o.hi-o.lo; pct=range>0?((o.val-o.lo)/range*100):50;
        var uTh=o.lo+range*DIM_TH, lTh=o.lo+range*(1-DIM_TH);
        if(o.val>o.hi){ state='초과'; warnAt=o.hi; margin=o.hi-o.val; }
        else if(o.val<o.lo){ state='미달'; warnAt=o.lo; margin=o.val-o.lo; }
        else if(o.val>=uTh){ state='상한임박'; warnAt=uTh; margin=o.hi-o.val; }
        else if(o.val<=lTh){ state='하한임박'; warnAt=lTh; margin=o.val-o.lo; } }
    }
    var risk=(state!=='정상');
    if(!byPart[o.part]) byPart[o.part]={risk:false,items:[],lastDate:''};
    byPart[o.part].items.push({item:o.item,g:o.g,spec:o.spec,val:o.val,lo:o.lo,hi:o.hi,
      type:type,state:state,pct:pct,warnAt:warnAt,margin:margin,date:o.dk});
    if(risk) byPart[o.part].risk=true;
    if(o.dk && o.dk>byPart[o.part].lastDate) byPart[o.part].lastDate=o.dk;
  });
  dimByPart=byPart;
}
function dimOf(part){ return part? dimByPart[String(part).trim()]||null : null; }
// ===== 측정품번 매핑 (ERP품번 → 구글시트 B열 부품번호) : Supabase twin_meas_map =====

async function saveMeasPart(code, meas){
  try{
    var resp;
    if(meas){
      resp=await fetch(SB_URL+'/rest/v1/twin_meas_map?on_conflict=item_code',{method:'POST',
        headers:Object.assign({},sbH,{'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=representation'}),
        body:JSON.stringify({item_code:code,meas_part:meas})});
    } else {
      resp=await fetch(SB_URL+'/rest/v1/twin_meas_map?item_code=eq.'+encodeURIComponent(code),{method:'DELETE',
        headers:Object.assign({},sbH,{'Prefer':'return=minimal'})});
    }
    if(!resp.ok){
      var t=''; try{t=await resp.text()}catch(e){}
      alert('서버 저장 실패 ('+resp.status+')\n'+(t||'')+'\n\n※ Supabase에 twin_meas_map 테이블/권한(SQL)이 적용됐는지 확인하세요.\n(PGRST205=테이블없음, 42501/401/403=권한)');
      return;
    }
    // 서버 재확인
    var chk=await sbGet('twin_meas_map','select=meas_part&item_code=eq.'+encodeURIComponent(code)+'&limit=1');
    if(meas){
      if(chk&&chk.length){ measMap[code]=meas; alert('✅ 서버 저장 완료\n'+code+' → '+meas); }
      else { alert('저장 응답은 OK지만 재조회 실패.\n테이블 권한(GRANT/RLS) 또는 키를 확인하세요.'); return; }
    } else {
      delete measMap[code]; alert('🗑 매핑 삭제 완료: '+code);
    }
  }catch(e){ alert('네트워크 오류: '+e); return; }
  if(!(patrolOn||mpatrolOn)) buildScene();
  if(_lastModalE && document.getElementById('modal').classList.contains('show')) openModal(_lastModalE,_lastModalD);
}
// 측정DB 품번이 ERP품번이 아닌 기종명/규격으로 등록된 경우 대비 → 매핑→품번→기종명(품명)→규격 순 폴백
function dimCandidates(d){
  if(!d) return [];
  var code=(d.current_item_code==null?'':String(d.current_item_code)).trim();
  return [measMap[code],d.current_item_code,d.item_name,d.current_model,d.model_name,d.item_spec]
    .map(function(x){return (x==null?'':String(x)).trim()})
    .filter(function(x){return x.length>0});
}
function dimOfMachine(d){
  var cs=dimCandidates(d);
  for(var i=0;i<cs.length;i++){ if(dimByPart[cs[i]]) return dimByPart[cs[i]]; }
  return null;
}

var ED={zone:'B',props:null,machines:[],lines:[],tool:'select',sel:null,
        scale:10,ox:40,oy:40,drag:null,lineDraft:null,

// 현재 구역의 기존(하드코딩 px) 설비를 m로 변환해 시드
function edSeedFromHardcoded(zoneCode){
  var z=ZONES.filter(function(zz){return zz.id===zoneCode})[0];

            w_m:+m.w.toFixed(2), d_m:+m.h.toFixed(2),
            height_m:+tonToHeightM(meta.ton).toFixed(2), rot:0};

function edDefaultProps(zoneCode){
  var z=ZONES.filter(function(zz){return zz.id===zoneCode})[0];
  var w=16,h=55;
  if(z){var mx=0,my=0;z.equip.forEach(function(e){var m=pxToM(e);mx=Math.max(mx,m.x+m.w);my=Math.max(my,m.y+m.h)});w=Math.ceil(mx);h=Math.ceil(my)}

async function edLoadZone(zoneCode){

// ---- 좌표 변환 (m ↔ 화면px) ----
function m2sx(x){return ED.ox + x*ED.scale}
function m2sy(y){return ED.oy + y*ED.scale}
function s2mx(sx){return (sx-ED.ox)/ED.scale}
function s2my(sy){return (sy-ED.oy)/ED.scale}

function edResize(){
  var wrap=document.getElementById('edCanvasWrap');
  edCv.width=wrap.clientWidth; edCv.height=wrap.clientHeight;
}
function edFit(){
  edResize();
  var W=ED.props.size_w_m, H=ED.props.size_h_m;
  var pad=40;
  var sx=(edCv.width-pad*2)/W, sy=(edCv.height-pad*2)/H;
  ED.scale=Math.max(2,Math.min(sx,sy));
  ED.ox=(edCv.width-W*ED.scale)/2;
  ED.oy=(edCv.height-H*ED.scale)/2;
}

function edRender(){
  if(!edCtx)return;
  var c=edCtx,W=ED.props.size_w_m,H=ED.props.size_h_m;
  c.clearRect(0,0,edCv.width,edCv.height);
  // 바닥
  c.fillStyle=ED.props.floor_color||'#10151f';
  c.fillRect(m2sx(0),m2sy(0),W*ED.scale,H*ED.scale);
  // 격자(1m 또는 grid_m)
  var g=ED.props.grid_m||1;
  c.strokeStyle='rgba(90,111,160,0.25)';c.lineWidth=1;c.beginPath();
  for(var x=0;x<=W+0.001;x+=g){c.moveTo(m2sx(x),m2sy(0));c.lineTo(m2sx(x),m2sy(H))}
  for(var y=0;y<=H+0.001;y+=g){c.moveTo(m2sx(0),m2sy(y));c.lineTo(m2sx(W),m2sy(y))}
  c.stroke();
  // 외곽선
  c.strokeStyle=ED.props.outline_color||'#5b6fa0';
  c.lineWidth=Math.max(2,(ED.props.outline_w_m||0.2)*ED.scale);
  c.strokeRect(m2sx(0),m2sy(0),W*ED.scale,H*ED.scale);
  // 라인(벽/통로)
  ED.lines.forEach(function(L,i){
    c.strokeStyle=L.color||'#888';c.lineWidth=Math.max(2,(L.width_m||0.1)*ED.scale);
    c.lineCap='round';c.lineJoin='round';c.beginPath();
    L.pts.forEach(function(p,j){var sx=m2sx(p[0]),sy=m2sy(p[1]);if(j===0)c.moveTo(sx,sy);else c.lineTo(sx,sy)});
    if(L.closed)c.closePath();
    c.stroke();
    if(ED.sel&&ED.sel.type==='line'&&ED.sel.idx===i){
      c.fillStyle='#fbbf24';L.pts.forEach(function(p){c.beginPath();c.arc(m2sx(p[0]),m2sy(p[1]),4,0,7);c.fill()});
    }
  });
  // 라인 작성중
  if(ED.lineDraft&&ED.lineDraft.length){
    c.strokeStyle=ED.lineColor;c.lineWidth=Math.max(2,ED.lineWidth*ED.scale);c.setLineDash([6,4]);c.beginPath();
    ED.lineDraft.forEach(function(p,j){var sx=m2sx(p[0]),sy=m2sy(p[1]);if(j===0)c.moveTo(sx,sy);else c.lineTo(sx,sy)});
    c.stroke();c.setLineDash([]);
    c.fillStyle=ED.lineColor;ED.lineDraft.forEach(function(p){c.beginPath();c.arc(m2sx(p[0]),m2sy(p[1]),3,0,7);c.fill()});
  }
  // 설비
  ED.machines.forEach(function(m,i){
    var meta=mmByHo[m.ho]||{};
    var sx=m2sx(m.x_m),sy=m2sy(m.y_m),sw=m.w_m*ED.scale,sh=m.d_m*ED.scale;
    var d=byHo[m.ho]||null,col=statusColor(d);
    c.save();
    // 회전(중심 기준)
    c.translate(sx+sw/2,sy+sh/2);c.rotate((m.rot||0)*Math.PI/180);
    c.fillStyle='#'+('000000'+col.toString(16)).slice(-6);
    c.fillRect(-sw/2,-sh/2,sw,sh);
    c.strokeStyle=(ED.sel&&ED.sel.type==='machine'&&ED.sel.idx===i)?'#fbbf24':'rgba(0,0,0,0.4)';
    c.lineWidth=(ED.sel&&ED.sel.type==='machine'&&ED.sel.idx===i)?3:1;
    c.strokeRect(-sw/2,-sh/2,sw,sh);
    c.fillStyle='#0b0f17';c.textAlign='center';c.textBaseline='middle';
    c.font='bold '+Math.max(9,Math.min(sh*0.5,16))+'px sans-serif';
    c.fillText(String(m.ho),0,0);
    c.restore();
  });
}

// ---- 캔버스 입력 ----
function edBindCanvas(){
  if(edCv.__bound)return; edCv.__bound=true;
  edCv.addEventListener('mousedown',edDown);
  window.addEventListener('mousemove',edMove);
  window.addEventListener('mouseup',edUp);
  edCv.addEventListener('dblclick',edDbl);
  edCv.addEventListener('wheel',function(e){e.preventDefault();
    var mx=s2mx(e.offsetX),my=s2my(e.offsetY);
    ED.scale*=(e.deltaY>0?0.9:1.1);ED.scale=Math.max(2,Math.min(80,ED.scale));
    ED.ox=e.offsetX-mx*ED.scale;ED.oy=e.offsetY-my*ED.scale;edRender();
  },{passive:false});
  window.addEventListener('resize',function(){if(document.getElementById('editor').classList.contains('show')){edResize();edRender()}});
}
function edEvtPos(e){var r=edCv.getBoundingClientRect();return {sx:e.clientX-r.left,sy:e.clientY-r.top}}
function edHitMachine(mx,my){
  for(var i=ED.machines.length-1;i>=0;i--){var m=ED.machines[i];
    if(mx>=m.x_m&&mx<=m.x_m+m.w_m&&my>=m.y_m&&my<=m.y_m+m.d_m)return i}
  return -1;
}
function edSnap(v){var g=ED.props.grid_m||1;return Math.round(v/g)*g}
function edDown(e){
  var p=edEvtPos(e),mx=s2mx(p.sx),my=s2my(p.sy);
  if(e.button===1||e.button===2){ED.drag={pan:true,sx:p.sx,sy:p.sy,ox:ED.ox,oy:ED.oy};e.preventDefault();return}
  if(ED.tool==='machine'){
    if(!ED._addHo){alert('우측에서 추가할 호기를 먼저 선택하세요');return}
    var meta=mmByHo[ED._addHo]||{};
    ED.machines.push({ho:ED._addHo,x_m:+edSnap(mx).toFixed(2),y_m:+edSnap(my).toFixed(2),
      w_m:1.6,d_m:1.2,height_m:+tonToHeightM(meta.ton).toFixed(2),rot:0});
    ED.sel={type:'machine',idx:ED.machines.length-1};edSetTool('select');edRender();edSide();return;
  }
  if(ED.tool==='line'){
    if(!ED.lineDraft)ED.lineDraft=[];
    ED.lineDraft.push([+edSnap(mx).toFixed(2),+edSnap(my).toFixed(2)]);edRender();return;
  }
  // select
  var hi=edHitMachine(mx,my);
  if(hi>=0){ED.sel={type:'machine',idx:hi};var m=ED.machines[hi];ED.drag={move:true,idx:hi,dx:mx-m.x_m,dy:my-m.y_m};edSide();edRender();return}
  ED.sel=null;edSide();edRender();
}
function edMove(e){
  if(!ED.drag)return;var p=edEvtPos(e),mx=s2mx(p.sx),my=s2my(p.sy);
  if(ED.drag.pan){ED.ox=ED.drag.ox+(p.sx-ED.drag.sx);ED.oy=ED.drag.oy+(p.sy-ED.drag.sy);edRender();return}
  if(ED.drag.move){var m=ED.machines[ED.drag.idx];m.x_m=+edSnap(mx-ED.drag.dx).toFixed(2);m.y_m=+edSnap(my-ED.drag.dy).toFixed(2);edRender();edSide()}
}
function edUp(){ED.drag=null}
function edDbl(){ if(ED.tool==='line'&&ED.lineDraft&&ED.lineDraft.length>=2){
  ED.lines.push({kind:ED.lineKind,pts:ED.lineDraft.slice(),color:ED.lineColor,width_m:ED.lineWidth,closed:false});
  ED.lineDraft=null;ED.sel={type:'line',idx:ED.lines.length-1};edSetTool('select');edRender();edSide();
}}

// ---- 속성 패널 ----
function edSide(){
  var s=document.getElementById('edSide');if(!s)return;
  var h='';
  if(ED.tool==='machine'){
    h+='<h4>설비 추가 — 호기 선택</h4><div class="ed-palette">';
    masterList.forEach(function(m){h+='<div class="ed-chip" onclick="edPickHo('+m.ho+')" style="'+(ED._addHo===m.ho?'background:var(--blue);color:#fff':'')+'">'+m.ho+'<br><span style="font-size:9px;opacity:.7">'+(m.ton||'')+'t</span></div>'});
    h+='</div><div class="ed-hint">호기 선택 후 바닥을 클릭해 배치. 격자에 스냅됩니다.</div>';
  } else if(ED.tool==='line'){
    h+='<h4>라인 그리기</h4>';
    h+='<div class="ed-fld"><label>종류</label><select onchange="ED.lineKind=this.value">'
      +'<option value="wall"'+(ED.lineKind==='wall'?' selected':'')+'>벽</option>'
      +'<option value="aisle"'+(ED.lineKind==='aisle'?' selected':'')+'>통로</option>'
      +'<option value="zone"'+(ED.lineKind==='zone'?' selected':'')+'>구역선</option></select></div>';
    h+='<div class="ed-fld"><label>색상</label><input type="color" value="'+ED.lineColor+'" oninput="ED.lineColor=this.value;edRender()"></div>';
    h+='<div class="ed-fld"><label>굵기(m)</label><input type="number" step="0.05" value="'+ED.lineWidth+'" oninput="ED.lineWidth=parseFloat(this.value)||0.1;edRender()"></div>';
    h+='<div class="ed-hint">바닥을 클릭해 점을 찍고, <b>더블클릭</b>으로 라인 완성.</div>';
  } else if(ED.sel&&ED.sel.type==='machine'){
    var m=ED.machines[ED.sel.idx],meta=mmByHo[m.ho]||{};
    h+='<h4>설비 '+m.ho+'호기 ('+(meta.ton||'')+'t)</h4>';
    h+=edNum('X(m)','x_m',m.x_m)+edNum('Y(m)','y_m',m.y_m)+edNum('가로(m)','w_m',m.w_m)+edNum('세로(m)','d_m',m.d_m)+edNum('높이(m)','height_m',m.height_m)+edNum('회전(°)','rot',m.rot);
    h+='<button class="ed-del" onclick="edDelMachine()">🗑 이 설비 삭제</button>';
  } else if(ED.sel&&ED.sel.type==='line'){
    var L=ED.lines[ED.sel.idx];
    h+='<h4>라인 ('+L.kind+')</h4>';
    h+='<div class="ed-fld"><label>색상</label><input type="color" value="'+L.color+'" oninput="ED.lines['+ED.sel.idx+'].color=this.value;edRender()"></div>';
    h+='<div class="ed-fld"><label>굵기(m)</label><input type="number" step="0.05" value="'+L.width_m+'" oninput="ED.lines['+ED.sel.idx+'].width_m=parseFloat(this.value)||0.1;edRender()"></div>';
    h+='<button class="ed-del" onclick="edDelLine()">🗑 이 라인 삭제</button>';
  } else {
    h+='<h4>구역 설정</h4>';
    h+='<div class="ed-fld"><label>이름</label><input type="text" value="'+(ED.props.zone_name||'')+'" oninput="ED.props.zone_name=this.value"></div>';
    h+=edNumZ('가로(m)','size_w_m',ED.props.size_w_m)+edNumZ('세로(m)','size_h_m',ED.props.size_h_m)+edNumZ('격자(m)','grid_m',ED.props.grid_m);
    h+='<div class="ed-fld"><label>바닥색</label><input type="color" value="'+(ED.props.floor_color||'#10151f')+'" oninput="ED.props.floor_color=this.value;edRender()"></div>';
    h+='<div class="ed-fld"><label>외곽선색</label><input type="color" value="'+(ED.props.outline_color||'#5b6fa0')+'" oninput="ED.props.outline_color=this.value;edRender()"></div>';
    h+=edNumZ('외곽두께(m)','outline_w_m',ED.props.outline_w_m);
    h+='<div class="ed-hint">설비를 클릭하면 위치·크기·회전을 편집합니다.<br>＋설비/／라인 도구로 추가하세요.</div>';
  }
  s.innerHTML=h;
}
function edNum(lb,key,val){return '<div class="ed-fld"><label>'+lb+'</label><input type="number" step="0.1" value="'+val+'" oninput="edSetMachine(\''+key+'\',this.value)"></div>'}
function edNumZ(lb,key,val){return '<div class="ed-fld"><label>'+lb+'</label><input type="number" step="0.1" value="'+val+'" oninput="ED.props[\''+key+'\']=parseFloat(this.value)||0;edFit&&edRender()"></div>'}
function edPickHo(ho){ED._addHo=ho;edSide()}
function edSetMachine(key,val){if(!ED.sel||ED.sel.type!=='machine')return;ED.machines[ED.sel.idx][key]=parseFloat(val)||0;edRender()}
function edDelMachine(){if(ED.sel&&ED.sel.type==='machine'){ED.machines.splice(ED.sel.idx,1);ED.sel=null;edRender();edSide()}}
function edDelLine(){if(ED.sel&&ED.sel.type==='line'){ED.lines.splice(ED.sel.idx,1);ED.sel=null;edRender();edSide()}}

// ---- 저장 ----
async function edSave(){
  var zc=ED.zone;
  try{
    await sbUpsertZone({zone_code:zc,zone_name:ED.props.zone_name||zc,
      size_w_m:ED.props.size_w_m,size_h_m:ED.props.size_h_m,grid_m:ED.props.grid_m||1,
      floor_color:ED.props.floor_color,outline_color:ED.props.outline_color,outline_w_m:ED.props.outline_w_m});
    await sbDelete('twin_machine','zone_code=eq.'+encodeURIComponent(zc));
    if(ED.machines.length){
      await sbPost('twin_machine',ED.machines.map(function(m){return {zone_code:zc,ho_code:String(m.ho),x_m:m.x_m,y_m:m.y_m,w_m:m.w_m,d_m:m.d_m,height_m:m.height_m,rot:m.rot||0}}));
    }
    await sbDelete('twin_line','zone_code=eq.'+encodeURIComponent(zc));
    if(ED.lines.length){
      await sbPost('twin_line',ED.lines.map(function(L){return {zone_code:zc,kind:L.kind,pts:L.pts,color:L.color,width_m:L.width_m,closed:!!L.closed}}));
    }
    alert('💾 저장 완료: '+zc+' (설비 '+ED.machines.length+' · 라인 '+ED.lines.length+')');
  }catch(e){alert('❌ 저장 오류: '+e.message)}
}
</script>
</body>
