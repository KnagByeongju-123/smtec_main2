<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DI 원시 신호 모니터 v1.0</title>
<style>
  :root{
    --bg:#0f1419; --panel:#1a2332; --border:#2a3a52;
    --text:#e8eef7; --muted:#7a8aa0;
    --ok:#22c55e; --ng:#ef4444; --idle:#475569; --accent:#3b82f6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;
    background:var(--bg); color:var(--text);
    min-height:100vh; padding:16px;
  }
  .header{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--panel); border:1px solid var(--border);
    padding:14px 20px; border-radius:10px; margin-bottom:16px;
  }
  .header h1{font-size:20px; font-weight:600}
  .header .meta{display:flex; gap:18px; align-items:center; font-size:13px; color:var(--muted)}
  .header .meta span b{color:var(--text); font-weight:600}
  .status-dot{
    display:inline-block; width:9px; height:9px; border-radius:50%;
    margin-right:6px; background:var(--idle);
  }
  .status-dot.online{background:var(--ok); box-shadow:0 0 8px var(--ok)}
  .status-dot.offline{background:var(--ng)}

  .grid{
    display:grid; grid-template-columns:repeat(4, 1fr);
    gap:14px;
  }
  @media (max-width: 1100px){ .grid{grid-template-columns:repeat(2,1fr)} }
  @media (max-width: 600px){ .grid{grid-template-columns:1fr} }

  .card{
    background:var(--panel); border:1px solid var(--border);
    border-radius:10px; padding:18px;
    transition:border-color .2s, box-shadow .2s;
  }
  .card.has-data{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset }
  .card.recent{ border-color:var(--ok); box-shadow:0 0 12px rgba(34,197,94,.35) }
  .card.empty{ opacity:.55 }

  .card .ch-head{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:14px;
  }
  .card .ch-name{font-size:22px; font-weight:700; letter-spacing:.5px}
  .card .ch-gpio{font-size:11px; color:var(--muted); background:#0c1320; padding:3px 8px; border-radius:5px}

  .count{
    font-size:48px; font-weight:700; line-height:1;
    color:var(--text); margin-bottom:6px;
    font-variant-numeric:tabular-nums;
  }
  .count-label{font-size:11px; color:var(--muted); letter-spacing:.5px; margin-bottom:14px}

  .stats{display:flex; gap:14px; font-size:11px}
  .stat{flex:1; padding:8px 10px; background:#0c1320; border-radius:6px}
  .stat-label{color:var(--muted); margin-bottom:3px}
  .stat-val{color:var(--text); font-weight:600; font-variant-numeric:tabular-nums}

  .footer{
    margin-top:18px; padding:12px 16px;
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    font-size:12px; color:var(--muted); display:flex; justify-content:space-between;
  }
  .footer b{color:var(--text)}
  .blink{animation:blink .8s ease-out}
  @keyframes blink{
    0%{background:rgba(34,197,94,.3)} 100%{background:transparent}
  }
</style>
</head>
<body>

<div class="header">
  <h1>📡 DI 원시 신호 모니터 v1.0</h1>
  <div class="meta">
    <span><span class="status-dot" id="connDot"></span><b id="connText">연결 확인 중</b></span>
    <span>마지막 갱신: <b id="lastUpdate">-</b></span>
    <span>전체 누적: <b id="totalCount">0</b></span>
  </div>
</div>

<div class="grid" id="grid"></div>

<div class="footer">
  <span>Supabase: <b>shot_count</b> 테이블 · 폴링 주기 <b>2초</b> · machine_code = <b>DI1 ~ DI8</b></span>
  <span>나중에 호기 매핑 예정</span>
</div>

<script>
  // ===== 설정 =====
  const SUPABASE_URL = 'https://omngtyewdaqpphnzeate.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_9j2YkkL-7ul1TrhH-NjVdQ_vWDG2-1D';
  const TABLE = 'shot_count';
  const POLL_MS = 2000;
  const RECENT_THRESHOLD_MS = 10000;   // 10초 이내 신호 들어온 채널 = 활성 표시

  const DI_LIST = ['DI1','DI2','DI3','DI4','DI5','DI6','DI7','DI8'];

  // ===== UI 생성 =====
  const grid = document.getElementById('grid');
  const cards = {};
  DI_LIST.forEach((di, idx) => {
    const gpio = 4 + idx;   // DI1=GPIO4, DI2=5, ... DI8=GPIO11
    const card = document.createElement('div');
    card.className = 'card empty';
    card.id = `card-${di}`;
    card.innerHTML = `
      <div class="ch-head">
        <div class="ch-name">${di}</div>
        <div class="ch-gpio">GPIO${gpio}</div>
      </div>
      <div class="count" id="cnt-${di}">0</div>
      <div class="count-label">누적 SHOT</div>
      <div class="stats">
        <div class="stat">
          <div class="stat-label">마지막 신호</div>
          <div class="stat-val" id="last-${di}">-</div>
        </div>
        <div class="stat">
          <div class="stat-label">간격(ms)</div>
          <div class="stat-val" id="ivl-${di}">-</div>
        </div>
      </div>
    `;
    grid.appendChild(card);
    cards[di] = {
      card,
      cnt: card.querySelector(`#cnt-${di}`),
      last: card.querySelector(`#last-${di}`),
      ivl: card.querySelector(`#ivl-${di}`),
      prevCount: 0
    };
  });

  // ===== KST 시각 포맷 =====
  function fmtKST(iso){
    if(!iso) return '-';
    const d = new Date(iso);
    const pad = n => String(n).padStart(2,'0');
    return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }
  function nowKST(){
    const d = new Date();
    const pad = n => String(n).padStart(2,'0');
    return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }

  // ===== Supabase 조회 (각 DI별 최신 1건) =====
  // 효율: machine_code IN (DI1..DI8) 한 번 + 클라이언트에서 채널별 최신 추출
  // shot_count는 시간순 누적이므로 created_at 기준 desc 정렬, 충분히 많이 받아서 처리
  async function fetchLatest(){
    const url = `${SUPABASE_URL}/rest/v1/${TABLE}` +
                `?machine_code=in.(${DI_LIST.join(',')})` +
                `&order=created_at.desc&limit=200`;
    try{
      const res = await fetch(url, {
        headers:{
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + SUPABASE_KEY
        }
      });
      if(!res.ok){
        setConn(false, `HTTP ${res.status}`);
        return null;
      }
      const data = await res.json();
      setConn(true, '연결됨');
      return data;
    }catch(e){
      setConn(false, '연결 실패');
      console.error(e);
      return null;
    }
  }

  function setConn(ok, msg){
    const dot = document.getElementById('connDot');
    const txt = document.getElementById('connText');
    dot.className = 'status-dot ' + (ok ? 'online' : 'offline');
    txt.textContent = msg;
  }

  // ===== 채널별 최신 1건 + 누적합 계산 =====
  function processRows(rows){
    // 1) 채널별 최신 레코드 (shot_count 자체가 누적값)
    const latestByCh = {};
    for(const r of rows){
      if(!latestByCh[r.machine_code]){
        latestByCh[r.machine_code] = r;
      }
    }
    return latestByCh;
  }

  // ===== 카드 갱신 =====
  function renderCards(latestByCh){
    let total = 0;
    const now = Date.now();
    DI_LIST.forEach(di => {
      const rec = latestByCh[di];
      const c = cards[di];
      if(!rec){
        c.card.className = 'card empty';
        c.cnt.textContent = '0';
        c.last.textContent = '-';
        c.ivl.textContent = '-';
        return;
      }
      const cnt = rec.shot_count || 0;
      total += cnt;

      // 카운트 증가했으면 깜빡임 효과
      if(cnt > c.prevCount && c.prevCount > 0){
        c.cnt.classList.remove('blink');
        void c.cnt.offsetWidth;   // reflow
        c.cnt.classList.add('blink');
      }
      c.prevCount = cnt;
      c.cnt.textContent = cnt.toLocaleString();
      c.last.textContent = fmtKST(rec.created_at);
      c.ivl.textContent = (rec.shot_interval_ms || 0).toLocaleString();

      // 최근성 판단
      const recordTime = new Date(rec.created_at).getTime();
      const ageMs = now - recordTime;
      if(ageMs < RECENT_THRESHOLD_MS){
        c.card.className = 'card recent';
      } else {
        c.card.className = 'card has-data';
      }
    });

    document.getElementById('totalCount').textContent = total.toLocaleString();
    document.getElementById('lastUpdate').textContent = nowKST();
  }

  // ===== 메인 폴링 루프 =====
  async function tick(){
    const rows = await fetchLatest();
    if(rows){
      const latestByCh = processRows(rows);
      renderCards(latestByCh);
    }
  }

  // 초기 + 주기 실행
  tick();
  setInterval(tick, POLL_MS);
</script>

</body>
</html>
