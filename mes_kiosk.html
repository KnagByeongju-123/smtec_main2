<!DOCTYPE html>
<html lang="ko">
<head>
<script src="audit.js?v=7"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공정생산실행 키오스크 v0.1</title>
<script src="supabase_config.js"></script>
<script src="material_spec.js?v=9"></script>
<script src="material_qr.js?v=7"></script>
<style>
:root{--bg:#000;--panel:#0b0b0b;--line:#2a2a2a;--yel:#ffe600;--grn:#2bff2b;--red:#ff2b2b;--wht:#fff;--sky:#9cc3ff;--btn:#e9ecf1;--btnTx:#1b1f2a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--wht);font-family:'Malgun Gothic','맑은 고딕',sans-serif;overflow:hidden}
.top{display:flex;align-items:center;justify-content:space-between;height:6vh;padding:0 1.2vw;border-bottom:2px solid var(--line)}
.top .ref{font-size:1.6vh;color:#ccc}
.top .ref b{display:inline-block;background:#fff;color:#000;padding:.2vh .8vw;margin-left:.6vw;font-size:2.4vh}
.top .co{font-size:3.4vh;font-weight:800}
.top .clk{font-size:2.4vh;font-weight:700;color:var(--sky)}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 17vw;height:88vh}
.main{display:grid;grid-template-rows:auto 1fr auto;border-right:2px solid var(--line);min-width:0}
.head{padding:1vh 2vw .4vh;display:flex;align-items:baseline;gap:1.2vw;flex-wrap:wrap}
.head .lb{color:var(--yel);font-size:5.6vh;font-weight:800}
.head .model{color:var(--grn);font-size:6.6vh;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw}
.grid{display:grid;grid-template-columns:1fr 1.15fr;gap:0 2vw;padding:0 2vw;min-height:0}
.kv{display:flex;align-items:baseline;gap:.8vw;white-space:nowrap;overflow:hidden}
.kv .k{color:var(--yel);font-weight:800}
.kv .v{font-weight:800;overflow:hidden;text-overflow:ellipsis}
.kv .v.qr{color:var(--grn)}
.kv .v.mis{color:var(--red)}
.kv .v .tag{font-size:.55em;margin-left:.4vw;padding:0 .4vw;border:1px solid currentColor;border-radius:4px;vertical-align:middle}
.L .kv{font-size:4.4vh;line-height:1.35}
.L .big .k{color:#fff;font-size:5vh}
.L .big .v{font-size:7.2vh;margin-left:auto;font-variant-numeric:tabular-nums}
.L .big.ng .v{color:var(--red)}
.R .kv{font-size:3.6vh;line-height:1.45}
.R .kv .v{color:#fff}
.R .rem .v{color:var(--red)}
.R .use .v{color:#f5b8ff}
.insp{display:flex;gap:.4vw;margin:.4vh 0}
.insp span{display:inline-block;min-width:3.6vw;text-align:center;font-size:3.4vh;font-weight:900;padding:.2vh .4vw;color:#000;background:#555}
.insp .O{background:var(--grn)}.insp .W{background:var(--yel)}.insp .N{background:var(--red);color:#fff}
.sum{border-top:3px solid #ddd;padding:.6vh 1vw 0}
.sum .bar{display:flex;align-items:center;gap:1.5vw;font-size:2.6vh;font-weight:800;padding-bottom:.4vh;border-bottom:3px solid #ddd}
.sum .bar .st{margin-left:auto;background:#bbb;color:#000;padding:.2vh 1.2vw}
.sum .bar .st.run{background:var(--grn)}
.sum .bar .st.stop{background:var(--red);color:#fff}
.sum table{width:100%;border-collapse:collapse;font-size:5.6vh;font-weight:900}
.sum td{padding:.1vh 1vw;border-right:2px solid #ddd;font-variant-numeric:tabular-nums}
.sum td:nth-child(odd){color:var(--yel);text-align:right;width:20%}
.sum td:nth-child(even){text-align:right;width:30%}
.sum td:last-child{border-right:0}
.sum .red{color:var(--red)}
.side{display:flex;flex-direction:column;background:#c9d3e0;padding:.6vh .3vw;gap:.6vh}
.side .mc{background:#000;color:#fff;text-align:center;font-size:2.8vh;font-weight:800;padding:1vh 0}
.side select{font-size:2vh;padding:.4vh;width:100%}
.btns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.5vh .3vw}
.btn{background:var(--btn);border:1px solid #9aa4b4;border-radius:2px;height:8.6vh;display:flex;flex-direction:column;justify-content:center;padding:0 .4vw;cursor:pointer;user-select:none;color:var(--btnTx)}
.btn:active{background:#cfd6e2}
.btn b{font-size:2.3vh;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn small{font-size:1.25vh;color:#333}
.btn.r b{color:#d60000}.btn.b b{color:#0a2a8c}.btn.g b{color:#0a8a2a}.btn.gy b{color:#666}
.bottom{height:6vh;display:flex;align-items:center;justify-content:center;gap:2vw;font-size:3.4vh;color:var(--grn);border-top:2px solid var(--line)}
.bottom.off{color:var(--red)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:9}
.modal.show{display:flex}
.modal .box{background:#fff;color:#111;width:min(640px,90vw);padding:3vh 2vw;border-radius:6px}
.modal h3{font-size:3vh;margin-bottom:1.4vh}
.modal p{font-size:2.2vh;line-height:1.6;white-space:pre-line}
.modal .act{display:flex;gap:1vw;justify-content:flex-end;margin-top:2.4vh}
.modal button{font-size:2.4vh;padding:1vh 2vw;border:0;border-radius:4px;cursor:pointer;background:#ddd}
.modal button.pri{background:#0a2a8c;color:#fff}
/* QR 장착 확인창 (키오스크에서 바로 스캔) */
.kq{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;z-index:20}
.kq.show{display:flex}
.kq .kbox{background:#111;border:2px solid #444;color:#fff;width:min(900px,94vw);max-height:94vh;overflow:auto;padding:2.6vh 2.4vw;border-radius:10px}
.kq h3{font-size:3.4vh;margin-bottom:1.2vh;color:var(--yel)}
.kq .kmc{font-size:4.2vh;font-weight:900;color:var(--grn)}
.kq .kheat{font-size:5.4vh;font-weight:900;margin:.6vh 0;word-break:break-all}
.kq .kspec{font-size:2.6vh;color:#bbb;line-height:1.55;margin-bottom:1.4vh}
.kq .kload{font-size:3vh;color:var(--sky);padding:3vh 0;text-align:center}
.kq .kerr{font-size:3vh;font-weight:800;color:#fff;background:#b91c1c;border-radius:8px;padding:2vh 1.6vw;line-height:1.55;white-space:pre-line}
.kq .kok{font-size:4vh;font-weight:900;color:var(--grn);text-align:center;padding:2.4vh 0;line-height:1.5}
.kq .mq-mis{font-size:3vh;font-weight:900;color:#fff;background:#b91c1c;border-radius:8px;padding:1.6vh 1.4vw;margin-bottom:1vh;line-height:1.5}
.kq .mq-job{font-size:2.5vh;color:#ccc;background:#000;border:1px solid #333;border-radius:8px;padding:1.2vh 1.2vw;margin-bottom:1vh;line-height:1.55}
.kq .mq-job b{color:#fff}
.kq .mq-job.ok b{color:var(--grn)}
.kq .mq-warn,.kq .kwarn{font-size:2.5vh;color:#fbbf24;background:rgba(245,158,11,.12);border-left:5px solid #f59e0b;border-radius:6px;padding:1.2vh 1.2vw;margin-bottom:1vh;line-height:1.5}
.kq .kacts{display:flex;gap:1vw;margin-top:2vh;flex-wrap:wrap}
.kq .kacts button{flex:1;min-width:22%;font-size:3vh;font-weight:900;padding:2.2vh 1vw;border-radius:8px;border:2px solid #555;background:#222;color:#fff;cursor:pointer;font-family:inherit}
.kq .kacts button.pri{background:#16a34a;border-color:#16a34a}
.kq .kacts button.danger{background:#dc2626;border-color:#dc2626;font-size:2.6vh}
</style>
</head>
<body>
<div class="top">
  <div class="ref">새로고침시간 <b id="refSec">5</b></div>
  <div class="co">㈜태진다이텍</div>
  <div class="clk" id="clk">-</div>
</div>

<div class="wrap">
  <div class="main">
    <div class="head"><span class="lb">생산모델</span><span class="model" id="model">-</span></div>
    <div class="grid">
      <div class="L">
        <div class="kv"><span class="k">품번</span><span class="v" id="pn">-</span></div>
        <div class="kv"><span class="k">고객</span><span class="v" id="spec">-</span></div>
        <div class="kv big"><span class="k">생산계획</span><span class="v" id="plan">-</span></div>
        <div class="kv big"><span class="k">실적수량</span><span class="v" id="act">-</span></div>
        <div class="kv big ng"><span class="k">불량수량</span><span class="v" id="ng">-</span></div>
      </div>
      <div class="R">
        <div class="kv"><span class="k">지시번호</span><span class="v" id="wo">-</span></div>
        <div class="kv"><span class="k">금형</span><span class="v" id="mold">-</span></div>
        <div class="insp" id="insp"></div>
        <div class="kv"><span class="k">소재로트</span><span class="v" id="lot">-</span></div>
        <div class="kv"><span class="k">장착중량</span><span class="v" id="coil">-</span></div>
        <div class="kv rem"><span class="k">잔여중량</span><span class="v" id="remw">-</span></div>
        <div class="kv"><span class="k">단위소요(g)</span><span class="v" id="unit">-</span></div>
        <div class="kv"><span class="k">타발수</span><span class="v" id="shot">-</span></div>
        <div class="kv use"><span class="k">잔여 생산가능</span><span class="v" id="canMake">-</span></div>
      </div>
    </div>
    <div class="sum">
      <div class="bar"><span>작업지시 생산 현황</span><span id="custTag" style="color:#aaa"></span><span>투입인원 <span id="worker" style="color:var(--yel)">-</span></span><span class="st" id="st">-</span></div>
      <table>
        <tr><td>목표 UPH</td><td id="tUph">-</td><td>실적 C/T</td><td id="aCt">-</td></tr>
        <tr><td>계 획</td><td id="plan2">-</td><td>진척률</td><td id="prog">-</td></tr>
        <tr><td>실 적</td><td id="act2" class="red">-</td><td>잔여시간</td><td id="remMin">-</td></tr>
      </table>
    </div>
  </div>

  <div class="side">
    <div class="mc" id="mcName">-</div>
    <select id="mcSel" aria-label="설비 선택"></select>
    <div class="btns">
      <div class="btn r" data-act="stop"><b>STOP</b><small>Idle Work</small></div>
      <div class="btn b" data-act="line"><b>LINE</b><small>Line Change</small></div>
      <div class="btn gy" data-act="retrieve"><b>Retrieve</b><small>조회</small></div>
      <div class="btn r" data-act="wo"><b>W/O</b><small>작업지시서</small></div>
      <div class="btn r" data-act="defect"><b>Defect</b><small>불량입력</small></div>
      <div class="btn g" data-act="complete"><b>Complete</b><small>작업완료</small></div>
      <div class="btn gy" data-act="call"><b>Call</b><small>관리자호출</small></div>
      <div class="btn" data-act="worker"><b>Worker</b><small>작업자</small></div>
      <div class="btn gy" data-act="doc"><b>Work.Doc</b><small>작업표준</small></div>
      <div class="btn b" data-act="time"><b>Time</b><small>초/중/종물</small></div>
      <div class="btn" data-act="material"><b>원소재</b><small>QR 스캔 장착</small></div>
      <div class="btn gy" data-act="full"><b>Full</b><small>전체화면</small></div>
    </div>
  </div>
</div>

<div class="bottom" id="bottom">연결 중…</div>

<div class="modal" id="modal"><div class="box"><h3 id="mT"></h3><p id="mB"></p><div class="act" id="mA"></div></div></div>
<div class="kq" id="kq"><div class="kbox"><h3 id="kqT"></h3><div id="kqB"></div><div class="kacts" id="kqA"></div></div></div>

<script>
// 공정생산실행 키오스크 v0.1 — PIMMES 16번 화면 대체 시제품
//  표시: machine_status (설비별 현재 작업) 5초마다 갱신
//  동작: 관리자 호출(ntfy taejincall), 불량입력·소재장착·작업표준은 기존 앱으로 연결
//  소재로트: material_attach.html 에서 QR로 장착한 소재가 있으면 우선 표시 (PIMMES 로트와 다르면 빨간색)
//  실적·작업완료·비가동 등 기록을 바꾸는 기능은 2단계에서 구현
//  ?mc=024 로 설비 고정 (선택값은 이 단말에 기억)
const REFRESH = 5;
const NTFY_TOPIC = 'taejincall';
const LS_KEY = 'KIOSK_MC';
const fmt = (x, d = 0) => (x == null || x === '' || isNaN(+x)) ? '-' : (+x).toLocaleString('ko-KR', { minimumFractionDigits: d, maximumFractionDigits: d });
const $ = (id) => document.getElementById(id);

let rows = [], cur = null, lastOk = null;
let att = null;   // 이 호기에 QR/터치로 장착된 소재 (material_attachment, status=attached)
let master = null, masterAt = 0;   // 소재 마스터 (작업 규격 비교용, 5분마다 갱신)
let specWarn = '';                 // 규격 불일치 하단 경고 문구
let mc = new URLSearchParams(location.search).get('mc') || (() => { try { return localStorage.getItem(LS_KEY); } catch (_) { return null; } })();

function tick() {
  const n = new Date(), p = (v) => String(v).padStart(2, '0');
  $('clk').textContent = `${n.getFullYear()}/${p(n.getMonth() + 1)}/${p(n.getDate())} ${p(n.getHours())}:${p(n.getMinutes())}:${p(n.getSeconds())}` + (cur ? ` (${cur.machine_name || cur.machine_code})` : '');
}

function specOf(r) {
  // 고객사 (규격·원소재 코드는 2단계에서 품목 기준정보 연결 후 표시)
  return r.customer || '-';
}

function render() {
  const r = cur;
  if (!r) return;
  $('mcName').textContent = (r.machine_name || r.machine_code).replace(/_(\d+)$/, '호기($1톤)');
  $('model').textContent = r.item_name || r.current_item_code || '-';
  $('pn').textContent = r.current_item_code || '-';
  $('spec').textContent = specOf(r);
  $('plan').textContent = fmt(r.target_qty);
  $('act').textContent = fmt(r.actual_qty);
  $('ng').textContent = fmt(r.ng_qty);
  $('wo').textContent = r.current_wo || '-';
  $('mold').textContent = r.current_mold || '-';
  const lab = { O: '완료', W: '대기', N: '미실시' };
  $('insp').innerHTML = [['초', r.inspect_top], ['중', r.inspect_mid], ['종', r.inspect_bottom]]
    .map(([k, v]) => `<span class="${v || ''}" title="${lab[v] || '해당없음'}">${k}</span>`).join('');
  renderLot(r);
  $('coil').textContent = r.coil_weight ? fmt(r.coil_weight, 1) + ' kg' : '-';
  $('remw').textContent = r.remain_weight != null ? fmt(r.remain_weight, 1) + ' kg' : '-';
  $('unit').textContent = fmt(r.unit_per_qty, 2);
  $('shot').textContent = fmt(r.shot_qty);
  $('canMake').textContent = (r.remain_weight && r.unit_per_qty) ? fmt(r.remain_weight * 1000 / r.unit_per_qty) + ' EA' : '-';
  $('worker').textContent = (r.worker || '-').trim();
  $('custTag').textContent = r.customer ? `[${r.customer}]` : '';
  const run = r.machine_status === 'N' || r.is_producing === true;
  const st = $('st');
  st.textContent = r.machine_status === 'M' ? '비가동' : run ? '가동' : '정지';
  st.className = 'st ' + (run ? 'run' : 'stop');
  $('tUph').textContent = r.target_ct ? fmt(3600 / r.target_ct, 1) : '-';
  $('aCt').textContent = r.actual_ct ? fmt(r.actual_ct, 1) + ' s' : '-';
  $('plan2').textContent = fmt(r.target_qty);
  $('act2').textContent = fmt(r.actual_qty);
  $('prog').textContent = r.target_qty ? fmt(r.actual_qty / r.target_qty * 100) + ' %' : '-';
  $('remMin').textContent = r.remaining_minutes != null ? fmt(r.remaining_minutes) + ' 분' : '-';
}

// 소재로트: 장착 화면(QR) 기록을 우선 표시하고, PIMMES 로트와 HEAT가 다르면 경고
function renderLot(r) {
  const el = $('lot');
  const pim = String(r.lot_no || r.heat_no || '').trim();
  specWarn = '';
  if (!att) { el.className = 'v'; el.textContent = pim || '-'; el.title = 'PIMMES 로트'; return; }
  const heat = String(att.heat_no || '').trim();
  const match = !pim || pim === '*' || pim.toUpperCase().startsWith(heat.toUpperCase());
  // 오투입 방지: 장착 코일 규격 vs 현재 작업(금형·품번) 규격
  const job = master ? MatSpec.findJobSpecs(r, master) : null;
  const chk = MatSpec.checkSpec(att, job);
  const specBad = chk.status === 'mismatch';
  el.className = 'v ' + (specBad || !match ? 'mis' : 'qr');
  el.innerHTML = '';
  el.append(document.createTextNode(heat || '-'));
  const tag = document.createElement('span');
  tag.className = 'tag'; tag.textContent = specBad ? '규격 불일치' : match ? '장착' : 'MES 불일치';
  el.appendChild(tag);
  el.title = `장착 ${MatSpec.specText(att)} · LOT ${att.lot_no || '-'}` + (pim ? `\nPIMMES 로트 ${pim}` : '') +
    (chk.spec ? `\n작업 규격 ${MatSpec.specText(chk.spec)} (${job.by})` : '\n작업 규격: 소재마스터 없음') +
    (specBad ? `\n${chk.diffs.join(' / ')}` : '');
  // 규격 불일치는 하단 바에도 크게 경고 (load()에서 표시)
  specWarn = specBad ? `⚠ 소재 규격 불일치 — ${chk.diffs.join(' / ')} · 장착 소재를 확인하세요` : '';
}

// 키오스크 설비명(예: 36_300) → 장착 화면 호기명(예: 36호기 심팩300톤)의 '36호기 ' 접두어
function hoPrefix(r) {
  const ho = parseInt(String(r.machine_name || '').split('_')[0], 10);
  return isNaN(ho) ? null : ho + '호기 ';
}

async function loadAttached() {
  if (!master || Date.now() - masterAt > 5 * 60e3) {
    try {
      master = await sbSelect('material_master_tj', {}, '', 5000);
      masterAt = Date.now();
    } catch (_) { /* 소재 마스터 조회 실패 시 규격 비교 생략 */ }
  }
  const pre = cur && hoPrefix(cur);
  if (!pre) { att = null; return; }
  try {
    const a = await sbSelect('material_attachment', { status: 'eq.attached', machine_code: 'like.' + pre + '*' }, 'attach_time.desc', 1);
    att = a[0] || null;
  } catch (_) { /* 장착 정보 조회 실패 시 PIMMES 로트만 표시 */ }
}

async function load() {
  try {
    rows = await sbSelect('machine_status', {}, 'machine_code.asc', 200);
    rows = rows.filter((r) => !r.is_virtual);
    const sel = $('mcSel');
    if (sel.options.length !== rows.length) {
      sel.innerHTML = rows.map((r) => `<option value="${r.machine_code}">${r.machine_name || r.machine_code}</option>`).join('');
    }
    if (!mc || !rows.some((r) => r.machine_code === mc)) mc = rows[0] && rows[0].machine_code;
    sel.value = mc;
    cur = rows.find((r) => r.machine_code === mc) || null;
    await loadAttached();
    lastOk = new Date();
    render();
    const upd = cur && cur.updated_at ? new Date(cur.updated_at) : null;
    const stale = upd && (Date.now() - upd.getTime()) > 10 * 60e3;
    $('bottom').className = 'bottom' + (stale ? ' off' : '');
    $('bottom').textContent = stale ? `설비 데이터 지연 — 마지막 수신 ${upd.toLocaleTimeString('ko-KR')}` : `In Timer - Processing  ${REFRESH} sec`;
    if (specWarn) { $('bottom').className = 'bottom off'; $('bottom').textContent = specWarn; }
  } catch (e) {
    $('bottom').className = 'bottom off';
    $('bottom').textContent = `연결 끊김 — 마지막 갱신 ${lastOk ? lastOk.toLocaleTimeString('ko-KR') : '없음'} (자동 재시도)`;
  }
}

function modal(title, body, actions) {
  $('mT').textContent = title; $('mB').textContent = body;
  $('mA').innerHTML = '';
  (actions || [{ t: '닫기' }]).forEach((a) => {
    const b = document.createElement('button');
    b.textContent = a.t; if (a.pri) b.className = 'pri';
    b.onclick = async () => { if (a.fn) await a.fn(); $('modal').classList.remove('show'); };
    $('mA').appendChild(b);
  });
  $('modal').classList.add('show');
}

async function callManager() {
  const r = cur || {};
  const title = `[호출] ${r.machine_name || r.machine_code} 관리자 호출`;
  const message = `품번 ${r.current_item_code || '-'} / 지시 ${r.current_wo || '-'}\n작업자 ${(r.worker || '-').trim()}\n실적 ${fmt(r.actual_qty)} / 계획 ${fmt(r.target_qty)}`;
  const res = await fetch('https://ntfy.sh/', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ topic: NTFY_TOPIC, title, message, priority: 4, tags: ['bell'] }),
  });
  setTimeout(() => modal(res.ok ? '호출 완료' : '호출 실패', res.ok ? '관리자에게 알림을 보냈습니다.' : `알림 발송 실패 (${res.status}). 내선으로 연락해 주세요.`), 50);
}

const NEXT = '2단계에서 구현 예정입니다. 지금은 PIMMES 키오스크에서 입력해 주세요.';
const ACTS = {
  stop: () => modal('비가동 (STOP)', '비가동 사유 입력(금형교환·고장·자재대기 등)\n' + NEXT),
  line: () => modal('라인 변경', '다른 작업지시로 전환\n' + NEXT),
  retrieve: () => location.href = 'mes_history.html',
  wo: () => modal('작업지시서', cur ? `지시번호 ${cur.current_wo || '-'}\n품번 ${cur.current_item_code || '-'}\n계획 ${fmt(cur.target_qty)} EA\n금형 ${cur.current_mold || '-'}` : '-'),
  defect: () => location.href = 'defect.html',
  complete: () => modal('작업완료', '작업지시 종료 및 실적 확정\n' + NEXT),
  call: () => modal('관리자 호출', `${cur ? cur.machine_name : ''} 관리자에게 알림을 보낼까요?`, [{ t: '취소' }, { t: '호출', pri: true, fn: callManager }]),
  worker: () => modal('작업자', `현재 투입인원: ${cur ? (cur.worker || '-').trim() : '-'}\n작업자 변경은 ` + NEXT),
  doc: () => location.href = 'gdrive_standard.html' + (cur && cur.current_item_code ? '?q=' + encodeURIComponent(cur.current_item_code) : ''),
  time: () => modal('초·중·종물 확인', cur ? `초물 ${cur.inspect_top || '-'} / 중물 ${cur.inspect_mid || '-'} / 종물 ${cur.inspect_bottom || '-'}\n(O 완료 · W 대기 · N 미실시)\n검사 입력은 ` + NEXT : '-'),
  // 원소재: 키오스크에서 바로 카메라 스캔 (스캐너가 연결돼 있으면 버튼 없이 QR만 찍으면 됨)
  material: () => MatQR.openCamera(onKioskScan, [{ t: '📋 목록·탈착 화면', fn: goAttachPage }]),
  full: () => { const d = document.documentElement; (document.fullscreenElement ? document.exitFullscreen() : d.requestFullscreen && d.requestFullscreen()); },
};
/* ============================================================
   QR 장착 — 키오스크 화면에서 바로
   · 바코드 스캐너: 버튼 없이 아무 때나 코일 라벨 QR을 찍으면 확인창이 뜬다
   · 카메라: [원소재] 버튼
   · 이미 장착된 소재가 있으면 [기존 소진 + 장착] / [기존 탈착 + 장착] 으로 교체 처리
   ============================================================ */
function goAttachPage() {
  const q = new URLSearchParams({ mc: mc || '' });
  const w = cur && (cur.worker || '').trim();
  if (w) q.set('user_name', w);
  location.href = 'material_attach.html?' + q.toString();
}

async function kioskReq(method, path, body) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    method, headers: sbHeaders(method === 'GET' ? '' : 'return=representation'),
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}: ${(await res.text()).slice(0, 200)}`);
  const ct = res.headers.get('content-type') || '';
  return res.status === 204 || !ct.includes('json') ? null : res.json();
}

// 장착자: 포털 PIN 로그인 → 없으면 현재 투입 작업자 → 없으면 '키오스크'
function kioskUser() {
  try {
    const a = JSON.parse(localStorage.getItem('esg_pin_auth') || 'null');
    if (a && a.name && (!a.exp || Date.now() < a.exp)) return { id: a.emp_id || a.id || null, name: a.name, dept: a.dept || null };
  } catch (_) {}
  const w = cur && (cur.worker || '').trim();
  return { id: null, name: w || '키오스크', dept: null };
}

let kqBusy = false, kqTimer = null;
function kq(title, html, actions) {
  clearInterval(kqTimer);
  $('kqT').textContent = title;
  $('kqB').innerHTML = html;
  const box = $('kqA'); box.innerHTML = '';
  (actions || []).forEach((a) => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = a.t; b.className = a.cls || '';
    b.onclick = async () => { if (a.keep !== true) $('kq').classList.remove('show'); if (a.fn) await a.fn(); };
    box.appendChild(b);
  });
  $('kq').classList.add('show');
}
function kqErr(title, msg) {
  MatQR.feedback(false);
  kq('⛔ ' + title, `<div class="kerr">${MatQR.esc(msg)}</div>`, [{ t: '확인', cls: 'pri' }]);
}

async function onKioskScan(text) {
  const q = MatQR.parseCoilQr(text);
  if (!q) { kqErr('인식 불가', 'IQC 합격 라벨의 QR이 아닙니다.\n품질팀에서 출력한 [IQC 합격] 라벨을 찍어 주세요.'); return; }
  if (kqBusy || !cur) return;
  kqBusy = true;
  kq('📷 코일 확인 중', '<div class="kload">IQC 판정 · 규격 · 장착 이력 확인 중…</div>', []);
  try {
    const mname = await MatQR.machineNameOf(kioskReq, cur);
    if (!mname) { kqErr('호기 확인 불가', `${cur.machine_name} 에 맞는 호기 마스터가 없습니다.\n마스터관리 > 설비에서 등록하세요.`); return; }
    const res = await MatQR.inspect(kioskReq, q.certId, q.coil, mname);
    if (res.block) { kqErr(res.block.title, res.block.msg); return; }
    showKioskConfirm(res, mname);
  } catch (e) {
    console.error('[키오스크 QR 장착]', e);
    kqErr('조회 실패', '서버 조회에 실패했습니다.\n' + e.message);
  } finally {
    kqBusy = false;
  }
}

function showKioskConfirm(res, mname) {
  const { mat, warns, onThis, chk } = res;
  const E = MatQR.esc;
  const mis = chk.status === 'mismatch';
  MatQR.feedback(!mis);
  const coilTxt = mat.coil_seq ? ` · 코일 ${mat.coil_seq}/${mat.coil_count}` : '';
  const oldTxt = onThis.map((a) => a.heat_no).join(', ');
  const html = `
    <div class="kmc">▶ ${E(mname)}</div>
    <div class="kheat">HEAT ${E(mat.heat_no)}</div>
    <div class="kspec">${E(mat.material_type)} ${E(mat.thickness)}t × ${E(mat.width)}W${coilTxt}<br>
      LOT ${E(mat.lot_no || '-')} · ${E(mat.supplier)} · 입고 ${E(mat.receipt_date || '-')} · IQC <b style="color:var(--grn)">OK</b></div>
    ${MatQR.jobHtml(res)}
    ${onThis.length ? `<div class="kwarn">현재 장착중: <b>${E(oldTxt)}</b><br>교체하면 기존 소재를 소진(다 씀) 또는 탈착(남은 코일 내림) 처리합니다.</div>` : ''}
    ${(warns || []).map((w) => `<div class="kwarn">⚠️ ${E(w)}</div>`).join('')}`;
  const go = (detachType) => async () => {
    if (mis && !confirm(`규격이 다릅니다.\n${chk.diffs.join('\n')}\n\n이 코일이 맞는 것이 확실합니까?`)) return;
    await doKioskAttach(mat, mname, onThis, detachType);
  };
  const acts = [{ t: mis ? '취소 (권장)' : '취소', cls: mis ? 'pri' : '' }];
  if (onThis.length) {
    acts.push({ t: '기존 탈착 + 장착', cls: mis ? 'danger' : '', fn: go('normal') });
    acts.push({ t: '기존 소진 + 장착', cls: mis ? 'danger' : 'pri', fn: go('consumed') });
  } else {
    acts.push({ t: mis ? '불일치 확인 후 장착' : '장착', cls: mis ? 'danger' : 'pri', fn: go(null) });
  }
  kq(mis ? '🚫 규격 불일치' : '📷 QR 장착 확인', html, acts);
}

async function doKioskAttach(mat, mname, onThis, detachType) {
  const user = kioskUser();
  kq('장착 처리 중', '<div class="kload">저장 중…</div>', []);
  let row = null;
  try {
    if (detachType) for (const a of onThis) await MatQR.detach(kioskReq, a, detachType, user, null);
    row = await MatQR.attach(kioskReq, mat, mname, user);
  } catch (e) {
    kqErr('저장 실패', '장착 기록을 저장하지 못했습니다.\n' + e.message + '\n\n다시 스캔하거나 관리자에게 연락하세요.');
    return;
  }
  // PIMMES 원소재 투입 대기 저장 (사내 동기화 프로그램이 PIMMES 에 반영)
  const q = await MatQR.queueMesInput(kioskReq, { mat, machineName: mname, attachRow: row, user, source: 'qr_kiosk' });
  MatQR.feedback(true);
  await loadAttached(); render();
  let n = q.status === 'pending' ? 3 : 8;   // PIMMES 직접 투입이 필요하면 더 오래 보여줌
  const mesLine = `<div style="font-size:2.4vh;margin-top:1vh;color:${q.status === 'pending' ? '#9cc3ff' : '#fbbf24'}">${MatQR.esc(MatQR.mesText(q))}</div>`;
  const body = () => `<div class="kok">✅ 장착 완료<br>${MatQR.esc(q.row && q.row.heat_no || mat.heat_no)} → ${MatQR.esc(mname)}${mesLine}<span style="font-size:2.4vh;color:#aaa">${n}초 후 닫힘</span></div>`;
  kq('장착 완료', body(), [{ t: '닫기', cls: 'pri' }]);
  kqTimer = setInterval(() => {
    n -= 1;
    if (n <= 0) { clearInterval(kqTimer); $('kq').classList.remove('show'); return; }
    $('kqB').innerHTML = body();
  }, 1000);
}

MatQR.listenScanner(onKioskScan);

document.querySelectorAll('.btn').forEach((b) => b.addEventListener('click', () => (ACTS[b.dataset.act] || (() => {}))()));
$('mcSel').addEventListener('change', async (e) => { mc = e.target.value; try { localStorage.setItem(LS_KEY, mc); } catch (_) {} cur = rows.find((r) => r.machine_code === mc) || null; att = null; render(); await loadAttached(); render(); });
$('refSec').textContent = REFRESH;

tick(); setInterval(tick, 1000);
load(); setInterval(load, REFRESH * 1000);
</script>
</body>
</html>
