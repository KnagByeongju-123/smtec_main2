<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>가상설비 모니터링 v3.0</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f1117;--card:#1a1d27;--card2:#222838;--border:#2a2e3d;--txt:#e8eaf0;--sub:#8b8fa3;--accent:#a855f7;--accent2:#c4b5fd;--green:#22c55e;--red:#ef4444;--yellow:#eab308;--orange:#f97316;--cyan:#0891b2;--radius:12px}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;padding-bottom:80px}
.hdr{padding:14px 16px;background:linear-gradient(180deg,#1a0f26,var(--bg));border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:8px}
.hdr h1{font-size:16px;font-weight:800;color:var(--accent)}
.hdr .sub{font-size:11px;color:var(--sub);margin-top:2px}
.hdr .back{padding:7px 12px;border-radius:8px;background:rgba(255,255,255,.06);color:var(--sub);text-decoration:none;font-size:12px;font-weight:600;flex-shrink:0;border:1px solid var(--border)}
.body{padding:14px}
.intro{background:linear-gradient(135deg,rgba(168,85,247,.08),rgba(196,181,253,.04));border:1px solid rgba(168,85,247,.2);border-radius:10px;padding:11px 14px;margin-bottom:12px;font-size:11px;color:var(--accent2);line-height:1.5}
.intro b{color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.st{background:var(--card);border-radius:9px;padding:9px 6px;border-left:3px solid var(--accent);text-align:center}
.st-label{font-size:10px;color:var(--sub)}
.st-val{font-size:20px;font-weight:800;margin-top:2px;color:var(--accent2)}
.st.run{border-left-color:var(--green)}.st.run .st-val{color:var(--green)}
.st.cust{border-left-color:#fbbf24}.st.cust .st-val{color:#fbbf24}
.filter-wrap{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.fbtn{padding:5px 11px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--sub);cursor:pointer;font-size:11px;font-weight:600;font-family:inherit}
.fbtn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.cg{background:var(--card);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;border:1px solid var(--border)}
.cg-hdr{padding:10px 14px;background:linear-gradient(135deg,#3b1d5e,#1e1238);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.cg-hdr h2{font-size:13px;color:var(--accent2);font-weight:800}
.cg-stats{font-size:10px;color:var(--sub);display:flex;gap:10px}
.cg-stats .gr{color:var(--green);font-weight:700}
.cg-stats .gd{color:var(--accent2);font-weight:700}
.eq-grid{padding:8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px}
.eq{background:var(--card2);border:1px solid var(--border);border-radius:9px;padding:10px 12px;cursor:pointer;transition:transform .1s;position:relative;border-left:3px solid var(--green)}
.eq:active{transform:scale(.97)}
.eq-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.eq-ho{font-size:15px;font-weight:800;color:var(--txt)}
.eq-vbadge{background:rgba(168,85,247,.2);color:var(--accent2);font-size:9px;font-weight:800;padding:1px 5px;border-radius:3px;border:1px solid rgba(168,85,247,.4)}
.eq-spec{font-size:10px;color:var(--sub);margin-bottom:4px;font-weight:600}
.eq-cust{font-size:11px;color:#fbbf24;font-weight:700;margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eq-st{font-size:11px;font-weight:700;color:var(--green);display:flex;align-items:center;gap:4px;margin-bottom:5px}
.eq-mat-box{background:rgba(8,145,178,.08);border:1px solid rgba(8,145,178,.3);border-radius:6px;padding:5px 7px;margin-top:5px}
.eq-mat-line{font-size:10px;color:var(--cyan);font-weight:700;margin-bottom:2px;display:flex;align-items:center;gap:4px}
.eq-mat-line .heat{font-family:ui-monospace,monospace;font-weight:800}
.eq-mat-wt{font-size:9px;color:var(--sub);font-weight:600}
.eq-item{font-size:9px;color:var(--accent2);font-weight:600;margin-top:3px}
.empty{text-align:center;padding:40px 20px;color:var(--sub);font-size:13px;line-height:1.6}
.empty a{color:var(--accent);text-decoration:none;font-weight:700}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.9);color:#fff;padding:10px 22px;border-radius:20px;font-size:12px;font-weight:600;z-index:10001;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.modal{display:none;position:fixed;inset:0;z-index:11000;background:rgba(0,0,0,.78);padding:14px;align-items:center;justify-content:center}
.modal.show{display:flex}
.mbox{background:var(--card);border-radius:14px;width:100%;max-width:380px;border:1px solid var(--border);overflow:hidden}
.mhdr{padding:13px 16px;background:linear-gradient(135deg,#3b1d5e,#1e1238);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.mhdr h3{font-size:15px;color:var(--accent2);font-weight:800}
.mhdr .close{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.08);color:var(--sub);border:none;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
.mbody{padding:14px;max-height:60vh;overflow-y:auto}
.mrow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(42,46,61,.5);font-size:12px}
.mrow:last-child{border:none}
.ml{color:var(--sub);font-weight:600}
.mv{font-weight:700;text-align:right;word-break:break-all;color:var(--txt)}
.m-mat-list{margin-top:8px}
.m-mat-item{background:rgba(8,145,178,.08);border:1px solid rgba(8,145,178,.3);border-radius:8px;padding:8px 10px;margin-bottom:6px}
.m-mat-item:last-child{margin-bottom:0}
.m-mat-row{display:flex;justify-content:space-between;font-size:11px;margin-bottom:2px}
.m-mat-row .lbl{color:var(--sub)}
.m-mat-row .vl{color:var(--txt);font-weight:700}
.mfoot{padding:10px 14px;border-top:1px solid var(--border);display:flex;gap:8px;background:rgba(0,0,0,.2)}
.mbtn{flex:1;padding:11px;border-radius:9px;border:none;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.mbtn.go{background:linear-gradient(135deg,#a855f7,#7e22ce);color:#fff}
.mbtn.cancel{background:rgba(255,255,255,.06);color:var(--sub);border:1px solid var(--border)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:4px}
</style>
</head>
<body>
<div class="hdr">
  <div>
    <h1>🟣 가상설비 모니터링 v3.0</h1>
    <div class="sub"><span class="dot" id="dot"></span><span id="lastUpdate">-</span> │ <span id="countdown">30초 갱신</span></div>
  </div>
  <a href="index.html" class="back">← 메뉴</a>
</div>
<div class="body">
  <div class="intro">
    🎯 <b>소재 장착 = 가상설비 자동 생성</b><br>
    📦 <code style="background:rgba(255,255,255,.05);padding:1px 4px;border-radius:3px;font-size:10px">material_attachment</code>에 status=attached 인 호기가 자동으로 표시됩니다.<br>
    🏢 고객사는 장착 소재의 customer로 자동 분류됩니다.
  </div>
  <div class="stats">
    <div class="st"><div class="st-label">가상설비</div><div class="st-val" id="sTotal">-</div></div>
    <div class="st run"><div class="st-label">소재 장착</div><div class="st-val" id="sMat">-</div></div>
    <div class="st cust"><div class="st-label">고객사</div><div class="st-val" id="sCust">-</div></div>
  </div>
  <div class="filter-wrap" id="filterBar"></div>
  <div id="groupArea"><div class="empty">데이터 로딩 중...</div></div>
</div>

<div class="modal" id="modal">
  <div class="mbox">
    <div class="mhdr">
      <h3 id="mTitle">가상설비 상세</h3>
      <button class="close" onclick="closeModal()">✕</button>
    </div>
    <div class="mbody" id="mBody"></div>
    <div class="mfoot">
      <button class="mbtn cancel" onclick="closeModal()">닫기</button>
      <button class="mbtn go" id="goBtn" onclick="goToDetail()">📊 가상작업 보기</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var SB_URL='https://omngtyewdaqpphnzeate.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9tbmd0eWV3ZGFxcHBobnplYXRlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4ODk4ODksImV4cCI6MjA5MDQ2NTg4OX0.Zxur3t02JHtOcXforCMSwO3i2mMaf5sViE0tXXUC0-s';
var sbH={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'};

async function sbGet(t,q){
  try{
    var r=await fetch(SB_URL+'/rest/v1/'+t+'?'+(q||''),{headers:sbH});
    return r.ok?r.json():null;
  }catch(e){console.log('[sbGet] '+t+' 에러:',e.message);return null}
}

var timer=30,curFilter='ALL',cachedData=null,curMachine=null;
var toastT;
function showToast(m,ms){
  var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show')},ms||2000);
}
function _esc(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function _num(n){return (+n||0).toLocaleString()}

async function loadVirtual(){
  // ★ 소재 장착(attached) 기반 동적 가상설비 ★
  // 5개 API 병렬 호출
  var results=await Promise.all([
    sbGet('material_attachment','select=*&status=eq.attached&order=attach_time.desc&limit=200'),
    sbGet('work_order_cache','select=machine_code,machine_name,item_code,item_name,mold_code,plan_qty,actual_qty,work_order_no&work_order_status=eq.1&order=created_at.desc&limit=200').catch(function(){return[]}),
    sbGet('material_master_tj','select=id,material_name,customer,mapped_models,material_type,thickness,width&limit=2000').catch(function(){return[]}),
    sbGet('machine_master_tj','select=ho_code,maker,tonnage,customer&order=ho_code.asc&limit=200').catch(function(){return[]}),
    sbGet('machine_virtual','select=machine_code,machine_name,press_maker,tonnage,customer&active=eq.true&limit=100').catch(function(){return[]})
  ]);
  var attachments=results[0]||[];
  var workOrders=results[1]||[];
  var matMasters=results[2]||[];
  var machineMasters=results[3]||[];
  var virtualMasters=results[4]||[];

  if(!attachments.length){
    cachedData=[];
    renderVirtual([]);
    document.getElementById('lastUpdate').textContent=new Date().toLocaleString('ko-KR');
    timer=30;
    return;
  }

  // 호기번호 추출 함수
  function extractHo(src){
    var s=String(src||'').trim();
    var mt=s.match(/^(\d{1,3})/);
    return mt?String(parseInt(mt[1],10)):'';
  }

  // 인덱스 구성
  var woByHo={};
  workOrders.forEach(function(w){
    var k=extractHo(w.machine_code||w.machine_name);
    if(k&&!woByHo[k])woByHo[k]=w;
  });
  
  // 소재마스터 인덱스 (id 또는 mapped_models)
  var matIdx={};
  matMasters.forEach(function(mm){
    if(!mm)return;
    if(mm.id)matIdx[String(mm.id)]=mm;
    if(mm.mapped_models){
      String(mm.mapped_models).split(',').forEach(function(mc){
        var k=mc.trim();
        if(k&&!matIdx[k])matIdx[k]=mm;
      });
    }
  });

  // 설비마스터 인덱스 (호기번호 기준)
  var machIdx={};
  machineMasters.forEach(function(m){
    var k=String(parseInt(m.ho_code,10)||m.ho_code||'').trim();
    if(k)machIdx[k]=m;
  });
  
  // 가상설비 마스터 인덱스 (호기번호 기준 - V0049 → 49)
  var vMachIdx={};
  virtualMasters.forEach(function(v){
    var k=extractHo(v.machine_name||v.machine_code);
    if(k)vMachIdx[k]=v;
  });

  // 호기별로 attachment 묶기
  var byHo={};
  attachments.forEach(function(att){
    var hoNum=extractHo(att.machine_code||att.machine_name);
    if(!hoNum)return;
    if(!byHo[hoNum])byHo[hoNum]={ho:hoNum,attachments:[]};
    byHo[hoNum].attachments.push(att);
  });

  // 데이터 구성
  var data=[];
  Object.keys(byHo).forEach(function(hoNum){
    var group=byHo[hoNum];
    var firstAtt=group.attachments[0]; // 가장 최근 장착 소재
    var wo=woByHo[hoNum];
    var mach=machIdx[hoNum];
    var vMach=vMachIdx[hoNum];

    // 메이커/톤수: 가상마스터 > 실설비마스터
    var maker=vMach?vMach.press_maker:(mach?mach.maker:'');
    var ton=vMach?vMach.tonnage:(mach?mach.tonnage:0);

    // ★ 동적 고객사 결정 ★
    // 최근 장착 소재 → 작업지시 품번 → 가상마스터 → 설비마스터 customer
    var dynCustomer='';
    var firstMatInfo=null;
    if(firstAtt){
      if(firstAtt.material_code&&matIdx[String(firstAtt.material_code)]){
        firstMatInfo=matIdx[String(firstAtt.material_code)];
        if(firstMatInfo.customer)dynCustomer=firstMatInfo.customer;
      }
      if(!dynCustomer&&firstAtt.item_code&&matIdx[String(firstAtt.item_code)]){
        firstMatInfo=matIdx[String(firstAtt.item_code)];
        if(firstMatInfo.customer)dynCustomer=firstMatInfo.customer;
      }
    }
    if(!dynCustomer&&wo&&wo.item_code&&matIdx[String(wo.item_code)]){
      var woMat=matIdx[String(wo.item_code)];
      if(woMat&&woMat.customer)dynCustomer=woMat.customer;
    }
    if(!dynCustomer&&vMach&&vMach.customer)dynCustomer=vMach.customer;
    if(!dynCustomer&&mach&&mach.customer)dynCustomer=mach.customer;
    if(!dynCustomer)dynCustomer='미지정';

    // 소재 상세 (모든 장착)
    var matDetails=group.attachments.map(function(att){
      var mat=null;
      if(att.material_code&&matIdx[String(att.material_code)])mat=matIdx[String(att.material_code)];
      else if(att.item_code&&matIdx[String(att.item_code)])mat=matIdx[String(att.item_code)];
      return {
        heatNo:att.heat_no||att.lot_no||'',
        weight:att.weight||0,
        moldCode:att.mold_code||'',
        itemCode:att.item_code||'',
        materialCode:att.material_code||'',
        materialName:mat?mat.material_name:'',
        materialCustomer:mat?mat.customer:'',
        materialType:mat?mat.material_type:'',
        thickness:mat?mat.thickness:0,
        width:mat?mat.width:0,
        attachTime:att.attach_time||''
      };
    });

    data.push({
      ho:hoNum,
      hoNum:hoNum,
      machine_code:firstAtt.machine_code||(vMach?vMach.machine_code:''),
      machine_name:firstAtt.machine_name||(vMach?vMach.machine_name:(hoNum+'호기')),
      maker:maker,
      ton:ton,
      customer:dynCustomer,
      isRunning:true,
      itemCode:wo?wo.item_code:(firstAtt?firstAtt.item_code:''),
      itemName:wo?wo.item_name:'',
      mold:wo?wo.mold_code:(firstAtt?firstAtt.mold_code:''),
      workOrderNo:wo?wo.work_order_no:'',
      planQty:wo?wo.plan_qty:0,
      actualQty:wo?wo.actual_qty:0,
      matCount:group.attachments.length,
      matDetails:matDetails
    });
  });

  // 호기번호로 정렬
  data.sort(function(a,b){return (parseInt(a.ho)||0)-(parseInt(b.ho)||0)});

  cachedData=data;
  renderVirtual(data);
  document.getElementById('lastUpdate').textContent=new Date().toLocaleString('ko-KR');
  timer=30;
}

function renderVirtual(data){
  var total=data.length;
  var matTotal=data.reduce(function(s,d){return s+d.matCount},0);
  var custs={};
  data.forEach(function(d){var c=d.customer||'미지정';custs[c]=(custs[c]||0)+1});
  var custList=Object.keys(custs).sort();
  document.getElementById('sTotal').textContent=total;
  document.getElementById('sMat').textContent=matTotal;
  document.getElementById('sCust').textContent=custList.length;

  // 필터
  var fb=document.getElementById('filterBar');fb.innerHTML='';
  var allBtn=document.createElement('button');
  allBtn.className='fbtn'+(curFilter==='ALL'?' active':'');
  allBtn.textContent='전체('+total+')';
  allBtn.onclick=function(){curFilter='ALL';renderVirtual(cachedData)};
  fb.appendChild(allBtn);
  custList.forEach(function(c){
    var b=document.createElement('button');
    b.className='fbtn'+(curFilter===c?' active':'');
    b.textContent=c+'('+custs[c]+')';
    (function(cc){b.onclick=function(){curFilter=cc;renderVirtual(cachedData)}})(c);
    fb.appendChild(b);
  });

  var ga=document.getElementById('groupArea');
  if(!total){
    ga.innerHTML='<div class="empty">📭 가상설비 없음<br><span style="font-size:11px">소재 장착된 호기가 없습니다<br><a href="material_attach.html">→ 소재 장착 화면</a></span></div>';
    return;
  }

  var show=curFilter==='ALL'?custList:[curFilter];
  var groups={};
  data.forEach(function(d){
    var c=d.customer||'미지정';
    if(!groups[c])groups[c]=[];
    groups[c].push(d);
  });

  ga.innerHTML='';
  show.forEach(function(cust){
    var rows=groups[cust];if(!rows)return;
    rows.sort(function(a,b){return (parseInt(a.ho)||0)-(parseInt(b.ho)||0)});
    var cg=document.createElement('div');cg.className='cg';
    var totMat=rows.reduce(function(s,r){return s+r.matCount},0);
    var hdr='<div class="cg-hdr"><h2>🏢 '+_esc(cust)+'</h2>'+
      '<div class="cg-stats"><span>'+rows.length+'대</span>'+
      '<span class="gr">소재'+totMat+'</span></div></div>';
    var grid='<div class="eq-grid"></div>';
    cg.innerHTML=hdr+grid;
    ga.appendChild(cg);
    var gridEl=cg.querySelector('.eq-grid');
    rows.forEach(function(d){
      var card=document.createElement('div');
      card.className='eq';
      // 최근 장착 소재 1개 표시 (요약)
      var firstMat=d.matDetails[0]||{};
      var matHtml='';
      if(firstMat.heatNo){
        var specParts=[];
        if(firstMat.thickness)specParts.push(firstMat.thickness+'t');
        if(firstMat.width)specParts.push(firstMat.width+'w');
        var spec=specParts.join('×');
        matHtml='<div class="eq-mat-box">'+
          '<div class="eq-mat-line"><span>📎</span><span class="heat">'+_esc(firstMat.heatNo)+'</span>'+
          (d.matCount>1?' <span style="color:var(--accent2)">+'+(d.matCount-1)+'</span>':'')+'</div>'+
          (firstMat.materialName?'<div class="eq-mat-wt">'+_esc(firstMat.materialName)+(spec?' · '+spec:'')+'</div>':'')+
          (firstMat.weight?'<div class="eq-mat-wt">📦 '+(+firstMat.weight).toFixed(0)+' kg</div>':'')+
          '</div>';
      }
      card.innerHTML='<div class="eq-top"><span class="eq-ho">'+_esc(d.ho)+'호기</span><span class="eq-vbadge">V</span></div>'+
        '<div class="eq-spec">'+_esc(d.maker||'-')+(d.ton?' · '+d.ton+'톤':'')+'</div>'+
        '<div class="eq-cust">'+_esc(d.customer)+'</div>'+
        '<div class="eq-st">● 가동중'+(d.itemCode?' · '+_esc(d.itemCode):'')+'</div>'+
        matHtml;
      (function(rec){card.onclick=function(){openModal(rec)}})(d);
      gridEl.appendChild(card);
    });
  });
}

function openModal(d){
  curMachine=d;
  document.getElementById('mTitle').textContent=d.ho+'호기 상세';
  var rows=[
    ['🏭 메이커',d.maker||'-'],
    ['🔧 톤수',d.ton?d.ton+'톤':'-'],
    ['🏢 고객사',d.customer||'-'],
    ['📊 상태','● 가동중']
  ];
  if(d.itemCode)rows.push(['📦 품번',d.itemCode]);
  if(d.itemName)rows.push(['품명',d.itemName]);
  if(d.mold)rows.push(['🎭 금형',d.mold]);
  if(d.workOrderNo)rows.push(['📋 작업지시',d.workOrderNo]);
  if(d.planQty)rows.push(['목표',_num(d.planQty)+'개']);
  if(d.actualQty)rows.push(['실적',_num(d.actualQty)+'개']);
  if(d.machine_code)rows.push(['설비코드',d.machine_code]);
  
  var html=rows.map(function(r){return'<div class="mrow"><span class="ml">'+r[0]+'</span><span class="mv">'+_esc(r[1])+'</span></div>'}).join('');
  
  // 소재 목록
  if(d.matDetails&&d.matDetails.length){
    html+='<div style="margin-top:12px;font-size:12px;font-weight:800;color:var(--accent);margin-bottom:6px">📦 장착 소재 ('+d.matDetails.length+'건)</div>';
    html+='<div class="m-mat-list">';
    d.matDetails.forEach(function(m){
      var specParts=[];
      if(m.thickness)specParts.push(m.thickness+'t');
      if(m.width)specParts.push(m.width+'w');
      var spec=specParts.join('×');
      html+='<div class="m-mat-item">';
      html+='<div class="m-mat-row"><span class="lbl">HEAT</span><span class="vl" style="color:var(--cyan)">'+_esc(m.heatNo)+'</span></div>';
      if(m.materialName)html+='<div class="m-mat-row"><span class="lbl">소재명</span><span class="vl">'+_esc(m.materialName)+'</span></div>';
      if(spec)html+='<div class="m-mat-row"><span class="lbl">규격</span><span class="vl">'+_esc(spec)+'</span></div>';
      if(m.weight)html+='<div class="m-mat-row"><span class="lbl">중량</span><span class="vl">'+(+m.weight).toFixed(0)+' kg</span></div>';
      if(m.materialCustomer)html+='<div class="m-mat-row"><span class="lbl">소재 customer</span><span class="vl" style="color:#fbbf24">'+_esc(m.materialCustomer)+'</span></div>';
      if(m.moldCode)html+='<div class="m-mat-row"><span class="lbl">금형</span><span class="vl">'+_esc(m.moldCode)+'</span></div>';
      html+='</div>';
    });
    html+='</div>';
  }
  
  document.getElementById('mBody').innerHTML=html;
  document.getElementById('modal').classList.add('show');
}

function closeModal(){document.getElementById('modal').classList.remove('show');curMachine=null}

function goToDetail(){
  if(!curMachine)return;
  var url='?machine_code='+encodeURIComponent(curMachine.machine_code||('V'+(curMachine.hoNum||'').padStart(4,'0')));
  url+='&machine_name='+encodeURIComponent(curMachine.machine_name||(curMachine.ho+'호기'));
  url+='&customer='+encodeURIComponent(curMachine.customer||'');
  url+='&ho='+encodeURIComponent(curMachine.ho);
  window.location.href='mes_virtual_work.html'+url;
}

async function init(){
  try{
    await loadVirtual();
  }catch(e){
    console.error('init 실패:',e);
    document.getElementById('groupArea').innerHTML='<div class="empty" style="color:#ef4444">❌ 로드 실패<br><span style="font-size:11px">'+_esc(e.message)+'</span></div>';
  }
}

setInterval(function(){
  timer--;
  if(timer<=0){timer=30;loadVirtual().catch(function(e){console.log('재로드 실패:',e)})}
  document.getElementById('countdown').textContent='갱신:'+Math.floor(timer/60)+':'+String(timer%60).padStart(2,'0');
},1000);

init();
</script>
</body>
</html>
