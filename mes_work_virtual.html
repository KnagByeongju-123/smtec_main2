<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>가상설비 모니터링 v2.1</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f1117;--card:#1a1d27;--card2:#222838;--border:#2a2e3d;--txt:#e8eaf0;--sub:#8b8fa3;--accent:#a855f7;--accent2:#c4b5fd;--green:#22c55e;--red:#ef4444;--yellow:#eab308;--orange:#f97316;--radius:12px}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;padding-bottom:80px}
.hdr{padding:14px 16px;background:linear-gradient(180deg,#1a0f26,var(--bg));border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:8px}
.hdr h1{font-size:16px;font-weight:800;color:var(--accent)}
.hdr .sub{font-size:11px;color:var(--sub);margin-top:2px}
.hdr .back{padding:7px 12px;border-radius:8px;background:rgba(255,255,255,.06);color:var(--sub);text-decoration:none;font-size:12px;font-weight:600;flex-shrink:0;border:1px solid var(--border)}
.body{padding:14px}
.intro{background:linear-gradient(135deg,rgba(168,85,247,.08),rgba(196,181,253,.04));border:1px solid rgba(168,85,247,.2);border-radius:10px;padding:11px 14px;margin-bottom:12px;font-size:11px;color:var(--accent2);line-height:1.5}
.intro b{color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.st{background:var(--card);border-radius:9px;padding:9px 6px;border-left:3px solid var(--accent);text-align:center}
.st-label{font-size:10px;color:var(--sub)}
.st-val{font-size:20px;font-weight:800;margin-top:2px;color:var(--accent2)}
.st.run{border-left-color:var(--green)}.st.run .st-val{color:var(--green)}
.st.idle{border-left-color:var(--sub)}.st.idle .st-val{color:var(--sub)}
.filter-wrap{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.fbtn{padding:5px 11px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--sub);cursor:pointer;font-size:11px;font-weight:600;font-family:inherit}
.fbtn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.cg{background:var(--card);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;border:1px solid var(--border)}
.cg-hdr{padding:10px 14px;background:linear-gradient(135deg,#3b1d5e,#1e1238);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.cg-hdr h2{font-size:13px;color:var(--accent2);font-weight:800}
.cg-stats{font-size:10px;color:var(--sub);display:flex;gap:10px}
.cg-stats .gr{color:var(--green);font-weight:700}
.cg-stats .gd{color:var(--accent2);font-weight:700}
.eq-grid{padding:8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:6px}
.eq{background:var(--card2);border:1px solid var(--border);border-radius:9px;padding:9px 11px;cursor:pointer;transition:transform .1s;position:relative}
.eq:active{transform:scale(.97)}
.eq.run{border-left:3px solid var(--green);background:linear-gradient(135deg,rgba(34,197,94,.05),var(--card2))}
.eq.idle{border-left:3px solid var(--accent);opacity:.85}
.eq-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.eq-ho{font-size:14px;font-weight:800;color:var(--txt)}
.eq-vbadge{background:rgba(168,85,247,.2);color:var(--accent2);font-size:9px;font-weight:800;padding:1px 5px;border-radius:3px;border:1px solid rgba(168,85,247,.4)}
.eq-spec{font-size:10px;color:var(--sub);margin-bottom:4px;font-weight:600}
.eq-cust{font-size:10px;color:#fbbf24;font-weight:700;margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eq-st{font-size:11px;font-weight:700;display:flex;align-items:center;gap:4px}
.eq-st.run{color:var(--green)}
.eq-st.idle{color:var(--accent2)}
.eq-mat{font-size:9px;color:#0891b2;font-weight:700;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{text-align:center;padding:40px 20px;color:var(--sub);font-size:13px;line-height:1.6}
.empty a{color:var(--accent);text-decoration:none;font-weight:700}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.9);color:#fff;padding:10px 22px;border-radius:20px;font-size:12px;font-weight:600;z-index:10001;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.modal{display:none;position:fixed;inset:0;z-index:11000;background:rgba(0,0,0,.78);padding:14px;align-items:center;justify-content:center}
.modal.show{display:flex}
.mbox{background:var(--card);border-radius:14px;width:100%;max-width:380px;border:1px solid var(--border);overflow:hidden}
.mhdr{padding:13px 16px;background:linear-gradient(135deg,#3b1d5e,#1e1238);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.mhdr h3{font-size:15px;color:var(--accent2);font-weight:800}
.mhdr .close{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.08);color:var(--sub);border:none;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
.mbody{padding:14px}
.mrow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(42,46,61,.5);font-size:12px}
.mrow:last-child{border:none}
.ml{color:var(--sub);font-weight:600}
.mv{font-weight:700;text-align:right;word-break:break-all;color:var(--txt)}
.mfoot{padding:10px 14px;border-top:1px solid var(--border);display:flex;gap:8px;background:rgba(0,0,0,.2)}
.mbtn{flex:1;padding:11px;border-radius:9px;border:none;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.mbtn.go{background:linear-gradient(135deg,#a855f7,#7e22ce);color:#fff}
.mbtn.cancel{background:rgba(255,255,255,.06);color:var(--sub);border:1px solid var(--border)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:4px}
</style>
</head>
<body>
<div class="hdr">
  <div>
    <h1>🟣 가상설비 모니터링 v2.1</h1>
    <div class="sub"><span class="dot" id="dot"></span><span id="lastUpdate">-</span> │ <span id="countdown">30초 갱신</span></div>
  </div>
  <a href="index.html" class="back">← 메뉴</a>
</div>
<div class="body">
  <div class="intro">
    💡 <b>가상설비</b> = <code style="background:rgba(255,255,255,.05);padding:1px 4px;border-radius:3px;font-size:10px">machine_virtual</code> 등록 호기만 표시<br>
    🎯 <b>고객사 동적 변경</b>: 장착 소재의 customer로 자동 분류 (장착 없으면 기본 customer)
  </div>
  <div class="stats">
    <div class="st"><div class="st-label">전체</div><div class="st-val" id="sTotal">-</div></div>
    <div class="st run"><div class="st-label">가동중</div><div class="st-val" id="sRun">-</div></div>
    <div class="st idle"><div class="st-label">대기</div><div class="st-val" id="sIdle">-</div></div>
  </div>
  <div class="filter-wrap" id="filterBar"></div>
  <div id="groupArea"><div class="empty">데이터 로딩 중...</div></div>
</div>

<div class="modal" id="modal">
  <div class="mbox">
    <div class="mhdr">
      <h3 id="mTitle">가상설비 상세</h3>
      <button class="close" onclick="closeModal()">✕</button>
    </div>
    <div class="mbody" id="mBody"></div>
    <div class="mfoot">
      <button class="mbtn cancel" onclick="closeModal()">닫기</button>
      <button class="mbtn go" id="goBtn" onclick="goToWorkOrder()">🚀 작업지시 등록</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var SB_URL='https://omngtyewdaqpphnzeate.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9tbmd0eWV3ZGFxcHBobnplYXRlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4ODk4ODksImV4cCI6MjA5MDQ2NTg4OX0.Zxur3t02JHtOcXforCMSwO3i2mMaf5sViE0tXXUC0-s';
var sbH={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'};

async function sbGet(t,q){
  try{
    var r=await fetch(SB_URL+'/rest/v1/'+t+'?'+(q||''),{headers:sbH});
    return r.ok?r.json():null;
  }catch(e){console.log('[sbGet] '+t+' 에러:',e.message);return null}
}

var timer=30,curFilter='ALL',cachedData=null,curMachine=null;
var toastT;
function showToast(m,ms){
  var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show')},ms||2000);
}
function _esc(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function _num(n){return (+n||0).toLocaleString()}

async function loadVirtual(){
  // ★ machine_virtual 테이블만 조회 (master_tj 아님)
  // 4개 API 병렬 호출
  var results=await Promise.all([
    sbGet('machine_virtual','select=*&active=eq.true&order=sort_order.asc'),
    sbGet('work_order_cache','select=machine_code,machine_name,item_code,item_name,mold_code,plan_qty,actual_qty,work_order_no&work_order_status=eq.1&order=created_at.desc&limit=100').catch(function(){return[]}),
    sbGet('material_attachment','select=machine_code,machine_name,heat_no,lot_no,weight,mold_code,item_code,material_code&status=eq.attached&order=attach_time.desc&limit=100').catch(function(){return[]}),
    sbGet('material_master_tj','select=id,material_name,customer,mapped_models&limit=2000').catch(function(){return[]})
  ]);
  var virtuals=results[0];
  var workOrders=results[1]||[];
  var attachments=results[2]||[];
  var matMasters=results[3]||[];

  if(!virtuals){showToast('⚠ machine_virtual 조회 실패');return}
  if(!virtuals.length){
    cachedData=[];
    renderVirtual([]);
    document.getElementById('lastUpdate').textContent=new Date().toLocaleString('ko-KR');
    timer=30;
    return;
  }

  // 호기별 작업/첨부 인덱스 (Map O(1))
  var woByHo={},attByHo={};
  workOrders.forEach(function(w){
    var src=String(w.machine_code||w.machine_name||'').trim();
    var mt=src.match(/^(\d{1,3})/);
    if(mt){var k=String(parseInt(mt[1],10));if(!woByHo[k])woByHo[k]=w}
  });
  attachments.forEach(function(a){
    var src=String(a.machine_code||a.machine_name||'').trim();
    var mt=src.match(/^(\d{1,3})/);
    if(mt){var k=String(parseInt(mt[1],10));if(!attByHo[k])attByHo[k]=a}
  });

  // 소재마스터 인덱스
  var matCustByCode={},matNameByCode={};
  matMasters.forEach(function(mm){
    if(mm.customer){
      if(mm.id){
        matCustByCode[String(mm.id)]=mm.customer;
        matNameByCode[String(mm.id)]=mm.material_name||'';
      }
      if(mm.mapped_models){
        String(mm.mapped_models).split(',').forEach(function(mc){
          var k=mc.trim();
          if(k&&!matCustByCode[k]){
            matCustByCode[k]=mm.customer;
            matNameByCode[k]=mm.material_name||'';
          }
        });
      }
    }
  });

  // 가상설비 데이터 구성
  var data=[];
  virtuals.forEach(function(v){
    var name=String(v.machine_name||'').trim();
    var mt=name.match(/^(\d{1,3})/);
    var hoNum=mt?String(parseInt(mt[1],10)):'';
    var wo=woByHo[hoNum];
    var att=attByHo[hoNum];
    var isActive=!!(wo||att);

    // ★ 동적 고객사 결정 ★
    // 1순위: 장착 소재의 customer (material_master_tj 조회)
    // 2순위: 작업지시 item_code → 마스터 매핑
    // 3순위: machine_virtual.customer (기본값)
    var dynCustomer='';
    var matName='';
    if(att){
      if(att.material_code&&matCustByCode[String(att.material_code)]){
        dynCustomer=matCustByCode[String(att.material_code)];
        matName=matNameByCode[String(att.material_code)]||'';
      }else if(att.item_code&&matCustByCode[String(att.item_code)]){
        dynCustomer=matCustByCode[String(att.item_code)];
        matName=matNameByCode[String(att.item_code)]||'';
      }
    }
    if(!dynCustomer&&wo&&wo.item_code){
      if(matCustByCode[String(wo.item_code)])dynCustomer=matCustByCode[String(wo.item_code)];
    }
    if(!dynCustomer)dynCustomer=v.customer||'미지정';

    data.push({
      id:v.id,
      ho:hoNum,
      hoNum:hoNum,
      machine_code:v.machine_code||'',
      maker:v.press_maker||'',
      ton:v.tonnage||0,
      customer:dynCustomer,
      defaultCustomer:v.customer||'',
      sortOrder:v.sort_order||0,
      isRunning:isActive,
      itemCode:wo?wo.item_code:(att?att.item_code:''),
      itemName:wo?wo.item_name:'',
      mold:wo?wo.mold_code:(att?att.mold_code:''),
      workOrderNo:wo?wo.work_order_no:'',
      planQty:wo?wo.plan_qty:0,
      actualQty:wo?wo.actual_qty:0,
      lotNo:att?(att.lot_no||att.heat_no):'',
      coilWeight:att?att.weight:0,
      matName:matName
    });
  });

  cachedData=data;
  renderVirtual(data);
  document.getElementById('lastUpdate').textContent=new Date().toLocaleString('ko-KR');
  timer=30;
}

function renderVirtual(data){
  var total=data.length;
  var running=data.filter(function(d){return d.isRunning}).length;
  var idle=total-running;
  var custs={};
  data.forEach(function(d){var c=d.customer||'미지정';custs[c]=(custs[c]||0)+1});
  var custList=Object.keys(custs).sort();
  document.getElementById('sTotal').textContent=total;
  document.getElementById('sRun').textContent=running;
  document.getElementById('sIdle').textContent=idle;

  // 필터
  var fb=document.getElementById('filterBar');fb.innerHTML='';
  var allBtn=document.createElement('button');
  allBtn.className='fbtn'+(curFilter==='ALL'?' active':'');
  allBtn.textContent='전체('+total+')';
  allBtn.onclick=function(){curFilter='ALL';renderVirtual(cachedData)};
  fb.appendChild(allBtn);
  custList.forEach(function(c){
    var b=document.createElement('button');
    b.className='fbtn'+(curFilter===c?' active':'');
    b.textContent=c+'('+custs[c]+')';
    (function(cc){b.onclick=function(){curFilter=cc;renderVirtual(cachedData)}})(c);
    fb.appendChild(b);
  });

  var ga=document.getElementById('groupArea');
  if(!total){
    ga.innerHTML='<div class="empty">📭 등록된 가상설비 없음<br><span style="font-size:11px">machine_virtual 테이블에 INSERT 필요<br>(현재 active=true 인 데이터 없음)</span></div>';
    return;
  }

  var show=curFilter==='ALL'?custList:[curFilter];
  var groups={};
  data.forEach(function(d){
    var c=d.customer||'미지정';
    if(!groups[c])groups[c]=[];
    groups[c].push(d);
  });

  ga.innerHTML='';
  show.forEach(function(cust){
    var rows=groups[cust];if(!rows)return;
    var gRun=rows.filter(function(r){return r.isRunning}).length;
    rows.sort(function(a,b){
      if(a.sortOrder!==b.sortOrder)return a.sortOrder-b.sortOrder;
      return (parseInt(a.ho)||0)-(parseInt(b.ho)||0);
    });
    var cg=document.createElement('div');cg.className='cg';
    var hdr='<div class="cg-hdr"><h2>🏢 '+_esc(cust)+'</h2>'+
      '<div class="cg-stats"><span>'+rows.length+'대</span>'+
      '<span class="gr">가동'+gRun+'</span>'+
      '<span class="gd">대기'+(rows.length-gRun)+'</span></div></div>';
    var grid='<div class="eq-grid"></div>';
    cg.innerHTML=hdr+grid;
    ga.appendChild(cg);
    var gridEl=cg.querySelector('.eq-grid');
    rows.forEach(function(d){
      var card=document.createElement('div');
      card.className='eq '+(d.isRunning?'run':'idle');
      var stTxt=d.isRunning?'● 가동중':'○ 대기';
      var matHtml=d.lotNo?'<div class="eq-mat">📎 '+_esc(d.lotNo)+(d.matName?' · '+_esc(d.matName):'')+'</div>':'';
      card.innerHTML='<div class="eq-top"><span class="eq-ho">'+_esc(d.ho)+'호기</span><span class="eq-vbadge">V</span></div>'+
        '<div class="eq-spec">'+_esc(d.maker||'-')+(d.ton?' · '+d.ton+'톤':'')+'</div>'+
        '<div class="eq-cust">'+_esc(d.customer)+'</div>'+
        '<div class="eq-st '+(d.isRunning?'run':'idle')+'">'+stTxt+(d.itemCode?' · '+_esc(d.itemCode):'')+'</div>'+
        matHtml;
      (function(rec){card.onclick=function(){openModal(rec)}})(d);
      gridEl.appendChild(card);
    });
  });
}

function openModal(d){
  curMachine=d;
  document.getElementById('mTitle').textContent=d.ho+'호기 상세';
  var stMain=d.isRunning?'● 가동중':'○ 대기';
  var rows=[
    ['🏭 메이커',d.maker||'-'],
    ['🔧 톤수',d.ton?d.ton+'톤':'-'],
    ['🏢 현재 고객사',_esc(d.customer)+(d.defaultCustomer&&d.defaultCustomer!==d.customer?' (기본:'+_esc(d.defaultCustomer)+')':'')],
    ['📊 상태',stMain]
  ];
  if(d.itemCode)rows.push(['📦 품번',d.itemCode]);
  if(d.itemName)rows.push(['품명',d.itemName]);
  if(d.mold)rows.push(['🎭 금형',d.mold]);
  if(d.workOrderNo)rows.push(['📋 작업지시',d.workOrderNo]);
  if(d.planQty)rows.push(['목표',_num(d.planQty)+'개']);
  if(d.actualQty)rows.push(['실적',_num(d.actualQty)+'개']);
  if(d.lotNo)rows.push(['📎 로트',d.lotNo]);
  if(d.matName)rows.push(['소재명',d.matName]);
  if(d.coilWeight)rows.push(['📦 코일중량',(+d.coilWeight).toFixed(0)+'kg']);
  if(d.machine_code)rows.push(['설비코드',d.machine_code]);
  var html=rows.map(function(r){return'<div class="mrow"><span class="ml">'+r[0]+'</span><span class="mv">'+_esc(r[1])+'</span></div>'}).join('');
  document.getElementById('mBody').innerHTML=html;
  var goBtn=document.getElementById('goBtn');
  if(d.isRunning){goBtn.textContent='📊 작업현황 보기';goBtn.style.background='linear-gradient(135deg,#22c55e,#16a34a)'}
  else{goBtn.textContent='🚀 작업지시 등록';goBtn.style.background='linear-gradient(135deg,#a855f7,#7e22ce)'}
  document.getElementById('modal').classList.add('show');
}

function closeModal(){document.getElementById('modal').classList.remove('show');curMachine=null}

function goToWorkOrder(){
  if(!curMachine)return;
  var url='?machine_code='+encodeURIComponent(curMachine.machine_code||('V'+(curMachine.hoNum||'').padStart(4,'0')));
  url+='&machine_name='+encodeURIComponent(curMachine.ho+'호기 '+(curMachine.maker||'')+(curMachine.ton?' '+curMachine.ton+'톤':''));
  url+='&customer='+encodeURIComponent(curMachine.customer||'');
  url+='&ho='+encodeURIComponent(curMachine.ho);
  if(curMachine.isRunning){
    window.location.href='mes_virtual_work.html'+url;
  }else{
    window.location.href='mes_virtual_work_order.html'+url;
  }
}

async function init(){
  try{
    await loadVirtual();
  }catch(e){
    console.error('init 실패:',e);
    document.getElementById('groupArea').innerHTML='<div class="empty" style="color:#ef4444">❌ 로드 실패<br><span style="font-size:11px">'+_esc(e.message)+'</span></div>';
  }
}

setInterval(function(){
  timer--;
  if(timer<=0){timer=30;loadVirtual().catch(function(e){console.log('재로드 실패:',e)})}
  document.getElementById('countdown').textContent='갱신:'+Math.floor(timer/60)+':'+String(timer%60).padStart(2,'0');
},1000);

init();
</script>
</body>
</html>
