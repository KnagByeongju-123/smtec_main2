<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>소재 장착 관리 v1.8</title>
<meta name="theme-color" content="#0f172a">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: 'Noto Sans KR', -apple-system, sans-serif;
  background: #0f1117; color: #e8eaf0;
  min-height: 100vh; -webkit-font-smoothing: antialiased;
  padding-bottom: 40px;
}

.hdr {
  padding: 12px 16px 14px;
  background: linear-gradient(180deg, #181b26, #0f1117);
  border-bottom: 1px solid #2a2e3d;
  position: sticky; top: 0; z-index: 50;
}
/* 최상단: 사용자 칩 + 뒤로 버튼 */
.hdr-toprow {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 10px; gap: 10px;
}
.user-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 10px; border-radius: 14px;
  background: rgba(34,197,94,.15); border: 1px solid rgba(34,197,94,.3);
  font-size: 12px; color: #22c55e; font-weight: 600;
  flex: 1; min-width: 0; max-width: calc(100% - 70px);
}
.user-chip.demo {
  background: rgba(245,158,11,.15); border-color: rgba(245,158,11,.3);
  color: #f59e0b;
}
.user-chip .chip-icon { font-size: 13px; flex-shrink: 0; }
.user-chip .chip-text {
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.logout {
  background: rgba(239,68,68,.15); border: 1px solid rgba(239,68,68,.3);
  color: #ef4444; padding: 5px 10px; border-radius: 8px;
  font-size: 11px; cursor: pointer; font-weight: 600; font-family: inherit;
  flex-shrink: 0;
}
/* 두 번째 행: 타이틀 */
.hdr-titlerow {
  margin-bottom: 10px;
}
.hdr-title { font-size: 17px; font-weight: 800; color: #e2b04a; }
.hdr-sub { font-size: 11px; color: #8b8fa3; margin-top: 2px; }

.machine-row {
  display: flex; gap: 8px; align-items: center;
  background: #1a1d27; border: 1px solid #2a2e3d; border-radius: 10px;
  padding: 8px 12px;
}
.machine-row label { font-size: 12px; color: #8b8fa3; font-weight: 600; }
.machine-row select {
  flex: 1; background: #0f1117; border: 1.5px solid #2a2e3d;
  color: #e8eaf0; padding: 8px 10px; border-radius: 8px;
  font-size: 13px; font-weight: 600; font-family: inherit; outline: none;
}
.machine-row select:focus { border-color: #4f8cff; }
.online-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; flex-shrink: 0; }
.online-dot.offline { background: #ef4444; }
.time-info { font-size: 11px; color: #8b8fa3; font-family: monospace; }

.refresh-btn {
  background: rgba(79,140,255,.15); border: 1px solid rgba(79,140,255,.3);
  color: #4f8cff; padding: 6px 10px; border-radius: 6px;
  font-size: 11px; cursor: pointer; font-weight: 600; font-family: inherit;
}
.refresh-btn:active { transform: scale(.95); }
.refresh-btn:disabled { opacity: .5; cursor: not-allowed; }

.wrap { padding: 14px; max-width: 800px; margin: 0 auto; }

.card {
  background: #1a1d27; border: 1px solid #2a2e3d; border-radius: 14px;
  padding: 14px; margin-bottom: 12px;
}
.card-title {
  font-size: 14px; font-weight: 700; margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px; color: #e8eaf0;
  flex-wrap: wrap;
}
.card-title .badge {
  background: rgba(79,140,255,.15); color: #4f8cff;
  padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600;
}
.attached-section .card-title { color: #22c55e; }
.attached-section .card-title .badge {
  background: rgba(34,197,94,.15); color: #22c55e;
}
.card-title .right-actions { margin-left: auto; }

.heat-card {
  border: 1.5px solid #2a2e3d; border-radius: 12px; padding: 12px;
  margin-bottom: 8px; cursor: pointer; transition: all .15s;
  background: #222633; position: relative;
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
}
.heat-card:active { transform: scale(.98); }
.heat-card:last-child { margin-bottom: 0; }
.heat-card:hover { border-color: #4f8cff; background: #2a2e3d; }

.heat-card.attached {
  background: linear-gradient(135deg, rgba(34,197,94,.15) 0%, rgba(34,197,94,.08) 100%);
  border-color: #22c55e;
}
.heat-card.attached:hover {
  background: linear-gradient(135deg, rgba(34,197,94,.22) 0%, rgba(34,197,94,.12) 100%);
}

.heat-card .info { flex: 1; min-width: 0; }
.heat-card .heat-no {
  font-weight: 700; font-size: 14px; color: #e8eaf0;
  margin-bottom: 3px;
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
}
.heat-card.attached .heat-no { color: #22c55e; }
.heat-card .heat-spec {
  font-size: 12px; color: #b8bccc; line-height: 1.4;
}
.heat-card .heat-meta {
  font-size: 10px; color: #5a5e72; margin-top: 3px;
}

.cert-badge {
  font-size: 9px; padding: 2px 6px; border-radius: 4px;
  background: rgba(34,197,94,.2); color: #22c55e;
  font-weight: 700; letter-spacing: .5px;
}

.heat-card .right {
  display: flex; flex-direction: column; gap: 4px; align-items: flex-end;
  flex-shrink: 0;
}
.heat-card .heat-qty {
  font-size: 12px; padding: 5px 10px; border-radius: 8px;
  background: rgba(79,140,255,.15); color: #4f8cff;
  font-weight: 700; white-space: nowrap;
}
.heat-card.attached .heat-qty {
  background: rgba(226,176,74,.15); color: #e2b04a;
}
.heat-card .heat-status {
  font-size: 10px; padding: 2px 6px; border-radius: 4px;
  background: #2a2e3d; color: #8b8fa3; font-weight: 600;
}
.heat-card.attached .heat-status {
  background: #22c55e; color: #0f1117;
}

.filter-row {
  display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; align-items: center;
}
.filter-label {
  font-size: 11px; color: #8b8fa3; font-weight: 600; min-width: 36px;
}
.filter-btn {
  background: #222633; border: 1.5px solid #2a2e3d;
  padding: 6px 12px; border-radius: 16px;
  font-size: 11px; font-weight: 600; cursor: pointer;
  color: #b8bccc; font-family: inherit;
  display: inline-flex; align-items: center; gap: 4px;
}
.filter-btn:hover { border-color: #4f8cff; }
.filter-btn.active {
  background: rgba(226,176,74,.15); color: #e2b04a;
  border-color: #e2b04a;
}
.filter-btn .count-tag {
  font-size: 9px; padding: 1px 5px; border-radius: 8px;
  background: rgba(255,255,255,.1); color: inherit; opacity: .8;
}

.period-filter .filter-btn.active {
  background: rgba(79,140,255,.2); color: #4f8cff;
  border-color: #4f8cff;
}

.empty {
  text-align: center; padding: 24px 16px; color: #5a5e72; font-size: 13px;
  background: #0f1117; border-radius: 10px; border: 2px dashed #2a2e3d;
}

.help-text {
  font-size: 11px; color: #8b8fa3; margin-top: 8px;
  padding: 8px 10px; background: rgba(79,140,255,.08);
  border-radius: 8px; border-left: 3px solid #4f8cff;
}

.error-box {
  font-size: 12px; color: #ef4444; margin-top: 8px;
  padding: 10px 12px; background: rgba(239,68,68,.08);
  border-radius: 8px; border-left: 3px solid #ef4444;
  word-break: break-word; line-height: 1.5;
}
.error-box strong { display: block; margin-bottom: 4px; }
.error-box small { color: #8b8fa3; font-size: 11px; }

.loading {
  text-align: center; padding: 30px 16px; color: #4f8cff; font-size: 13px;
}
.loading::before {
  content: '⏳'; display: inline-block; margin-right: 6px;
  animation: spin 1.2s linear infinite;
}
@keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }

.modal-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,.7);
  display: none; align-items: center; justify-content: center;
  z-index: 9998; padding: 16px;
}
.modal-bg.show { display: flex; }
.modal {
  background: #1a1d27; border: 1px solid #2a2e3d; border-radius: 16px;
  padding: 20px; width: 100%; max-width: 400px;
  max-height: 90vh; overflow-y: auto;
}
.modal h3 { margin-bottom: 6px; font-size: 16px; color: #e8eaf0; }
.modal .modal-sub {
  font-size: 12px; color: #8b8fa3; margin-bottom: 14px;
  padding-bottom: 10px; border-bottom: 1px solid #2a2e3d;
  line-height: 1.5;
}

.action-btn {
  width: 100%; padding: 14px; border: 1.5px solid #2a2e3d;
  background: #222633; border-radius: 10px; margin-bottom: 8px;
  cursor: pointer; text-align: left; transition: all .15s;
  display: flex; align-items: center; gap: 12px;
  color: #e8eaf0; font-family: inherit;
}
.action-btn:active { transform: scale(.98); }
.action-btn .icon { font-size: 22px; flex-shrink: 0; }
.action-btn .label-area { flex: 1; }
.action-btn .label-main { font-weight: 700; font-size: 13px; color: #e8eaf0; }
.action-btn .label-desc { font-size: 11px; color: #8b8fa3; margin-top: 2px; }

.action-btn.action-normal { border-color: rgba(34,197,94,.4); }
.action-btn.action-normal:hover { background: rgba(34,197,94,.1); border-color: #22c55e; }
.action-btn.action-consumed { border-color: rgba(245,158,11,.4); }
.action-btn.action-consumed:hover { background: rgba(245,158,11,.1); border-color: #f59e0b; }
.action-btn.action-error { border-color: rgba(239,68,68,.4); }
.action-btn.action-error:hover { background: rgba(239,68,68,.1); border-color: #ef4444; }

.consumed-input {
  display: none; padding: 12px; background: rgba(245,158,11,.08);
  border-radius: 10px; margin-top: 6px; margin-bottom: 8px;
  border: 1px solid rgba(245,158,11,.3);
}
.consumed-input.show { display: block; }
.consumed-input label {
  font-size: 11px; color: #f59e0b; font-weight: 600;
  display: block; margin-bottom: 6px;
}
.consumed-input input {
  width: 100%; padding: 10px; background: #0f1117;
  border: 1.5px solid rgba(245,158,11,.5);
  border-radius: 8px; font-size: 14px; color: #e8eaf0; font-family: inherit;
  outline: none;
}
.consumed-input input:focus { border-color: #f59e0b; }

.btn {
  border: none; padding: 10px 16px; border-radius: 8px;
  font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
}
.btn-cancel {
  background: #2a2e3d; color: #e8eaf0;
  width: 100%; padding: 12px;
}
.btn-confirm {
  width: 100%; margin-top: 8px;
  background: #f59e0b; color: #0f1117;
}

.toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: #2a2e3d; color: #e8eaf0;
  padding: 12px 20px; border-radius: 10px;
  font-size: 13px; font-weight: 600;
  z-index: 9999; display: none;
  box-shadow: 0 4px 12px rgba(0,0,0,.5);
  max-width: 90%; border: 1px solid #4f8cff;
}
.toast.show { display: block; animation: fadeIn .2s; }
.toast.success { border-color: #22c55e; color: #22c55e; }
.toast.error { border-color: #ef4444; color: #ef4444; }
@keyframes fadeIn {
  from { opacity: 0; transform: translate(-50%, 10px); }
  to { opacity: 1; transform: translate(-50%, 0); }
}

@media (max-width: 480px) {
  .hdr-title { font-size: 16px; }
  .heat-card .heat-no { font-size: 13px; }
  .user-chip { font-size: 11px; }
}
</style>
</head>
<body>

<div class="hdr">
  <!-- 최상단: 사용자 칩 + 뒤로 -->
  <div class="hdr-toprow">
    <span class="user-chip" id="userChip">
      <span class="chip-icon">👤</span>
      <span class="chip-text" id="userChipText">로그인 확인중...</span>
    </span>
    <button class="logout" onclick="goBack()">← 뒤로</button>
  </div>

  <!-- 두 번째: 타이틀 -->
  <div class="hdr-titlerow">
    <div class="hdr-title">📦 소재 장착 관리</div>
    <div class="hdr-sub">v1.8 · IQC 통과 코일 · HEAT 추적</div>
  </div>

  <!-- 세 번째: 호기 + 시계 -->
  <div class="machine-row">
    <label>호기</label>
    <select id="machineSelect">
      <option value="11호기">11호기</option>
      <option value="12호기">12호기</option>
      <option value="13호기">13호기</option>
      <option value="14호기">14호기</option>
      <option value="15호기">15호기</option>
    </select>
    <span class="online-dot" id="onlineDot" title="온라인 상태"></span>
    <span class="time-info" id="currentTime">--:--</span>
  </div>
</div>

<div class="wrap">

  <div class="card attached-section">
    <h2 class="card-title">
      🟢 현재 장착중
      <span class="badge" id="attachedCount">0</span>
    </h2>
    <div id="attachedList"></div>
    <div class="help-text">💡 장착된 카드를 한 번 더 누르면 탈착/소진 처리</div>
  </div>

  <div class="card">
    <h2 class="card-title">
      📦 IQC 통과 코일
      <span class="badge" id="availableCount">0</span>
      <div class="right-actions">
        <button class="refresh-btn" id="refreshBtn" onclick="loadInspectionData()">🔄 새로고침</button>
      </div>
    </h2>

    <div class="filter-row period-filter">
      <span class="filter-label">기간</span>
      <button class="filter-btn" data-filter="period" data-value="7">최근 1주</button>
      <button class="filter-btn active" data-filter="period" data-value="30">최근 1개월</button>
      <button class="filter-btn" data-filter="period" data-value="60">최근 2개월</button>
      <button class="filter-btn" data-filter="period" data-value="180">최근 6개월</button>
      <button class="filter-btn" data-filter="period" data-value="0">전체</button>
    </div>

    <div class="filter-row" id="typeFilterRow">
      <span class="filter-label">재질</span>
      <button class="filter-btn active" data-filter="type" data-value="ALL">전체</button>
    </div>

    <div class="filter-row" id="widthFilterRow">
      <span class="filter-label">폭</span>
      <button class="filter-btn active" data-filter="width" data-value="ALL">전체</button>
    </div>

    <div id="availableList"></div>
    <div class="help-text" id="filterHelpText">
      💡 IQC 검사 OK 판정된 코일만 표시 · 입고일 순(FIFO) 정렬
    </div>
  </div>

</div>

<div class="modal-bg" id="detachModalBg">
  <div class="modal">
    <h3 id="detachTitle">📦 HEAT 처리</h3>
    <div class="modal-sub" id="detachSub"></div>

    <button class="action-btn action-normal" onclick="processDetach('normal')">
      <span class="icon">🔓</span>
      <div class="label-area">
        <div class="label-main">정상 탈착</div>
        <div class="label-desc">잔량 그대로 유지 / 재사용 가능</div>
      </div>
    </button>

    <button class="action-btn action-consumed" onclick="toggleConsumedInput()">
      <span class="icon">🔥</span>
      <div class="label-area">
        <div class="label-main">소진 완료</div>
        <div class="label-desc">코일을 다 사용함 (자투리 입력)</div>
      </div>
    </button>
    <div class="consumed-input" id="consumedInput">
      <label>자투리 무게 (kg)</label>
      <input type="number" id="remainKg" placeholder="예: 5.5  (없으면 0)" step="0.1" min="0">
      <button class="btn btn-confirm" onclick="processDetach('consumed')">소진 확정</button>
    </div>

    <button class="action-btn action-error" onclick="processDetach('wrong_attach')">
      <span class="icon">⚠️</span>
      <div class="label-area">
        <div class="label-main">잘못된 장착</div>
        <div class="label-desc">다른 호기/소재였음</div>
      </div>
    </button>

    <button class="action-btn action-error" onclick="processDetach('wrong_receipt')">
      <span class="icon">⚠️</span>
      <div class="label-area">
        <div class="label-main">잘못된 입고</div>
        <div class="label-desc">입고 데이터 자체가 오류</div>
      </div>
    </button>

    <button class="action-btn action-error" onclick="processDetach('defect')">
      <span class="icon">⚠️</span>
      <div class="label-area">
        <div class="label-main">불량 소재</div>
        <div class="label-desc">품질 이상 발견 → 블랙리스트</div>
      </div>
    </button>

    <button class="btn btn-cancel" onclick="closeDetachModal()">취소</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   Supabase 설정
   ============================================================ */
const SB_URL = 'https://omngtyewdaqpphnzeate.supabase.co';
const SB_KEY = 'sb_publishable_9j2YkkL-7ul1TrhH-NjVdQ_vWDG2-1D';

const TBL_INSP_CERTS = 'inspection_certs';   // IQC 입고+검사 통합 테이블
const TBL_ATTACH     = 'material_attachment'; // 장착 이력
const TBL_EXCLUDED   = 'excluded_heats';      // 블랙리스트

/* ============================================================
   부서 매핑 (admin_pin 동일)
   ============================================================ */
const PIN_DEPT_MAP = {
  '0': '대표이사', '1': '개발팀', '2': '생산팀',
  '3': '설계팀', '4': '품질관리팀', '5': '영업관리팀', '6': '공장장'
};

/* ============================================================
   로그인 정보
   ============================================================ */
let currentUser = {
  user_id: null, user_name: null, user_dept: null,
  user_position: null, user_pin: null, is_demo: false
};

function loadCurrentUser() {
  try {
    const auth = JSON.parse(localStorage.getItem('user_pin_auth') || 'null');
    if (auth && auth.name && (!auth.exp || Date.now() < auth.exp)) {
      currentUser.user_id = auth.emp_id || auth.id || null;
      currentUser.user_name = auth.name;
      currentUser.user_dept = auth.dept || (auth.pin ? PIN_DEPT_MAP[String(auth.pin)[0]] : null);
      currentUser.user_position = auth.position || null;
      currentUser.user_pin = auth.pin || null;
      renderUserChip(true);
      return;
    }
  } catch (e) {}

  const lsId = localStorage.getItem('mes_user_id') || sessionStorage.getItem('mes_user_id');
  const lsName = localStorage.getItem('mes_user_name') || sessionStorage.getItem('mes_user_name');
  if (lsName) {
    currentUser.user_id = lsId;
    currentUser.user_name = lsName;
    currentUser.user_dept = localStorage.getItem('mes_user_dept') || sessionStorage.getItem('mes_user_dept');
    currentUser.user_position = localStorage.getItem('mes_user_position') || null;
    currentUser.user_pin = localStorage.getItem('mes_user_pin') || null;
    renderUserChip(true);
    return;
  }

  const urlParams = new URLSearchParams(location.search);
  const urlName = urlParams.get('user_name');
  if (urlName) {
    currentUser.user_id = urlParams.get('user_id') || urlParams.get('emp_id') || null;
    currentUser.user_name = urlName;
    const urlPin = urlParams.get('pin');
    currentUser.user_dept =
      urlParams.get('user_dept') || urlParams.get('dept') ||
      (urlPin ? PIN_DEPT_MAP[String(urlPin)[0]] : null);
    currentUser.user_position = urlParams.get('position') || null;
    currentUser.user_pin = urlPin || null;
    renderUserChip(true);
    return;
  }

  currentUser = {
    user_id: 'GUEST', user_name: '게스트',
    user_dept: null, user_position: null,
    user_pin: null, is_demo: true
  };
  renderUserChip(false);
}

function renderUserChip(isLogged) {
  const chip = document.getElementById('userChip');
  const txt = document.getElementById('userChipText');

  let label = currentUser.user_name || '게스트';
  if (currentUser.user_dept) {
    label += ` · ${currentUser.user_dept}`;
  }
  txt.textContent = label;

  if (isLogged) {
    chip.classList.remove('demo');
  } else {
    chip.classList.add('demo');
  }
}

function goBack() {
  if (history.length > 1) history.back();
  else location.href = '/';
}

/* ============================================================
   상태
   ============================================================ */
let state = {
  machineCode: '11호기',
  filter: { type: 'ALL', width: 'ALL', period: '30' },
  attachments: [],
  detached: []
};

let availableMaterials = [];
let currentDetachTarget = null;

/* ============================================================
   IQC 통과 코일 추출 (inspection_certs.final_judge = 'OK')
   ============================================================ */
function buildAvailableMaterials(certsList, excludedHeats) {
  const result = [];
  const excludedSet = new Set(excludedHeats || []);

  certsList.forEach(c => {
    if (excludedSet.has(c.heat_no)) return;
    if (!c.heat_no) return; // HEAT 없는 row 제외

    // final_judge가 'OK'인 것만
    const judge = (c.final_judge || '').toString().trim().toUpperCase();
    if (judge !== 'OK') return;

    result.push({
      cert_id: c.id,
      heat_no: c.heat_no,
      lot_no: c.lot_no || c.lots_detail || '',
      supplier: c.supplier || '',
      vendor_site_id: c.vendor_site_id || '',
      material_type: c.material_type || '',
      thickness: parseFloat(c.thickness) || 0,
      width: parseFloat(c.width_mm) || 0,
      receipt_kg: parseFloat(c.weight) || 0,
      coil_count: parseInt(c.coil_count) || 1,
      used_kg: 0,
      receipt_date: c.receipt_date || c.recv_date || '',
      has_millsheet: c.has_millsheet || false,
      // cert_no 필드가 없으므로 lot_no 또는 id를 표시용으로 사용
      cert_no: c.lot_no ? c.lot_no.substring(0, 16) : ('CERT-' + c.id)
    });
  });

  return result;
}

function getStockKg(m) {
  return Math.max(0, (m.receipt_kg || 0) - (m.used_kg || 0));
}

/* ============================================================
   기간 필터
   ============================================================ */
function getPeriodStartDate(days) {
  if (!days || days === '0') return null;
  const d = new Date();
  d.setDate(d.getDate() - parseInt(days));
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${yyyy}-${mm}-${dd}`;
}

function getPeriodLabel(days) {
  const labels = {
    '7': '최근 1주', '30': '최근 1개월',
    '60': '최근 2개월', '180': '최근 6개월', '0': '전체'
  };
  return labels[days] || '전체';
}

/* ============================================================
   동적 필터 (재질/폭) - 입고된 데이터에서 추출
   ============================================================ */
function getDynamicFilterOptions() {
  const typeMap = new Map();
  const widthMap = new Map();

  availableMaterials.forEach(m => {
    if (m.material_type) {
      typeMap.set(m.material_type, (typeMap.get(m.material_type) || 0) + 1);
    }
    if (m.width) {
      const w = String(m.width);
      widthMap.set(w, (widthMap.get(w) || 0) + 1);
    }
  });

  const types = Array.from(typeMap.entries()).sort((a, b) => a[0].localeCompare(b[0]));
  const widths = Array.from(widthMap.entries()).sort((a, b) => parseFloat(a[0]) - parseFloat(b[0]));

  return { types, widths };
}

function renderDynamicFilters() {
  const { types, widths } = getDynamicFilterOptions();
  const totalCount = availableMaterials.length;

  const typeRow = document.getElementById('typeFilterRow');
  let typeHTML = `<span class="filter-label">재질</span>`;
  typeHTML += `<button class="filter-btn ${state.filter.type === 'ALL' ? 'active' : ''}" data-filter="type" data-value="ALL">전체 <span class="count-tag">${totalCount}</span></button>`;
  types.forEach(([type, cnt]) => {
    const active = state.filter.type === type ? 'active' : '';
    typeHTML += `<button class="filter-btn ${active}" data-filter="type" data-value="${type}">${type} <span class="count-tag">${cnt}</span></button>`;
  });
  typeRow.innerHTML = typeHTML;

  if (state.filter.type !== 'ALL' && !types.find(([t]) => t === state.filter.type)) {
    state.filter.type = 'ALL';
  }

  let widthsForType = widths;
  if (state.filter.type !== 'ALL') {
    const widthMap2 = new Map();
    availableMaterials.forEach(m => {
      if (m.material_type === state.filter.type && m.width) {
        const w = String(m.width);
        widthMap2.set(w, (widthMap2.get(w) || 0) + 1);
      }
    });
    widthsForType = Array.from(widthMap2.entries()).sort((a,b) => parseFloat(a[0]) - parseFloat(b[0]));
  }

  const widthRow = document.getElementById('widthFilterRow');
  const widthTotalCount = state.filter.type === 'ALL'
    ? totalCount
    : availableMaterials.filter(m => m.material_type === state.filter.type).length;
  let widthHTML = `<span class="filter-label">폭</span>`;
  widthHTML += `<button class="filter-btn ${state.filter.width === 'ALL' ? 'active' : ''}" data-filter="width" data-value="ALL">전체 <span class="count-tag">${widthTotalCount}</span></button>`;
  widthsForType.forEach(([w, cnt]) => {
    const active = state.filter.width === w ? 'active' : '';
    widthHTML += `<button class="filter-btn ${active}" data-filter="width" data-value="${w}">${w} <span class="count-tag">${cnt}</span></button>`;
  });
  widthRow.innerHTML = widthHTML;

  if (state.filter.width !== 'ALL' && !widthsForType.find(([w]) => w === state.filter.width)) {
    state.filter.width = 'ALL';
  }

  bindFilterButtons();
}

function bindFilterButtons() {
  document.querySelectorAll('.filter-btn[data-filter="type"], .filter-btn[data-filter="width"]').forEach(btn => {
    btn.onclick = () => {
      const filter = btn.dataset.filter;
      const value = btn.dataset.value;
      state.filter[filter] = value;
      saveToLocal();

      if (filter === 'type') {
        state.filter.width = 'ALL';
      }

      renderDynamicFilters();
      renderAvailable();
    };
  });
}

/* ============================================================
   초기화
   ============================================================ */
window.addEventListener('DOMContentLoaded', () => {
  loadCurrentUser();
  updateClock();
  setInterval(updateClock, 1000);
  loadFromLocal();
  setupHeader();
  setupOnline();
  setupPeriodFilter();
  loadInspectionData();
  loadAttachmentsFromServer();
});

function updateClock() {
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  document.getElementById('currentTime').textContent = `${hh}:${mm}`;
}

function setupHeader() {
  document.getElementById('machineSelect').value = state.machineCode;
  document.getElementById('machineSelect').addEventListener('change', (e) => {
    state.machineCode = e.target.value;
    saveToLocal();
    render();
  });
}

function setupPeriodFilter() {
  document.querySelectorAll('.filter-btn[data-filter="period"]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn[data-filter="period"]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.filter.period = btn.dataset.value;
      saveToLocal();
      loadInspectionData();
    });
  });

  const periodBtn = document.querySelector(`.filter-btn[data-filter="period"][data-value="${state.filter.period}"]`);
  if (periodBtn) {
    document.querySelectorAll('.filter-btn[data-filter="period"]').forEach(b => b.classList.remove('active'));
    periodBtn.classList.add('active');
  }
}

function setupOnline() {
  function update() {
    const dot = document.getElementById('onlineDot');
    if (navigator.onLine) {
      dot.classList.remove('offline');
      dot.title = '온라인';
    } else {
      dot.classList.add('offline');
      dot.title = '오프라인';
    }
  }
  window.addEventListener('online', update);
  window.addEventListener('offline', update);
  update();
}

/* ============================================================
   IQC 통과 코일 데이터 로드 (Supabase)
   inspection_certs 단일 테이블에서 final_judge='OK' 조회
   ============================================================ */
async function loadInspectionData() {
  const list = document.getElementById('availableList');
  const refreshBtn = document.getElementById('refreshBtn');
  const helpText = document.getElementById('filterHelpText');

  list.innerHTML = '<div class="loading">IQC 통과 코일 조회중...</div>';
  refreshBtn.disabled = true;
  refreshBtn.textContent = '⏳ 조회중';

  try {
    const periodDays = state.filter.period;
    const startDate = getPeriodStartDate(periodDays);
    const periodLabel = getPeriodLabel(periodDays);

    // inspection_certs 조회: final_judge='OK' + 기간 필터
    let certsPath = `${TBL_INSP_CERTS}?select=id,supplier,vendor_site_id,material_type,thickness,width_mm,lot_no,lots_detail,heat_no,coil_count,weight,receipt_date,recv_date,final_judge,has_millsheet,created_at&final_judge=eq.OK&order=receipt_date.desc&limit=2000`;
    if (startDate) {
      certsPath += `&receipt_date=gte.${startDate}`;
    }

    // 블랙리스트
    const excludedPath = `${TBL_EXCLUDED}?select=heat_no&is_active=eq.true&limit=5000`;

    const [certs, excludedRows] = await Promise.all([
      sbReq('GET', certsPath),
      sbReq('GET', excludedPath).catch(() => [])
    ]);

    const excludedHeats = (excludedRows || []).map(r => r.heat_no);
    availableMaterials = buildAvailableMaterials(certs || [], excludedHeats);

    helpText.innerHTML = `💡 IQC 통과 코일 (final_judge=OK) · ${periodLabel} 입고 기준 · 입고일 순(FIFO)`;

    render();
    showToast(`✅ ${availableMaterials.length}건 IQC 통과 코일 (${periodLabel})`, 'success');
  } catch (e) {
    console.error('IQC 데이터 로드 실패:', e);
    const isFetchError = (e.message || '').toLowerCase().includes('failed to fetch');
    list.innerHTML = `
      <div class="empty">데이터를 불러올 수 없습니다</div>
      <div class="error-box">
        <strong>오류:</strong> ${e.message}<br>
        ${isFetchError ? `
          <small>
            ▸ 인터넷 연결을 확인하세요<br>
            ▸ Supabase 접속 가능한 네트워크인지 확인<br>
            ▸ 회사 방화벽이 supabase.co를 막고 있을 수 있습니다
          </small>
        ` : '<small>네트워크 또는 Supabase 연결을 확인하세요</small>'}
      </div>
    `;
    showToast('❌ ' + e.message, 'error');
  } finally {
    refreshBtn.disabled = false;
    refreshBtn.textContent = '🔄 새로고침';
  }
}

/* ============================================================
   현재 장착 정보 서버에서 로드 (다른 PC/세션과 동기화)
   ============================================================ */
async function loadAttachmentsFromServer() {
  if (!navigator.onLine) return;
  try {
    const data = await sbReq('GET',
      `${TBL_ATTACH}?select=*&status=eq.attached&order=attach_time.desc&limit=500`);
    if (Array.isArray(data)) {
      // 서버 데이터로 동기화 (id를 attach_id로 매핑)
      state.attachments = data.map(d => ({
        id: `SRV-${d.id}`,
        server_id: d.id,
        machine_code: d.machine_code,
        cert_id: d.cert_id,
        cert_no: d.cert_no,
        heat_no: d.heat_no,
        lot_no: d.lot_no,
        supplier: d.supplier,
        material_type: d.material_type,
        thickness: d.thickness,
        width: d.width,
        attach_time: d.attach_time,
        attach_user_id: d.attach_user_id,
        attach_user_name: d.attach_user_name,
        attach_user_dept: d.attach_user_dept,
        attach_qty_kg: d.attach_qty_kg,
        status: 'attached'
      }));
      saveToLocal();
      render();
    }
  } catch (e) {
    console.warn('장착 정보 동기화 실패:', e);
  }
}

/* ============================================================
   렌더링
   ============================================================ */
function render() {
  renderAttached();
  renderDynamicFilters();
  renderAvailable();
}

function renderAttached() {
  const list = document.getElementById('attachedList');
  const attached = state.attachments.filter(a => a.machine_code === state.machineCode);
  document.getElementById('attachedCount').textContent = attached.length + '건';

  if (attached.length === 0) {
    list.innerHTML = '<div class="empty">현재 장착된 소재가 없습니다<br>아래 코일을 눌러 장착하세요</div>';
    return;
  }

  list.innerHTML = attached.map(a => `
    <div class="heat-card attached" onclick="onAttachedClick('${a.id}')">
      <div class="info">
        <div class="heat-no">
          ✅ ${a.heat_no}
          ${a.cert_no ? `<span class="cert-badge">${a.cert_no}</span>` : ''}
        </div>
        <div class="heat-spec">${a.material_type} ${a.thickness}t × ${a.width}W · LOT ${a.lot_no || '-'}</div>
        <div class="heat-meta">장착: ${formatTime(a.attach_time)} · ${a.attach_user_name}${a.attach_user_dept ? ' (' + a.attach_user_dept + ')' : ''}</div>
      </div>
      <div class="right">
        <div class="heat-qty">${a.attach_qty_kg}kg</div>
        <div class="heat-status">장착중</div>
      </div>
    </div>
  `).join('');
}

function renderAvailable() {
  const list = document.getElementById('availableList');

  const attachedHeats = new Set(state.attachments.map(a => a.heat_no));
  const consumedHeats = new Set(state.detached.filter(d => d.detach_type === 'consumed').map(d => d.heat_no));
  const localExcluded = new Set(state.detached.filter(d => d.detach_type === 'wrong_receipt' || d.detach_type === 'defect').map(d => d.heat_no));

  let filtered = availableMaterials.filter(m =>
    getStockKg(m) > 0 &&
    !attachedHeats.has(m.heat_no) &&
    !consumedHeats.has(m.heat_no) &&
    !localExcluded.has(m.heat_no)
  );

  if (state.filter.type !== 'ALL') filtered = filtered.filter(m => m.material_type === state.filter.type);
  if (state.filter.width !== 'ALL') filtered = filtered.filter(m => String(m.width) === state.filter.width);

  filtered.sort((a,b) => (a.receipt_date || '').localeCompare(b.receipt_date || ''));

  document.getElementById('availableCount').textContent = filtered.length + '건';

  if (filtered.length === 0) {
    list.innerHTML = `
      <div class="empty">
        조건에 맞는 IQC 통과 코일이 없습니다<br>
        <small>· 기간/재질/폭 필터를 조정해보세요<br>
        · IQC 검사가 필요하면 품질팀에 요청</small>
      </div>
    `;
    return;
  }

  list.innerHTML = filtered.map(m => {
    const stock = getStockKg(m);
    const used = m.used_kg || 0;
    const usedBadge = used > 0 ? `<span style="font-size:10px; color:#f59e0b; margin-left:4px;">사용 ${used}kg</span>` : '';
    return `
      <div class="heat-card" onclick="onAvailableClick('${m.heat_no}')">
        <div class="info">
          <div class="heat-no">
            ${m.heat_no}
            <span class="cert-badge">${m.cert_no || 'IQC OK'}</span>
          </div>
          <div class="heat-spec">${m.material_type} ${m.thickness}t × ${m.width}W · LOT ${m.lot_no || '-'}</div>
          <div class="heat-meta">${m.supplier} · 입고 ${m.receipt_date}</div>
        </div>
        <div class="right">
          <div class="heat-qty">${stock}kg ${usedBadge}</div>
        </div>
      </div>
    `;
  }).join('');
}

function formatTime(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  const hh = String(d.getHours()).padStart(2,'0');
  const mm = String(d.getMinutes()).padStart(2,'0');
  return `${hh}:${mm}`;
}

/* ============================================================
   장착 (한 번 탭)
   ============================================================ */
async function onAvailableClick(heatNo) {
  const mat = availableMaterials.find(m => m.heat_no === heatNo);
  if (!mat) return;

  if (state.attachments.find(a => a.machine_code === state.machineCode && a.heat_no === heatNo)) {
    showToast('이미 장착된 HEAT입니다', 'error');
    return;
  }

  const stock = getStockKg(mat);
  const now = nowKST();

  const attachment = {
    id: `ATT-${Date.now()}`,
    machine_code: state.machineCode,
    cert_id: mat.cert_id,
    cert_no: mat.cert_no,
    heat_no: mat.heat_no,
    lot_no: mat.lot_no,
    supplier: mat.supplier,
    material_type: mat.material_type,
    thickness: mat.thickness,
    width: mat.width,
    attach_time: now,
    attach_user_id: currentUser.user_id,
    attach_user_name: currentUser.user_name,
    attach_user_dept: currentUser.user_dept,
    attach_qty_kg: stock,
    status: 'attached'
  };

  state.attachments.push(attachment);
  saveToLocal();
  render();
  showToast(`✅ ${mat.heat_no} → ${state.machineCode}`, 'success');

  // 서버 동기화
  const serverId = await syncToServer(attachment, 'INSERT');
  if (serverId) {
    attachment.server_id = serverId;
    saveToLocal();
  }
}

/* ============================================================
   탈착 모달
   ============================================================ */
function onAttachedClick(id) {
  const att = state.attachments.find(a => a.id === id);
  if (!att) return;
  currentDetachTarget = att;

  document.getElementById('detachTitle').textContent = `📦 ${att.heat_no}`;
  document.getElementById('detachSub').innerHTML = `
    ${att.material_type} ${att.thickness}t × ${att.width}W<br>
    ${att.cert_no ? '성적서 ' + att.cert_no + ' · ' : ''}${att.machine_code} 장착중 · 잔량 ${att.attach_qty_kg}kg
  `;
  document.getElementById('consumedInput').classList.remove('show');
  document.getElementById('remainKg').value = '';
  document.getElementById('detachModalBg').classList.add('show');
}

function closeDetachModal() {
  document.getElementById('detachModalBg').classList.remove('show');
  currentDetachTarget = null;
}

function toggleConsumedInput() {
  const el = document.getElementById('consumedInput');
  el.classList.toggle('show');
  if (el.classList.contains('show')) {
    document.getElementById('remainKg').focus();
  }
}

async function processDetach(type) {
  if (!currentDetachTarget) return;

  let remainKg = null;
  if (type === 'consumed') {
    const v = document.getElementById('remainKg').value;
    if (v === '' || v === null) {
      showToast('자투리 무게를 입력하세요 (없으면 0)', 'error');
      return;
    }
    remainKg = parseFloat(v);
    if (isNaN(remainKg) || remainKg < 0) {
      showToast('자투리 무게가 올바르지 않습니다', 'error');
      return;
    }
  }

  const att = currentDetachTarget;
  const now = nowKST();

  state.attachments = state.attachments.filter(a => a.id !== att.id);

  const detachRecord = {
    ...att,
    detach_time: now,
    detach_user_id: currentUser.user_id,
    detach_user_name: currentUser.user_name,
    detach_user_dept: currentUser.user_dept,
    detach_type: type,
    detach_remain_kg: remainKg,
    status: type === 'consumed' ? 'consumed' : 'detached'
  };
  state.detached.push(detachRecord);

  saveToLocal();
  closeDetachModal();
  render();

  const typeLabels = {
    normal: '🔓 정상 탈착 완료',
    consumed: `🔥 소진 완료 (자투리 ${remainKg}kg)`,
    wrong_attach: '⚠️ 잘못된 장착으로 기록',
    wrong_receipt: '⚠️ 잘못된 입고 → 블랙리스트',
    defect: '⚠️ 불량 소재 → 블랙리스트'
  };
  showToast(typeLabels[type] || '처리 완료', 'success');

  await syncToServer(detachRecord, 'UPDATE');
}

/* ============================================================
   시간/저장
   ============================================================ */
function nowKST() {
  const now = new Date();
  const offset = 9 * 60;
  const local = new Date(now.getTime() + (offset - now.getTimezoneOffset()) * 60000);
  return local.toISOString().replace('Z', '+09:00');
}

function saveToLocal() {
  localStorage.setItem('material_attach_state', JSON.stringify(state));
}

function loadFromLocal() {
  const raw = localStorage.getItem('material_attach_state');
  if (!raw) return;
  try {
    const saved = JSON.parse(raw);
    state = { ...state, ...saved };
    if (!state.filter) state.filter = { type: 'ALL', width: 'ALL', period: '30' };
    if (!state.filter.period) state.filter.period = '30';
  } catch (e) { console.error(e); }
}

/* ============================================================
   Supabase 통신
   ============================================================ */
async function sbReq(method, path, body) {
  const headers = {
    'apikey': SB_KEY,
    'Authorization': 'Bearer ' + SB_KEY,
    'Content-Type': 'application/json'
  };
  if (method === 'POST' || method === 'PATCH') {
    headers['Prefer'] = 'return=representation';
  }
  const res = await fetch(`${SB_URL}/rest/v1/${path}`, {
    method, headers,
    body: body ? JSON.stringify(body) : undefined
  });
  if (!res.ok) {
    const txt = await res.text();
    throw new Error(`HTTP ${res.status}: ${txt.substring(0,200)}`);
  }
  if (method === 'DELETE' || res.status === 204) return null;
  const ct = res.headers.get('content-type') || '';
  return ct.includes('application/json') ? await res.json() : null;
}

async function syncToServer(record, op) {
  if (!navigator.onLine) {
    showToast('⚠️ 오프라인 - 로컬에만 저장됨', 'error');
    return null;
  }
  try {
    if (op === 'INSERT') {
      const result = await sbReq('POST', TBL_ATTACH, {
        machine_code: record.machine_code,
        cert_id: record.cert_id,
        cert_no: record.cert_no,
        heat_no: record.heat_no,
        lot_no: record.lot_no,
        supplier: record.supplier,
        material_type: record.material_type,
        thickness: record.thickness,
        width: record.width,
        attach_time: record.attach_time,
        attach_user_id: record.attach_user_id,
        attach_user_name: record.attach_user_name,
        attach_user_dept: record.attach_user_dept,
        attach_qty_kg: record.attach_qty_kg,
        status: 'attached'
      });
      if (Array.isArray(result) && result[0] && result[0].id) {
        return result[0].id;
      }
      return null;
    } else if (op === 'UPDATE') {
      // server_id가 있으면 그걸로, 없으면 machine_code+heat_no+attached로 매칭
      let path;
      if (record.server_id) {
        path = `${TBL_ATTACH}?id=eq.${record.server_id}`;
      } else {
        path = `${TBL_ATTACH}?machine_code=eq.${encodeURIComponent(record.machine_code)}&heat_no=eq.${encodeURIComponent(record.heat_no)}&status=eq.attached`;
      }
      await sbReq('PATCH', path, {
        detach_time: record.detach_time,
        detach_user_id: record.detach_user_id,
        detach_user_name: record.detach_user_name,
        detach_user_dept: record.detach_user_dept,
        detach_type: record.detach_type,
        detach_remain_kg: record.detach_remain_kg,
        status: record.status
      });

      // 잘못된 입고/불량 → excluded_heats 자동 추가
      if (record.detach_type === 'wrong_receipt' || record.detach_type === 'defect') {
        try {
          await sbReq('POST', TBL_EXCLUDED, {
            heat_no: record.heat_no,
            reason: record.detach_type,
            excluded_at: record.detach_time,
            excluded_by_id: record.detach_user_id,
            excluded_by_name: record.detach_user_name,
            excluded_by_dept: record.detach_user_dept,
            is_active: true
          });
        } catch (e) {
          console.warn('excluded_heats 추가 실패:', e);
        }
      }
      return null;
    }
  } catch (e) {
    console.error('[SYNC ERROR]', e);
    showToast('서버 동기화 실패: ' + e.message, 'error');
    return null;
  }
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type || '');
  setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
