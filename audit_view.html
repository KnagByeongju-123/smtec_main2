<!DOCTYPE html>
<html lang="ko">
<head>
<script src="audit.js?v=7"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>접속·수정·인쇄 기록 조회</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Malgun Gothic',sans-serif;background:#f4f6f9;color:#1b1f2a;font-size:13px}
header{background:#1b3a8c;color:#fff;padding:12px 16px;font-size:17px;font-weight:800}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:end;padding:12px 16px;background:#fff;border-bottom:1px solid #dde3ec}
.bar label{display:flex;flex-direction:column;font-size:11px;color:#555;gap:3px}
.bar input,.bar select{font-size:13px;padding:6px 8px;border:1px solid #c7d0e0;border-radius:5px}
.bar button{padding:7px 14px;border:0;border-radius:5px;background:#1b3a8c;color:#fff;font-weight:700;cursor:pointer}
.bar button.sub{background:#e3e8f0;color:#1b1f2a}
#msg{padding:8px 16px;color:#555}
.wrap{padding:0 16px 16px;overflow:auto}
table{border-collapse:collapse;width:100%;background:#fff;min-width:980px}
th,td{border:1px solid #dde3ec;padding:5px 7px;text-align:left;vertical-align:top}
th{background:#eef2fa;position:sticky;top:0}
td.k{font-weight:700;white-space:nowrap}
.k.print{color:#c0392b}.k.edit{color:#b7791f}.k.open{color:#1b3a8c}.k.login{color:#2c7a3f}
td.d{font-family:Consolas,monospace;font-size:11px;color:#444;max-width:420px;word-break:break-all}
</style>
</head>
<body>
<header>접속·수정·인쇄 기록 조회</header>
<div class="bar">
  <label>관리자 PIN<input id="pin" type="password" inputmode="numeric" maxlength="8" style="width:90px"></label>
  <label>시작일<input id="from" type="date"></label>
  <label>종료일<input id="to" type="date"></label>
  <label>구분<select id="kind"><option value="">전체</option><option value="print">인쇄</option><option value="edit">수정</option><option value="open">접속</option><option value="login">로그인</option></select></label>
  <label>사용자<input id="user" style="width:90px"></label>
  <label>기기<select id="client"><option value="">전체</option><option value="PC">PC</option><option value="모바일">모바일</option><option value="태블릿">태블릿</option></select></label>
  <label>화면<input id="page" style="width:130px" placeholder="예: defect"></label>
  <label>건수<select id="limit"><option>300</option><option>1000</option><option>2000</option></select></label>
  <button id="go">조회</button>
  <button id="csv" class="sub">CSV 저장</button>
  <button id="bk" class="sub">일일 백업 파일</button>
</div>
<div id="msg">관리자 PIN 을 입력하고 조회하세요. (기록은 수정·삭제할 수 없습니다)</div>
<div id="bkWrap" class="wrap" style="display:none;margin-bottom:12px"><table><thead><tr><th>백업 파일 (매일 00:10 전날분 자동 저장)</th><th>크기</th><th>저장 시각</th><th>내려받기 (1시간 유효)</th></tr></thead><tbody id="bkTb"></tbody></table></div>
<div class="wrap"><table><thead><tr><th>일시</th><th>구분</th><th>사용자</th><th>부서</th><th>PC</th><th>기기</th><th>IP</th><th>화면</th><th>내용</th></tr></thead><tbody id="tb"></tbody></table></div>
<script>
const URL_ = 'https://omngtyewdaqpphnzeate.supabase.co/functions/v1/audit-log';
const KIND = { open: '접속', edit: '수정', print: '인쇄', login: '로그인', logout: '로그아웃' };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let rows = [];
const today = new Date(); const ymd = (d) => d.toISOString().slice(0, 10);
$('to').value = ymd(today); $('from').value = ymd(new Date(today - 7 * 864e5));

function detailText(r) {
  const d = r.detail || {};
  if (r.kind === 'edit') return `${d.method || ''} ${d.table || ''} ×${d.count || 0}${d.fail ? ' (실패 ' + d.fail + ')' : ''}` + (d.samples || []).map((s) => `\n${s.q || ''} ${s.body || ''}`).join('');
  if (r.kind === 'print') return `${d.via === 'page' ? '화면 인쇄' : '새 창 인쇄'}${d.loggedIn ? '' : ' · 미로그인(출력 차단)'}\n${d.mark || ''}`;
  return r.doc || '';
}
async function load() {
  $('msg').textContent = '조회 중…';
  const to = $('to').value ? new Date(new Date($('to').value).getTime() + 864e5).toISOString().slice(0, 10) : '';
  const r = await fetch(URL_, { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'list', pin: $('pin').value.trim(), from: $('from').value, to, kind: $('kind').value, user: $('user').value.trim(), client: $('client').value, page: $('page').value.trim(), limit: +$('limit').value }) });
  const j = await r.json().catch(() => ({}));
  if (!j.ok) { $('msg').textContent = j.error || '조회 실패'; rows = []; $('tb').innerHTML = ''; return; }
  rows = j.rows;
  $('msg').textContent = `${rows.length}건 (조회자: ${j.admin})`;
  $('tb').innerHTML = rows.map((x) => `<tr><td>${new Date(x.at).toLocaleString('ko-KR')}</td><td class="k ${x.kind}">${KIND[x.kind] || x.kind}</td><td>${esc(x.user_name)}${x.user_id ? ' (' + esc(x.user_id) + ')' : ''}</td><td>${esc(x.dept)}</td><td>${esc(x.device)}</td><td>${esc(x.client)}</td><td>${esc(x.ip)}</td><td>${esc(x.title || x.page)}<br><small>${esc(x.page)}</small></td><td class="d">${esc(detailText(x)).replace(/\n/g, '<br>')}</td></tr>`).join('');
}
$('go').onclick = load;
$('pin').addEventListener('keydown', (e) => { if (e.key === 'Enter') load(); });
$('bk').onclick = async () => {
  $('msg').textContent = '백업 파일 조회 중…';
  const r = await fetch(URL_, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'backups', pin: $('pin').value.trim(), months: 6 }) });
  const j = await r.json().catch(() => ({}));
  if (!j.ok) { $('msg').textContent = j.error || '백업 조회 실패'; return; }
  $('msg').textContent = `백업 파일 ${j.files.length}개 (최근 6개월)`;
  $('bkWrap').style.display = '';
  $('bkTb').innerHTML = j.files.length ? j.files.map((f) => `<tr><td>${esc(f.path)}</td><td>${f.size ? (f.size / 1024).toFixed(1) + ' KB' : '-'}</td><td>${f.updated ? new Date(f.updated).toLocaleString('ko-KR') : '-'}</td><td>${f.url ? `<a href="${esc(f.url)}" target="_blank" rel="noopener">${f.path.endsWith('.csv') ? '엑셀(CSV)' : 'JSON'} 받기</a>` : '-'}</td></tr>`).join('') : '<tr><td colspan="4">백업 파일이 없습니다</td></tr>';
};
$('csv').onclick = () => {
  if (!rows.length) return;
  const head = ['일시', '구분', '사용자', 'ID', '부서', 'PC', '기기', 'IP', '화면', '파일', '내용'];
  const q = (s) => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"';
  const lines = rows.map((x) => [new Date(x.at).toLocaleString('ko-KR'), KIND[x.kind] || x.kind, x.user_name, x.user_id, x.dept, x.device, x.client, x.ip, x.title, x.page, detailText(x)].map(q).join(','));
  const blob = new Blob(['﻿' + [head.join(','), ...lines].join('\r\n')], { type: 'text/csv' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `audit_log_${$('from').value}_${$('to').value}.csv`; a.click();
};
</script>
</body>
</html>
