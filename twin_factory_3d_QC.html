<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>검사기 트윈팩토리 v1.8 - 검사기일보 매핑(qc_mapping) 연동</title>
<style>
:root{--bg:#0c0f16;--card:#151a24;--border:#26304a;--txt:#e6ecf5;--sub:#8b97ad;
--green:#22c55e;--red:#ef4444;--amber:#f59e0b;--accent:#38bdf8;--blue:#3b6fd4;--gray:#5b6678;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--txt);overflow:hidden}
.hdr{background:linear-gradient(135deg,#16203a,#1e293b);padding:10px 14px;position:absolute;top:0;left:0;right:0;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.4);border-bottom:1px solid var(--border)}
.hdr-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hdr h1{font-size:16px;font-weight:800}.hdr h1 .v{font-size:10px;color:var(--sub);font-weight:500;margin-left:4px}
.live{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--sub)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--gray);box-shadow:0 0 6px var(--gray)}
.dot.on{background:var(--green);box-shadow:0 0 6px var(--green)}
.dot.off{background:var(--red);box-shadow:0 0 6px var(--red)}
.sum{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.sc{flex:1;min-width:64px;text-align:center;padding:5px 4px;border-radius:8px;background:var(--card);border:1px solid var(--border)}
.sc .l{font-size:10px;color:var(--sub)}.sc .v{font-size:16px;font-weight:800;display:block;margin-top:1px}
#cv{position:absolute;inset:0;z-index:1;touch-action:none}
.ctrls{position:absolute;right:12px;top:120px;z-index:50;display:flex;flex-direction:column;gap:6px}
.cbtn{width:42px;height:42px;border-radius:10px;background:var(--card);border:1px solid var(--border);color:var(--txt);font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cbtn:active{background:var(--blue)}
.cbtn.on{background:var(--blue);border-color:var(--blue)}
.hint{position:absolute;bottom:8px;left:0;right:0;z-index:40;text-align:center;font-size:10px;color:var(--sub);pointer-events:none}
.legend{position:absolute;bottom:24px;left:0;right:0;z-index:40;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;font-size:11px;color:var(--sub);pointer-events:none}
.lg{display:flex;align-items:center;gap:4px}.lg .d{width:12px;height:12px;border-radius:3px}
/* 모달 */
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;align-items:flex-end;justify-content:center}
.mo.show{display:flex;animation:fi .15s}@keyframes fi{from{opacity:0}}
.ms{background:var(--card);width:100%;max-width:480px;border-radius:16px 16px 0 0;max-height:85vh;overflow-y:auto;border:1px solid var(--border);border-bottom:none;animation:su .25s}@keyframes su{from{transform:translateY(100%)}}
.mhd{padding:14px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card)}
.mbdg{width:50px;height:50px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;color:#0b0f17;flex-shrink:0}
.mbdg .n{font-size:18px}.mbdg .t{font-size:9px;opacity:.8}
.minfo{flex:1}.minfo h3{font-size:16px;font-weight:800}.minfo p{font-size:12px;color:var(--sub);margin-top:2px}
.mclose{width:36px;height:36px;border:none;border-radius:50%;background:#0f1117;color:var(--sub);font-size:20px;cursor:pointer}
.mbody{padding:8px 16px 24px}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #1e2433;font-size:14px}
.row:last-child{border-bottom:none}.row .k{color:var(--sub)}.row .vv{font-weight:700}
.prog{height:8px;background:#0f1117;border-radius:4px;overflow:hidden;margin-top:6px}.prog .f{height:100%;border-radius:4px}
/* 매핑 설정 */
.mapwrap{padding:4px 16px 24px}
.maprow{display:grid;grid-template-columns:1.4fr 1fr;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #1e2433}
.maprow .src{font-size:11px;color:var(--sub);font-family:monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.maprow input,.maprow select{background:#0f1117;border:1px solid var(--border);color:var(--txt);border-radius:7px;padding:7px 8px;font-size:13px;width:100%}
.mapnote{font-size:11px;color:var(--sub);line-height:1.6;margin:8px 0}
.btnbar{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;border:0;border-radius:9px;padding:11px 0;font-size:13px;font-weight:700;cursor:pointer}
.btn.primary{background:var(--blue);color:#fff}.btn.gray{background:#39435c;color:#cfd8e3}
.empty{text-align:center;color:var(--sub);padding:30px 20px;font-size:13px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div class="hdr">
  <div class="hdr-top">
    <h1>🔎 검사기 트윈팩토리<span class="v">v1.8</span></h1>
    <div class="live"><span class="dot" id="dot"></span><span id="conn">연결 대기</span> · <span id="upd">-</span></div>
  </div>
  <div class="sum">
    <div class="sc"><span class="l">가동</span><span class="v" id="sRun">0/8</span></div>
    <div class="sc"><span class="l">총 양품</span><span class="v" id="sPass" style="color:var(--green)">0</span></div>
  </div>
</div>

<canvas id="cv"></canvas>

<div class="ctrls">
  <button class="cbtn" onclick="autoRotateToggle()" id="rotBtn" title="자동 회전순회">↻</button>
  <button class="cbtn" onclick="resetView()" title="시점 초기화">⌂</button>
  <button class="cbtn" onclick="topView()" title="평면 시점">▦</button>
  <button class="cbtn" onclick="zoomBy(0.85)" title="확대">＋</button>
  <button class="cbtn" onclick="zoomBy(1.18)" title="축소">－</button>
  <button class="cbtn" onclick="openMapping()" title="채널→호기 매핑">⚙</button>
</div>

<div class="legend">
  <span class="lg"><span class="d" style="background:var(--green)"></span>가동(10분내 양품)</span>
  <span class="lg"><span class="d" style="background:var(--red)"></span>미가동(10분 이상)</span>
  <span class="lg"><span class="d" style="background:var(--gray)"></span>대기/매핑없음</span>
</div>
<div class="hint">좌클릭=검사기 선택 · 우클릭 드래그=회전 · 휠클릭 드래그=이동 · 휠=확대축소 · 두손가락=핀치/팬</div>

<!-- 상세 모달 -->
<div class="mo" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="ms">
    <div class="mhd">
      <div class="mbdg" id="mBdg"><span class="n" id="mNo">-</span><span class="t">호기</span></div>
      <div class="minfo"><h3 id="mTitle">검사기</h3><p id="mSub">-</p></div>
      <button class="mclose" onclick="closeModal()">×</button>
    </div>
    <div class="mbody" id="mBody"></div>
  </div>
</div>

<!-- 매핑 설정 모달 -->
<div class="mo" id="mapModal" onclick="if(event.target===this)closeMapping()">
  <div class="ms">
    <div class="mhd">
      <div class="minfo"><h3>⚙️ 채널 → 호기 매핑</h3><p>ESP32 MAC + DI 채널을 호기(양품)에 연결</p></div>
      <button class="mclose" onclick="closeMapping()">×</button>
    </div>
    <div class="mapwrap">
      <div class="mapnote">shot_count에 들어온 (MAC, DI) 조합이 자동 표시됩니다. 각 양품 신호 채널을 호기명(예:3호기)에 연결하세요. 비워두면 무시됩니다. 매핑은 이 브라우저에 저장됩니다.</div>
      <div id="mapList"></div>
      <div class="btnbar">
        <button class="btn gray" onclick="closeMapping()">취소</button>
        <button class="btn primary" onclick="saveMapping()">저장</button>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';
// ===================== 설정 =====================
var SB_URL='https://omngtyewdaqpphnzeate.supabase.co';
var SB_KEY='sb_publishable_9j2YkkL-7ul1TrhH-NjVdQ_vWDG2-1D';
var sbH={apikey:SB_KEY,Authorization:'Bearer '+SB_KEY};
var TABLE='shot_count';
var DI_LIST=['DI1','DI2','DI3','DI4','DI5','DI6','DI7','DI8'];
var S_LIST=['S1','S2'];
var ALL_CODES=DI_LIST.concat(S_LIST);
var POLL_MS=5000;             // 폴링 주기
var RECENT_MS=600000;         // 최근 감지 = 가동 판정 (10분). 이상이면 미가동(빨강)
var MAPPING_TABLE='qc_mapping';            // 검사기일보/QC_mes가 저장하는 서버 매핑
var MAP_CACHE_KEY='shot_monitor_mapping_v2'; // 동일 localStorage 캐시 공유

// ===================== 검사기 배치(3~10호기, 일렬·2대씩 4그룹) =====================
// 첨부 배치도 기준: 세로형 박스가 한 줄로, (3·4)(5·6)(7·8)(9·10) 그룹 간격
var MACHINES=[
 {no:'3', x:-5.9, z:0},{no:'4', x:-4.3, z:0},
 {no:'5', x:-2.5, z:0},{no:'6', x:-0.9, z:0},
 {no:'7', x: 0.9, z:0},{no:'8', x: 2.5, z:0},
 {no:'9', x: 4.3, z:0},{no:'10',x: 5.9, z:0}
];
var BOX_W=0.85, BOX_D=2.3, BOX_H=1.0;   // 세로형(z방향으로 길게)

// ===================== 상태 =====================
var mapping={};               // qc_mapping 서버: { dev:{ DI1:{machine,outlet}, ... } }
var boxTarget={};             // { "3호기":{qty,item} }  검사기일보가 설정 → 트윈은 읽기만
var summary={};               // { "3호기":{pass,lastTs,dev,ch} }
var lastUpdMs=0;

// ===================== Supabase =====================
async function sbGet(q){
  try{
    var r=await fetch(SB_URL+'/rest/v1/'+TABLE+'?'+q,{headers:sbH});
    if(!r.ok){ setConn(false,'HTTP '+r.status); return null; }
    return r.json();
  }catch(e){ setConn(false,'연결 실패'); return null; }
}
// 박스당 담는 수량(기종별) — 검사기일보가 qc_box_target에 저장, 트윈은 읽기만
//   create table qc_box_target(machine text primary key, box_qty integer, item_name text, updated_at timestamptz default now());
//   alter table qc_box_target disable row level security; grant all on qc_box_target to anon,authenticated;
async function loadBoxTargets(){
  try{
    var r=await fetch(SB_URL+'/rest/v1/qc_box_target?select=machine,box_qty,item_name',{headers:sbH});
    if(!r.ok) return;            // 테이블 없으면 미설정 상태로 진행
    var rows=await r.json(); var m={};
    rows.forEach(function(o){ m[o.machine]={qty:o.box_qty||0,item:o.item_name||''}; });
    boxTarget=m;
  }catch(e){}
}
function setConn(ok,msg){
  var d=document.getElementById('dot'); d.className='dot '+(ok?'on':'off');
  document.getElementById('conn').textContent=msg;
}

// ===================== 매핑 (검사기일보/QC_mes와 동일: qc_mapping 서버) =====================
async function loadMapping(){
  try{
    var r=await fetch(SB_URL+'/rest/v1/'+MAPPING_TABLE+'?id=eq.1&select=data',{headers:sbH});
    if(r.ok){ var rows=await r.json(); if(rows&&rows[0]&&rows[0].data){ mapping=rows[0].data; try{localStorage.setItem(MAP_CACHE_KEY,JSON.stringify(mapping));}catch(_){} return; } }
  }catch(e){}
  try{ mapping=JSON.parse(localStorage.getItem(MAP_CACHE_KEY)||'{}'); }catch(e){ mapping={}; }
}
function devKey(r){ return r.device_id || (r.esp32_mac?('MAC_'+r.esp32_mac.replace(/:/g,'')):'LEGACY'); }
function getMap(dev,ch){ return (mapping[dev]&&mapping[dev][ch])||null; }
function outletKind(o){
  if(!o) return 'pass';
  var s=String(o).toLowerCase();
  if(String(o).indexOf('불량')>=0||s.indexOf('ng')>=0||s.indexOf('fail')>=0||String(o).indexOf('리젝')>=0||s.indexOf('reject')>=0) return 'fail';
  return 'pass';
}

// ===================== KST 시각 =====================
function fmtKST(iso){
  if(!iso) return '-';
  try{
    return new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date(iso));
  }catch(e){ return '-'; }
}
function agoText(iso){
  if(!iso) return '감지 없음';
  var s=Math.floor((Date.now()-new Date(iso).getTime())/1000);
  if(s<0) s=0;
  if(s<60) return s+'초 전';
  if(s<3600) return Math.floor(s/60)+'분 전';
  return Math.floor(s/3600)+'시간 전';
}

// ===================== 데이터 처리 =====================
// 보드 구분 = device_id(없으면 MAC_…), 채널 = machine_code(DI1~/S1~). dev|채널별 최신 1건.
function processRows(rows){
  var latest={};
  for(var i=0;i<rows.length;i++){
    var r=rows[i];
    var ch=r.machine_code;
    if(ALL_CODES.indexOf(ch)<0) continue;
    var key=devKey(r)+'|'+ch;
    if(!latest[key]) latest[key]=r;   // created_at desc → 첫 건이 최신
  }
  return latest;
}
function aggregate(latest){
  var sum={};
  for(var key in latest){
    var r=latest[key];
    var dev=devKey(r), ch=r.machine_code;
    var m=getMap(dev,ch);
    if(!m||!m.machine) continue;
    if(outletKind(m.outlet||m.type)==='fail') continue;   // 양품만 집계
    if(!sum[m.machine]) sum[m.machine]={pass:0,lastTs:null,dev:dev,ch:ch};
    sum[m.machine].pass+=(r.shot_count||0);
    var ts=r.created_at||r.detected_at;
    if(ts && (!sum[m.machine].lastTs || new Date(ts)>new Date(sum[m.machine].lastTs))) sum[m.machine].lastTs=ts;
  }
  return sum;
}
function isRunning(s){ return !!(s&&s.lastTs && (Date.now()-new Date(s.lastTs).getTime())<RECENT_MS); }
function colorOf(no){
  var s=summary[no+'호기'];
  if(!s) return 0x5b6678;            // 매핑/데이터 없음 → 대기(회색)
  return isRunning(s)?0x22c55e:0xef4444;  // 10분내 감지=가동(녹), 10분이상=미가동(빨강)
}

// ===================== 3D =====================
var scene,camera,renderer,raycaster,mouse;
var boxes=[];        // {no,mesh,bill,billCtx,billTex}
var camTarget=new THREE.Vector3(0,0.4,0);
var camTheta=Math.PI*0.5, camPhi=Math.PI*0.38, camRadius=16;
var autoRotate=false;

function initThree(){
  var cv=document.getElementById('cv');
  renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.setSize(window.innerWidth,window.innerHeight);
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x0c0f16);
  scene.fog=new THREE.Fog(0x0c0f16,18,42);
  camera=new THREE.PerspectiveCamera(50,window.innerWidth/window.innerHeight,0.1,200);
  scene.add(new THREE.AmbientLight(0xffffff,0.65));
  var dl=new THREE.DirectionalLight(0xffffff,0.85); dl.position.set(6,14,8); scene.add(dl);
  var dl2=new THREE.DirectionalLight(0x88aaff,0.3); dl2.position.set(-8,6,-6); scene.add(dl2);
  raycaster=new THREE.Raycaster(); mouse=new THREE.Vector2();
  buildScene();
  bindControls(cv);
  window.addEventListener('resize',onResize);
  updateCam();
  animate();
}
function onResize(){
  renderer.setSize(window.innerWidth,window.innerHeight);
  camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix();
}

function buildScene(){
  // 바닥
  var floor=new THREE.Mesh(
    new THREE.PlaneGeometry(15,5),
    new THREE.MeshStandardMaterial({color:0x121826,roughness:0.95})
  );
  floor.rotation.x=-Math.PI/2; floor.position.y=0; scene.add(floor);
  // 그리드
  var grid=new THREE.GridHelper(15,30,0x2a3550,0x1b2236);
  grid.scale.z=5/15; grid.position.y=0.01; scene.add(grid);
  // 외곽 테두리(배치도 사각 경계)
  var ew=14.4, eh=4.4, ey=0.03;
  var pts=[new THREE.Vector3(-ew/2,ey,-eh/2),new THREE.Vector3(ew/2,ey,-eh/2),
           new THREE.Vector3(ew/2,ey,eh/2),new THREE.Vector3(-ew/2,ey,eh/2),new THREE.Vector3(-ew/2,ey,-eh/2)];
  var edge=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
           new THREE.LineBasicMaterial({color:0x3a466a}));
  scene.add(edge);

  boxes=[];
  for(var i=0;i<MACHINES.length;i++){
    var m=MACHINES[i];
    var grp=new THREE.Group(); grp.position.set(m.x,0,m.z);
    // 본체
    var body=new THREE.Mesh(
      new THREE.BoxGeometry(BOX_W,BOX_H,BOX_D),
      new THREE.MeshStandardMaterial({color:0x8893a8,roughness:0.6,metalness:0.12})
    );
    body.position.y=BOX_H/2; body.userData.no=m.no; grp.add(body);
    // 시그널 타워(적/녹 2단) — 본체 한쪽 모서리 위
    var tx=BOX_W*0.30, tz=-BOX_D*0.36, baseY=BOX_H;
    var pole=new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,0.16,12),
      new THREE.MeshStandardMaterial({color:0x222831,roughness:0.6}));
    pole.position.set(tx,baseY+0.08,tz); grp.add(pole);
    var redSeg=new THREE.Mesh(new THREE.CylinderGeometry(0.085,0.085,0.12,18),
      new THREE.MeshStandardMaterial({color:0x5a1f1f,roughness:0.35}));
    redSeg.position.set(tx,baseY+0.16+0.06,tz); grp.add(redSeg);
    var grnSeg=new THREE.Mesh(new THREE.CylinderGeometry(0.085,0.085,0.12,18),
      new THREE.MeshStandardMaterial({color:0x1f4a2a,roughness:0.35}));
    grnSeg.position.set(tx,baseY+0.16+0.18,tz); grp.add(grnSeg);
    var cap=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,0.025,18),
      new THREE.MeshStandardMaterial({color:0x222831}));
    cap.position.set(tx,baseY+0.16+0.255,tz); grp.add(cap);
    // 완제품 적재 나무상자(본체 앞) + 채움 블록
    var crate=new THREE.Group(); crate.position.set(0,0,BOX_D/2+0.55);
    var cw=0.95, cd=0.85, ch=0.42, cth=0.05;
    var woodM=new THREE.MeshStandardMaterial({color:0xb5824a,roughness:0.85});
    var woodD=new THREE.MeshStandardMaterial({color:0x8a5f33,roughness:0.85});
    var fl=new THREE.Mesh(new THREE.BoxGeometry(cw,cth,cd),woodD); fl.position.y=cth/2; crate.add(fl);
    var wFB=new THREE.BoxGeometry(cw,ch,cth), wLR=new THREE.BoxGeometry(cth,ch,cd);
    var w1=new THREE.Mesh(wFB,woodM); w1.position.set(0,ch/2,cd/2); crate.add(w1);
    var w2=new THREE.Mesh(wFB,woodM); w2.position.set(0,ch/2,-cd/2); crate.add(w2);
    var w3=new THREE.Mesh(wLR,woodM); w3.position.set(cw/2,ch/2,0); crate.add(w3);
    var w4=new THREE.Mesh(wLR,woodM); w4.position.set(-cw/2,ch/2,0); crate.add(w4);
    var fill=new THREE.Mesh(new THREE.BoxGeometry(cw-2*cth-0.02,0.01,cd-2*cth-0.02),
      new THREE.MeshStandardMaterial({color:0xe0b94e,roughness:0.7,emissive:0x000000}));
    fill.position.set(0,cth,0); fill.visible=false; crate.add(fill);
    grp.add(crate);
    var crateMaxH=ch-cth-0.02;
    // 빌보드(canvas)
    var c=document.createElement('canvas'); c.width=320; c.height=210;
    var ctx=c.getContext('2d');
    var tex=new THREE.CanvasTexture(c);
    var spr=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,depthTest:false,transparent:true}));
    spr.scale.set(1.55,1.02,1); spr.position.set(0,BOX_H+1.35,0);
    grp.add(spr);
    scene.add(grp);
    boxes.push({no:m.no,grp:grp,body:body,towerRed:redSeg,towerGrn:grnSeg,fill:fill,crateMaxH:crateMaxH,crateBase:cth,bill:spr,billCtx:ctx,billTex:tex});
  }
  refreshVisual();
}

function drawBillboard(b){
  var no=b.no, s=summary[no+'호기'];
  var ctx=b.billCtx, W=320, H=210;
  ctx.clearRect(0,0,W,H);
  var run=isRunning(s);
  var border = !s?'#5b6678':(run?'#22c55e':'#ef4444');
  ctx.fillStyle='rgba(12,16,24,0.92)';
  roundRect(ctx,4,4,W-8,H-8,16); ctx.fill();
  ctx.lineWidth=4; ctx.strokeStyle=border; ctx.stroke();
  // 호기명
  ctx.fillStyle='#e6ecf5'; ctx.font='bold 38px sans-serif'; ctx.textBaseline='top';
  ctx.textAlign='left'; ctx.fillText(no+'호기',22,16);
  // 상태 배지
  ctx.font='bold 18px sans-serif'; ctx.textAlign='right'; ctx.fillStyle=border;
  ctx.fillText(!s?'대기':(run?'가동':'미가동'),W-22,24);
  if(!s){
    ctx.fillStyle='#8b97ad'; ctx.font='16px sans-serif'; ctx.textAlign='left';
    ctx.fillText('매핑 없음',22,80);
    b.billTex.needsUpdate=true; return;
  }
  // 양품
  ctx.textAlign='left'; ctx.fillStyle='#22c55e'; ctx.font='bold 34px sans-serif';
  ctx.fillText('양품 '+(s.pass||0).toLocaleString('ko-KR'),22,66);
  // 박스 채움
  var p=boxProgress(no);
  if(p){
    var pctTxt=Math.round(p.pct*100)+'%';
    ctx.fillStyle='#e6b34a'; ctx.font='bold 22px sans-serif';
    ctx.fillText('박스 '+p.filled+'/'+p.qty+' ('+pctTxt+')',22,112);
    // 진행바
    var bx=22,by=144,bw=W-44,bh=14;
    ctx.fillStyle='#0f1117'; roundRect(ctx,bx,by,bw,bh,7); ctx.fill();
    ctx.fillStyle=p.pct>=1?'#4f91ff':'#e0b94e';
    roundRect(ctx,bx,by,Math.max(bh,bw*Math.min(1,p.pct)),bh,7); ctx.fill();
    ctx.fillStyle='#8b97ad'; ctx.font='14px sans-serif';
    ctx.fillText('완성 '+p.doneBoxes+'박스 · 최근 '+agoText(s.lastTs),22,170);
  }else{
    ctx.fillStyle='#8b97ad'; ctx.font='16px sans-serif';
    ctx.fillText('박스수량 미설정 (검사기일보)',22,114);
    ctx.fillText('최근 '+agoText(s.lastTs),22,148);
  }
  b.billTex.needsUpdate=true;
}
function roundRect(g,x,y,w,h,r){
  g.beginPath();g.moveTo(x+r,y);g.lineTo(x+w-r,y);g.quadraticCurveTo(x+w,y,x+w,y+r);
  g.lineTo(x+w,y+h-r);g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);g.lineTo(x+r,y+h);
  g.quadraticCurveTo(x,y+h,x,y+h-r);g.lineTo(x,y+r);g.quadraticCurveTo(x,y,x+r,y);g.closePath();
}

function setSeg(mesh,on,onColor,offColor){
  mesh.material.color.setHex(on?onColor:offColor);
  mesh.material.emissive.setHex(on?onColor:0x000000);
  mesh.material.emissiveIntensity=on?0.95:0;
}
// 현재 박스 채움 진행: {qty, filled, pct, doneBoxes} 또는 null(미설정)
function boxProgress(no){
  var t=boxTarget[no+'호기']; if(!t||!t.qty) return null;
  var s=summary[no+'호기']; var pass=s?(s.pass||0):0;
  var qty=t.qty;
  var doneBoxes=Math.floor(pass/qty);
  var filled=pass%qty;
  if(pass>0 && filled===0){ filled=qty; doneBoxes-=1; }  // 딱 떨어지면 현재 박스 가득
  return {qty:qty,filled:filled,pct:filled/qty,doneBoxes:doneBoxes,item:t.item};
}
function refreshVisual(){
  for(var i=0;i<boxes.length;i++){
    var b=boxes[i], s=summary[b.no+'호기'], run=isRunning(s), has=!!s;
    setSeg(b.towerRed, has&&!run, 0xff3b3b, 0x5a1f1f);  // 미가동=적 점등
    setSeg(b.towerGrn, has&&run,  0x35d65f, 0x1f4a2a);  // 가동=녹 점등
    // 나무상자 채움
    var p=boxProgress(b.no);
    if(p){
      var fh=Math.max(0.012, p.pct*b.crateMaxH);
      b.fill.visible=true;
      b.fill.scale.y=fh/0.01;
      b.fill.position.y=b.crateBase+fh/2;
      var full=p.pct>=1;
      b.fill.material.color.setHex(full?0x4f91ff:0xe0b94e);
      b.fill.material.emissive.setHex(full?0x1b3d80:0x000000);
    } else {
      b.fill.visible=false;
    }
    drawBillboard(b);
  }
  updateSummary();
}

function updateSummary(){
  var run=0,tp=0;
  for(var i=0;i<MACHINES.length;i++){
    var s=summary[MACHINES[i].no+'호기'];
    if(s){ tp+=(s.pass||0); if(isRunning(s)) run++; }
  }
  document.getElementById('sRun').textContent=run+'/'+MACHINES.length;
  document.getElementById('sPass').textContent=tp.toLocaleString('ko-KR');
}

// ===================== 카메라 =====================
function updateCam(){
  camPhi=Math.max(0.08,Math.min(Math.PI*0.49,camPhi));
  camRadius=Math.max(4,Math.min(60,camRadius));
  var x=camTarget.x+camRadius*Math.sin(camPhi)*Math.cos(camTheta);
  var y=camTarget.y+camRadius*Math.cos(camPhi);
  var z=camTarget.z+camRadius*Math.sin(camPhi)*Math.sin(camTheta);
  camera.position.set(x,y,z); camera.lookAt(camTarget);
}
function resetView(){ autoRotate=false; setRotBtn(); camTarget.set(0,0.4,0); camTheta=Math.PI*0.5; camPhi=Math.PI*0.38; camRadius=16; updateCam(); }
function topView(){ autoRotate=false; setRotBtn(); camPhi=0.12; updateCam(); }
function zoomBy(f){ camRadius=Math.max(4,Math.min(60,camRadius*f)); updateCam(); }
function autoRotateToggle(){ autoRotate=!autoRotate; setRotBtn(); }
function setRotBtn(){ var b=document.getElementById('rotBtn'); if(b)b.classList.toggle('on',autoRotate); }

// ===== 자체 궤도 컨트롤 (CAD 정석) =====
// 우클릭 드래그 = 회전 / 휠클릭(중간) 드래그 = 팬 / 휠스크롤 = 줌 / 좌클릭 = 선택
function bindControls(cv){
  var orbiting=false,panning=false,lx=0,ly=0;
  var pinchD=0,pinchMode=false,touchMoved=0;
  var downX=0,downY=0,downT=0,downBtn=0;
  cv.addEventListener('mousedown',function(e){
    downX=e.clientX;downY=e.clientY;downT=Date.now();downBtn=e.button;lx=e.clientX;ly=e.clientY;
    if(e.button===2){orbiting=true;autoRotate=false;setRotBtn();e.preventDefault();}    // 우클릭=회전
    else if(e.button===1){panning=true;autoRotate=false;setRotBtn();e.preventDefault();} // 휠클릭=팬
    // 좌클릭(0)은 선택용 → mouseup에서 판정
  });
  window.addEventListener('mousemove',function(e){
    if(!orbiting&&!panning)return;
    var dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;
    if(orbiting)orbit(dx,dy);else pan(dx,dy);
  });
  window.addEventListener('mouseup',function(e){
    if(e.button===0&&downBtn===0&&Date.now()-downT<250&&Math.abs(e.clientX-downX)<5&&Math.abs(e.clientY-downY)<5){
      pick(e.clientX,e.clientY);
    }
    orbiting=false;panning=false;
  });
  cv.addEventListener('contextmenu',function(e){e.preventDefault();}); // 우클릭 메뉴 차단(회전용)
  cv.addEventListener('wheel',function(e){e.preventDefault();autoRotate=false;setRotBtn();zoomBy(e.deltaY>0?1.1:0.9);},{passive:false});
  // 터치: 1손가락=회전, 2손가락=핀치줌+팬, 짧은탭=선택
  cv.addEventListener('touchstart',function(e){
    e.preventDefault();autoRotate=false;setRotBtn();
    if(e.touches.length===1){orbiting=true;lx=e.touches[0].clientX;ly=e.touches[0].clientY;downX=lx;downY=ly;downT=Date.now();touchMoved=0;}
    else if(e.touches.length===2){pinchMode=true;orbiting=false;pinchD=touchDist(e);lx=(e.touches[0].clientX+e.touches[1].clientX)/2;ly=(e.touches[0].clientY+e.touches[1].clientY)/2;}
  },{passive:false});
  cv.addEventListener('touchmove',function(e){
    e.preventDefault();
    if(pinchMode&&e.touches.length===2){
      var d=touchDist(e);if(pinchD>0)zoomBy(pinchD/d);pinchD=d;
      var mx=(e.touches[0].clientX+e.touches[1].clientX)/2,my=(e.touches[0].clientY+e.touches[1].clientY)/2;
      pan(mx-lx,my-ly);lx=mx;ly=my;
    } else if(orbiting&&e.touches.length===1){
      var dx=e.touches[0].clientX-lx,dy=e.touches[0].clientY-ly;lx=e.touches[0].clientX;ly=e.touches[0].clientY;
      touchMoved+=Math.abs(dx)+Math.abs(dy);orbit(dx,dy);
    }
  },{passive:false});
  cv.addEventListener('touchend',function(e){
    if(pinchMode){pinchMode=false;}
    else if(orbiting){
      var t=e.changedTouches[0];
      var moved=t?(Math.abs(t.clientX-downX)+Math.abs(t.clientY-downY)):touchMoved;
      if(touchMoved<14&&moved<14&&Date.now()-downT<400&&t) pick(t.clientX,t.clientY);
    }
    if(e.touches.length===0){orbiting=false;pinchMode=false;pinchD=0;}
  });
}
function touchDist(e){var dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;return Math.hypot(dx,dy);}
function orbit(dx,dy){
  camTheta+=dx*0.008; camPhi-=dy*0.008;
  camPhi=Math.max(0.08,Math.min(Math.PI*0.49,camPhi));
  updateCam();
}
function pan(dx,dy){
  var ps=camRadius*0.0016;
  camera.updateMatrixWorld();
  var right=new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,0); // 화면 가로
  var up=new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,1);    // 화면 세로
  camTarget.addScaledVector(right,-dx*ps);
  camTarget.addScaledVector(up,dy*ps);
  updateCam();
}
function pick(cx,cy){
  var rect=renderer.domElement.getBoundingClientRect();
  mouse.x=((cx-rect.left)/rect.width)*2-1; mouse.y=-((cy-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(mouse,camera);
  var meshes=boxes.map(function(b){return b.body;});
  var hit=raycaster.intersectObjects(meshes,false);
  if(hit.length){ openModal(hit[0].object.userData.no); }
}

// ===================== 애니메이션 =====================
function animate(){
  requestAnimationFrame(animate);
  if(autoRotate){ camTheta+=0.0035; updateCam(); }
  for(var i=0;i<boxes.length;i++) boxes[i].bill.material.rotation=0; // sprite는 항상 카메라 향함
  renderer.render(scene,camera);
}

// ===================== 모달 =====================
function openModal(no){
  var s=summary[no+'호기'];
  var col=colorOf(no), hex='#'+col.toString(16).padStart(6,'0');
  document.getElementById('mNo').textContent=no;
  document.getElementById('mBdg').style.background=hex;
  document.getElementById('mTitle').textContent=no+'호기 검사기';
  document.getElementById('mSub').textContent=s?(isRunning(s)?'가동 중':'유휴'):'매핑/데이터 없음';
  var body=document.getElementById('mBody');
  if(!s){
    body.innerHTML='<div class="empty">이 호기에 연결된 채널 매핑이 없거나<br>데이터가 아직 없습니다.<br><br>⚙ 버튼에서 MAC+DI 채널을 '+no+'호기에 연결하세요.</div>';
  }else{
    var pass=s.pass||0, run=isRunning(s);
    var html=
      row('양품 누적',pass.toLocaleString('ko-KR'),'#22c55e')+
      row('상태',run?'가동 중':'미가동 (10분 이상 신호 없음)',run?'#22c55e':'#ef4444');
    var p=boxProgress(no);
    if(p){
      html+=row('기종',p.item||'-')+
        row('박스당 수량',p.qty.toLocaleString('ko-KR'))+
        row('현재 박스',p.filled+'/'+p.qty+' ('+Math.round(p.pct*100)+'%)','#e6b34a')+
        '<div class="prog"><div class="f" style="width:'+Math.min(100,p.pct*100)+'%;background:'+(p.pct>=1?'#4f91ff':'#e0b94e')+'"></div></div>'+
        row('완성 박스',p.doneBoxes+'박스');
    }else{
      html+=row('박스당 수량','미설정 (검사기일보에서 설정)','#8b97ad');
    }
    html+=row('최근 감지',fmtKST(s.lastTs)+' ('+agoText(s.lastTs)+')')+
      row('소스',(s.dev||'-')+' / '+(s.ch||'-'));
    body.innerHTML=html;
  }
  document.getElementById('modal').classList.add('show');
}
function row(k,v,c){ return '<div class="row"><span class="k">'+k+'</span><span class="vv"'+(c?' style="color:'+c+'"':'')+'>'+v+'</span></div>'; }
function closeModal(){ document.getElementById('modal').classList.remove('show'); }

// 매핑은 검사기일보(⚙ 호기 매핑)에서 관리 → 트윈은 qc_mapping 서버를 읽기만 함
function openMapping(){ alert('채널→호기 매핑은 「검사기일보」 또는 「신호테스트(QC_mes)」의 호기 매핑 설정에서 관리합니다.\n트윈은 그 매핑(qc_mapping)을 자동으로 읽어 표시합니다.'); }

// ===================== 폴링 =====================
var _cacheRows=[];
function refreshFromCache(){
  var latest=processRows(_cacheRows);
  summary=aggregate(latest);
  refreshVisual();
}
async function poll(){
  await loadMapping();      // 검사기일보/QC_mes가 갱신한 매핑 반영
  await loadBoxTargets();   // 검사기일보가 설정한 박스당 수량 반영
  var q='machine_code=in.('+ALL_CODES.join(',')+')&order=created_at.desc&limit=800';
  var data=await sbGet(q);
  if(!data) return;
  setConn(true,'연결됨');
  _cacheRows=data;
  refreshFromCache();
  lastUpdMs=Date.now();
  document.getElementById('upd').textContent=fmtKST(new Date().toISOString());
}

// ===================== 시작 =====================
initThree();
poll();
setInterval(poll,POLL_MS);
</script>
