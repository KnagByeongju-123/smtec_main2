<!DOCTYPE html>
<html lang="ko">
<head>
<script src="audit.js?v=7"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>재가동 이력 v1.0</title>
<!-- 설비 재가동시(가동중단후) 업무처리 절차 · SQ 1_2 — 재가동 LOT·재가동 기록 이력 (스마트팩토리 v_restart_lot)
     재가동 = ① 비계획 가동중단 5분 이상(치수조정 30분 이상) 후 재가동 ② 같은 품번 계획종료 후 재가동 · 기록은 수동생산일보 '재가동 기록' -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR','맑은 고딕',sans-serif;background:#f1f5f9;color:#0f172a;font-size:13px;padding-bottom:30px}
.hdr{background:linear-gradient(135deg,#b45309,#92400e);color:#fff;padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hdr h1{font-size:18px;font-weight:800}
.hdr .sub{font-size:12px;opacity:.9}
.hdr a{color:#fff;font-size:12px;margin-left:auto;text-decoration:none;border:1px solid rgba(255,255,255,.6);border-radius:6px;padding:4px 9px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px}
.bar input,.bar select{font-size:13px;padding:4px 6px;border:1px solid #cbd5e1;border-radius:6px;background:#fff}
.bar button{font-size:13px;padding:5px 12px;border-radius:6px;border:1px solid #b45309;background:#b45309;color:#fff;cursor:pointer}
.bar button.w{background:#fff;color:#b45309}
.sum{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;padding:0 16px}
.sum div{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:8px 10px}
.sum b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.sum span{font-size:11.5px;color:#64748b}
.wrap{padding:10px 16px;overflow-x:auto}
table{width:100%;border-collapse:collapse;background:#fff;font-size:12px;min-width:1100px}
th,td{border:1px solid #e2e8f0;padding:5px 6px;text-align:left;vertical-align:top}
th{background:#fef3c7;position:sticky;top:0;white-space:nowrap}
td.c{text-align:center}td.r{text-align:right}
.ok{color:#15803d;font-weight:800}.ng{color:#b91c1c;font-weight:800}.miss{color:#b91c1c;font-weight:700}
.k-stop{color:#9a3412}.k-wo{color:#3730a3}
.empty{padding:30px;text-align:center;color:#64748b}
.note{padding:0 16px;font-size:11.5px;color:#64748b}
@media (max-width:700px){.sum{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="hdr">
  <div><h1>🏷️ 재가동 이력</h1><div class="sub">설비 재가동시(가동중단후) 업무처리 절차 · SQ 1_2 — 재가동 LOT · 직전품 · 초품 · 폐기수량</div></div>
  <a href="stop_time_counter.html">수동생산일보 (재가동 기록)</a>
</div>
<div class="bar">
  <label>기간 <input type="date" id="f1"> ~ <input type="date" id="f2"></label>
  <label>호기 <select id="fh"><option value="">전체</option></select></label>
  <label>품번 <input id="fp" placeholder="일부 입력" size="12"></label>
  <label>구분 <select id="fk"><option value="">전체</option><option value="stop">가동중단 후</option><option value="wo">계획종료 후</option></select></label>
  <label><input type="checkbox" id="fm"> 기록 미작성만</label>
  <button onclick="load()">조회</button>
  <button class="w" onclick="xls()">📥 엑셀</button>
  <span id="st" style="color:#64748b;font-size:12px"></span>
</div>
<div class="sum" id="sum"></div>
<div class="wrap"><table id="tbl"></table></div>
<div class="note">재가동 기록은 2026-11-09 부터 작성 (이전 재가동은 '시행 전') · 재가동 = ① 비계획 가동중단(설비이상·금형수리·금형세팅/교환·불량처리·치수조정·연마·랩핑) 5분 이상(치수조정은 30분 이상) 후 재가동 ② 같은 품번 계획종료 후 재가동 · LOT = 생산일-순번(품번별) · MES 작업지시·정지 자료 기준 · 기록은 수동생산일보 「재가동 기록」에서 작성</div>

<script>
const SB_URL='https://omngtyewdaqpphnzeate.supabase.co';
const SB_KEY='sb_publishable_9j2YkkL-7ul1TrhH-NjVdQ_vWDG2-1D';
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
let ROWS=[], VIEW=[];
const EFFECTIVE='2026-11-09';   /* 재가동 기록 시행일 — 이전 재가동은 '시행 전'(기록 대상 아님) */
const target=r=>r.ymd>=EFFECTIVE;
async function get(path){
  const out=[]; let from=0;
  for(;;){ const r=await fetch(SB_URL+'/rest/v1/'+path+'&limit=1000&offset='+from,{headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY},cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status+' '+(await r.text()).slice(0,120));
    const d=await r.json(); out.push(...d); if(d.length<1000) break; from+=1000; }
  return out;
}
async function load(){
  const a=document.getElementById('f1').value, b=document.getElementById('f2').value;
  if(!a||!b){ alert('기간을 고르세요'); return; }
  document.getElementById('st').textContent='불러오는 중…';
  try{
    ROWS=await get('v_restart_lot?select=lot_no,ymd,machine_code,machine_name,ho,seq,boundary,from_t,to_t,item_code,work_order_no,stop_name,stop_min,stop_start,stop_end,prev_wo,prev_shot,prev_et,prev_check,first_res,scrap_qty,action_note,first_by,first_at&seq=gt.1&ymd=gte.'+a+'&ymd=lte.'+b+'&order=ymd.desc,ho.asc,from_t.asc');
    const hs=[...new Set(ROWS.map(r=>r.ho))].sort((x,y)=>(+x)-(+y)), sel=document.getElementById('fh'), cur=sel.value;
    sel.innerHTML='<option value="">전체</option>'+hs.map(h=>`<option value="${esc(h)}">${+h}호기</option>`).join(''); if(hs.includes(cur)) sel.value=cur;
    document.getElementById('st').textContent='갱신 '+new Date().toLocaleTimeString('ko-KR');
    paint();
  }catch(e){ document.getElementById('st').textContent='불러오기 실패: '+e.message; }
}
function paint(){
  const h=document.getElementById('fh').value, p=document.getElementById('fp').value.trim().toUpperCase(), k=document.getElementById('fk').value, m=document.getElementById('fm').checked;
  VIEW=ROWS.filter(r=>(!h||r.ho===h)&&(!p||String(r.item_code||'').toUpperCase().includes(p))&&(!k||r.boundary===k)&&(!m||(target(r)&&!r.first_res)));
  const tg=VIEW.filter(target), done=tg.filter(r=>r.first_res), ng=VIEW.filter(r=>r.first_res==='NG'||r.prev_check==='NG');
  document.getElementById('sum').innerHTML=[
    [VIEW.length+'건','재가동 (가동중단 '+VIEW.filter(r=>r.boundary==='stop').length+' · 계획종료 '+VIEW.filter(r=>r.boundary==='wo').length+')','#0f172a'],
    [done.length+' / '+tg.length,'재가동 기록 작성 ('+EFFECTIVE+' 시행부터)','#15803d'],
    [(tg.length-done.length)+'건','기록 미작성'+(VIEW.length>tg.length?' · 시행 전 '+(VIEW.length-tg.length)+'건 제외':''),'#b91c1c'],
    [ng.length+'건','직전품·초품 NG','#b91c1c'],
    [VIEW.reduce((a,r)=>a+(+r.scrap_qty||0),0).toLocaleString()+' EA','불량 폐기 합계','#b45309']
  ].map(([b,s,c])=>`<div><b style="color:${c}">${b}</b><span>${s}</span></div>`).join('');
  const T=document.getElementById('tbl');
  if(!VIEW.length){ T.innerHTML='<tr><td class="empty">조건에 맞는 재가동이 없습니다.</td></tr>'; return; }
  const okng=(v,r)=>v?`<span class="${v==='OK'?'ok':'ng'}">${esc(v)}</span>`:target(r)?'<span class="miss">미작성</span>':'<span style="color:#94a3b8">시행 전</span>';
  T.innerHTML='<tr><th>일자</th><th>호기</th><th>품번 · 작업지시</th><th>재가동 LOT</th><th>구분 · 사유</th><th>재가동</th><th>① 직전품</th><th>② 초품</th><th>③ 폐기</th><th>설비 점검·조치</th><th>확인자</th></tr>'
    +VIEW.map(r=>`<tr><td>${esc(r.ymd)}</td><td class="c">${+r.ho}호기</td><td>${esc(r.item_code||'-')}<div style="color:#64748b;font-size:11px">${esc(r.work_order_no||'')}</div></td>
      <td style="font-weight:800;color:#b45309;white-space:nowrap">${esc(r.lot_no)}</td>
      <td>${r.boundary==='wo'?`<span class="k-wo">계획종료 후 재가동</span><div style="font-size:11px;color:#64748b">앞 계획 ${esc(r.prev_wo||'')} 종료 ${esc(r.prev_et||'')}${r.prev_shot!=null?' · '+(+r.prev_shot).toLocaleString()+'타':''}</div>`
        :`<span class="k-stop">가동중단 후 재가동</span><div style="font-size:11px;color:#64748b">${esc(r.stop_name||'')} ${esc(r.stop_start||'')}~${esc(r.stop_end||'')} · ${Math.round(+r.stop_min||0)}분</div>`}</td>
      <td class="c">${esc(r.from_t)}</td><td class="c">${okng(r.prev_check,r)}</td><td class="c">${okng(r.first_res,r)}</td>
      <td class="r">${r.first_res?(+r.scrap_qty||0).toLocaleString():''}</td><td>${esc(r.action_note||'')}</td>
      <td>${esc(r.first_by||'')}<div style="font-size:11px;color:#64748b">${esc(String(r.first_at||'').slice(0,16).replace('T',' '))}</div></td></tr>`).join('');
}
function xls(){
  if(!VIEW.length){ alert('내보낼 이력이 없습니다'); return; }
  const a=document.getElementById('f1').value, b=document.getElementById('f2').value;
  const head=['일자','호기','품번','작업지시','재가동 LOT','구분','사유/앞 계획','정지 시작','정지 종료','정지(분)','재가동 시각','① 직전품','② 초품','③ 폐기(EA)','설비 점검·조치','확인자','기록 시각'];
  const data=VIEW.map(r=>[r.ymd,(+r.ho)+'호기',r.item_code||'',r.work_order_no||'',r.lot_no,r.boundary==='wo'?'계획종료 후 재가동':'가동중단 후 재가동',
    r.boundary==='wo'?(r.prev_wo||'')+' 종료 '+(r.prev_et||''):(r.stop_name||''),r.stop_start||'',r.stop_end||'',r.stop_min!=null?Math.round(+r.stop_min):'',
    r.from_t,r.prev_check||(target(r)?'미작성':'시행 전'),r.first_res||(target(r)?'미작성':'시행 전'),r.first_res?(+r.scrap_qty||0):'',r.action_note||'',r.first_by||'',String(r.first_at||'').slice(0,16).replace('T',' ')]);
  const ws=XLSX.utils.aoa_to_sheet([['설비 재가동 이력 (설비 재가동시(가동중단후) 업무처리 절차 · SQ 1_2)'],['기간 '+a+' ~ '+b+' · 출력 '+ymd(new Date())+' · ㈜태진다이텍'],[],head,...data]);
  ws['!cols']=[10,7,18,14,12,16,22,8,8,7,9,8,8,8,30,10,16].map(w=>({wch:w}));
  ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:16}},{s:{r:1,c:0},e:{r:1,c:16}}];
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'재가동 이력');
  XLSX.writeFile(wb,'재가동이력_'+a.replace(/-/g,'')+'_'+b.replace(/-/g,'')+'.xlsx');
}
['fh','fk','fm'].forEach(id=>document.getElementById(id).addEventListener('change',paint));
document.getElementById('fp').addEventListener('input',paint);
(()=>{ const t=new Date(), f=new Date(EFFECTIVE+'T00:00:00'); document.getElementById('f1').value=ymd(f); document.getElementById('f2').value=ymd(t); load(); })();
</script>
</body>
</html>
