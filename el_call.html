<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>엘리베이터 알림 호출 v1.1</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:#0b1220;color:#e5e7eb;font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
       min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
  .logo{font-size:14px;color:#64748b;margin-bottom:6px;letter-spacing:1px}
  h1{font-size:20px;color:#fbbf24;margin-bottom:36px;text-align:center}
  .btn{width:220px;height:220px;border-radius:50%;border:4px solid rgba(251,191,36,.5);
       background:radial-gradient(circle at 35% 30%, #2a2410, #171310);
       color:#fbbf24;font-size:26px;font-weight:800;cursor:pointer;font-family:inherit;
       box-shadow:0 0 40px rgba(251,191,36,.15), inset 0 0 30px rgba(0,0,0,.6);
       transition:transform .1s, box-shadow .2s;line-height:1.5}
  .btn:active{transform:scale(.95)}
  .btn:disabled{opacity:.45}
  .btn.sent{border-color:rgba(34,197,94,.6);color:#4ade80;box-shadow:0 0 50px rgba(34,197,94,.25)}
  .btn.fail{border-color:rgba(239,68,68,.6);color:#fca5a5}
  .status{margin-top:30px;font-size:15px;color:#94a3b8;min-height:24px;text-align:center;line-height:1.7}
  .status b{color:#fbbf24}
  .foot{position:fixed;bottom:14px;font-size:11px;color:#334155}
</style>
</head>
<body>
  <div class="logo">TAEJIN · ESG Smart Factory</div>
  <h1>제품 상차 시 검사실 알림</h1>

  <button type="button" class="btn" id="callBtn" onclick="sendCall()">엘리베이터<br>알림</button>

  <div class="status" id="status">버튼을 누르면 2층 검사실에<br>알림이 <b>10초간</b> 울립니다</div>

  <div class="foot">el_call v1.1</div>

<script>
const SB_URL = 'https://omngtyewdaqpphnzeate.supabase.co';
const SB_KEY = 'sb_publishable_9j2YkkL-7ul1TrhH-NjVdQ_vWDG2-1D';
const EL_ID  = 'floor2';
const HOLD_SEC   = 10;    // 수신기 알림 유지시간(표시용)
const EXPIRE_SEC = 150;   // 만료 fallback: 30초 폴링 + 분단위 크론 대비 넉넉히
let busy = false;

function kst(offsetSec){
  const d = new Date(Date.now() + (offsetSec||0)*1000 + 9*3600*1000);
  return d.toISOString().replace('Z','').replace('T',' ') + '+09:00';
}

async function sendCall(){
  if (busy) return;
  busy = true;
  const btn = document.getElementById('callBtn');
  const st  = document.getElementById('status');
  btn.disabled = true;
  st.textContent = '전송 중...';

  try{
    const r = await fetch(SB_URL + '/rest/v1/call_light?id=eq.' + EL_ID, {
      method: 'PATCH',
      headers: {
        'apikey': SB_KEY,
        'Authorization': 'Bearer ' + SB_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({
        state: true,
        msg: '엘리베이터 알림 (QR)',
        called_by: 'QR',
        updated_at: kst(0),
        expire_at: kst(EXPIRE_SEC)
      })
    });

    if (r.ok) {
      btn.classList.add('sent');
      btn.innerHTML = '알림<br>전송됨';
      st.innerHTML = '검사실에 알림이 전송되었습니다';
      if (navigator.vibrate) navigator.vibrate(80);
    } else {
      throw new Error(r.status);
    }
  }catch(e){
    btn.classList.add('fail');
    btn.innerHTML = '전송<br>실패';
    st.innerHTML = '네트워크를 확인 후<br>다시 시도해 주세요';
  }

  setTimeout(()=>{
    btn.classList.remove('sent','fail');
    btn.innerHTML = '엘리베이터<br>알림';
    btn.disabled = false;
    st.innerHTML = '버튼을 누르면 2층 검사실에<br>알림이 <b>10초간</b> 울립니다';
    busy = false;
  }, 4000);
}
</script>
</body>
</html>
