<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>측정기 종합현황 v1.0</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap">
<style>
  :root{--bg:#0f172a;--surface:#1e293b;--surface2:#334155;--border:#475569;--accent:#38bdf8;--ok:#22c55e;--warn:#f59e0b;--ng:#ef4444;--text:#e2e8f0;--text2:#94a3b8;--text3:#64748b}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:30px}
  .hdr{background:linear-gradient(135deg,#0c4a6e,#0369a1);padding:16px;text-align:center;position:relative}
  .hdr h1{font-size:18px;font-weight:900;letter-spacing:-.3px}
  .hdr p{font-size:11px;color:#7dd3fc;margin-top:3px}
  .toolbar{max-width:1200px;margin:12px auto;padding:0 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--text2)}
  .legend-item{display:flex;align-items:center;gap:4px}
  .legend-dot{width:10px;height:10px;border-radius:2px;display:inline-block}
  .btn-refresh{padding:8px 14px;font-size:12px;font-weight:700;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);cursor:pointer;font-family:inherit}
  .btn-refresh:hover{background:var(--accent);color:#0f172a}
  .stats{display:flex;gap:8px;font-size:11px;color:var(--text2)}
  .stats b{color:var(--text)}
  .grid{max-width:1200px;margin:0 auto;padding:8px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
  .card{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s;position:relative}
  .card:hover{transform:translateY(-2px);border-color:var(--accent)}
  .card:active{transform:scale(.98)}
  .card-head{padding:12px 14px;background:linear-gradient(135deg,rgba(56,189,248,.1),rgba(56,189,248,.04));border-bottom:1.5px solid var(--border);font-size:14px;font-weight:700;color:var(--text);text-align:center;line-height:1.3;min-height:56px;display:flex;align-items:center;justify-content:center}
  .card-body{display:grid;grid-template-rows:repeat(3,1fr)}
  .cell{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;transition:all .15s}
  .cell:last-child{border-bottom:none}
  .cell-label{display:flex;align-items:center;gap:6px}
  .cell-status{font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px}
  .cell.ok{background:rgba(100,116,139,.05);color:var(--text2)}
  .cell.ok .cell-status{background:rgba(34,197,94,.15);color:var(--ok)}
  .cell.due{background:rgba(245,158,11,.12);color:var(--warn);font-weight:700}
  .cell.due .cell-status{background:var(--warn);color:#0f172a}
  .cell.overdue{background:rgba(239,68,68,.15);color:#fca5a5;font-weight:700;animation:pulse 2s ease-in-out infinite}
  .cell.overdue .cell-status{background:var(--ng);color:#fff}
  .cell.never{background:rgba(239,68,68,.18);color:#fca5a5;font-weight:700}
  .cell.never .cell-status{background:#7f1d1d;color:#fff}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
  .empty{text-align:center;padding:60px 20px;color:var(--text3);font-size:13px}
  .loading{text-align:center;padding:40px;color:var(--text2);font-size:12px}
  @media(max-width:600px){
    .grid{grid-template-columns:1fr 1fr;gap:8px;padding:8px}
    .card-head{font-size:12px;padding:10px;min-height:48px}
    .cell{padding:8px 10px;font-size:11px}
    .toolbar{flex-direction:column;align-items:flex-start}
  }
  @media(max-width:380px){
    .grid{grid-template-columns:1fr}
  }
</style>
</head>

function daysBetween(d1, d2){
  const ms = new Date(d2) - new Date(d1);
  return Math.floor(ms / (1000*60*60*24));
}

function cellStatus(period, lastDate, today){
  if(!lastDate) return 'never';
  const diff = daysBetween(lastDate, today);
  if(diff === 0) return 'ok';
  if(period === 1){
    if(diff >= 2) return 'overdue';
    if(diff >= 1) return 'due';
    return 'ok';
  }
  if(period === 7){
    if(diff > 7) return 'overdue';
    if(diff >= 7) return 'due';
    return 'ok';
  }
  if(period === 30){
    if(diff > 30) return 'overdue';
    if(diff >= 30) return 'due';
    return 'ok';
  }
  return 'ok';
}

async function getEqItems(eqName){
  try{
    const url = SB_URL + '/rest/v1/common_code?select=code_value,sort_order&code_group=eq.' +
                eqGroupKey(eqName) + '&order=sort_order.asc&limit=200';
    const r = await fetch(url, {headers:SB_HEADERS});
    if(r.ok){
      const data = await r.json();
      if(data && data.length){
        const parsed = [];
        data.forEach(rec=>{
          try{
            const o = JSON.parse(rec.code_value||'{}');
            if(o && o.label) parsed.push({label:o.label, period:Number(o.period)||1});
          }catch(e){}
        });
        if(parsed.length) return parsed;
      }
    }
  }catch(e){ console.warn('항목 서버 조회 실패:', eqName); }
  return DEFAULT_CHECKLIST_DB[eqName] || [];
}

async function fetchEqStatus(eqName){
  try{
    const items = await getEqItems(eqName);
    const periodMap = {};
    items.forEach(it=>{ periodMap[it.label] = it.period; });

    const url = SB_URL + '/rest/v1/qc_measure_log?select=check_date,items_json&equipment=eq.' +
                encodeURIComponent(eqName) + '&order=check_date.desc&limit=60';
    const r = await fetch(url, {headers:SB_HEADERS});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const rows = await r.json();

    let dailyLast = null, weeklyLast = null, monthlyLast = null;
    for(const row of rows){
      const itemsJson = row.items_json || {};
      let hasDaily=false, hasWeekly=false, hasMonthly=false;
      for(const label of Object.keys(itemsJson)){
        const p = periodMap[label];
        if(p === 1) hasDaily = true;
        else if(p === 7) hasWeekly = true;
        else if(p === 30) hasMonthly = true;
      }
      if(hasDaily && !dailyLast) dailyLast = row.check_date;
      if(hasWeekly && !weeklyLast) weeklyLast = row.check_date;
      if(hasMonthly && !monthlyLast) monthlyLast = row.check_date;
      if(dailyLast && weeklyLast && monthlyLast) break;
    }
    return {daily:dailyLast, weekly:weeklyLast, monthly:monthlyLast, hasItems: items.length>0};
  }catch(e){
    console.warn('상태 조회 실패:', eqName, e);
    return {daily:null, weekly:null, monthly:null, error: e.message};
  }
}

function renderCard(eq, status){
  const today = new Date().toISOString().slice(0,10);
  const dailyStat = cellStatus(1, status.daily, today);
  const weeklyStat = cellStatus(7, status.weekly, today);
  const monthlyStat = cellStatus(30, status.monthly, today);

  const cells = [
    {label:'일간', period:1, stat:dailyStat, lastDate:status.daily},
    {label:'주간', period:7, stat:weeklyStat, lastDate:status.weekly},
    {label:'월간', period:30, stat:monthlyStat, lastDate:status.monthly},
  ];

  function cellHtml(c){
    const dot = (c.stat==='overdue'||c.stat==='never') ? '🔴' :
                (c.stat==='due') ? '🟡' : '✓';
    let statusLabel;
    if(c.stat==='never') statusLabel = '미점검';
    else if(c.stat==='overdue'){
      const d = c.lastDate ? daysBetween(c.lastDate, today) : 0;
      statusLabel = 'D+'+d;
    }
    else if(c.stat==='due') statusLabel = '오늘';
    else if(c.lastDate === today) statusLabel = '오늘 완료';
    else {
      const d = daysBetween(c.lastDate, today);
      statusLabel = d===0 ? '오늘' : (d+'일전');
    }
    return '<div class="cell '+c.stat+'">' +
      '<span class="cell-label">'+dot+' '+c.label+'</span>' +
      '<span class="cell-status">'+statusLabel+'</span></div>';
  }

  return '<div class="card" onclick="goPage(\''+eq.key+'\')">' +
    '<div class="card-head">'+eq.name+'</div>' +
    '<div class="card-body">' +
      cells.map(cellHtml).join('') +
    '</div></div>';
}

function goPage(key){
  location.href = 'QC_measure_'+key+'.html';
}
window.goPage = goPage;

function renderStats(allStatus){
  const today = new Date().toISOString().slice(0,10);
  let okCount=0, dueCount=0, overdueCount=0, neverCount=0;
  EQUIPMENTS.forEach((eq, i)=>{
    const s = allStatus[i];
    [1,7,30].forEach(p=>{
      const last = p===1?s.daily : (p===7?s.weekly:s.monthly);
      const st = cellStatus(p, last, today);
      if(st==='ok') okCount++;
      else if(st==='due') dueCount++;
      else if(st==='overdue') overdueCount++;
      else neverCount++;
    });
  });
  const total = EQUIPMENTS.length * 3;
  document.getElementById('statsLine').innerHTML =
    '총 <b>'+total+'</b> · ' +
    '<span style="color:var(--ok)">정상 '+okCount+'</span> · ' +
    '<span style="color:var(--warn)">도래 '+dueCount+'</span> · ' +
    '<span style="color:var(--ng)">지연 '+overdueCount+'</span> · ' +
    '<span style="color:#7f1d1d">미점검 '+neverCount+'</span>';
}

async function loadStatus(){
  document.getElementById('grid').innerHTML = '<div class="loading">⏳ 측정기 점검 현황 조회 중...</div>';
  document.getElementById('statsLine').textContent = '로딩...';
  try{
    const allStatus = await Promise.all(EQUIPMENTS.map(eq => fetchEqStatus(eq.name)));
    document.getElementById('grid').innerHTML = EQUIPMENTS.map((eq, i) => renderCard(eq, allStatus[i])).join('');
    renderStats(allStatus);
  }catch(e){
    document.getElementById('grid').innerHTML = '<div class="empty" style="color:var(--ng)">❌ 조회 실패: '+e.message+'</div>';
  }
}

window.addEventListener('DOMContentLoaded', loadStatus);
</script>

</body>
</html>
